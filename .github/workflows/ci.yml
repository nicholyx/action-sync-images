# 工作流名称
name: CI
# 工作流运行时显示名称
run-name: CI · ${{ github.event_name }} · ${{ github.ref_name }}

# 怎样触发工作流
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 只读权限就够了：CI 不写回仓库，这是最小权限原则的体现。
# 注意那些需要写权限的工作流（labeler / stale）在各自文件里单独声明。
permissions:
  contents: read

# 同一分支连推多次时，取消掉旧的运行，省额度也省等待
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 固定版本以保证 CI 结果可复现
  ACTIONLINT_VERSION: "1.7.12"

# 工作流程任务（通常含有一个或多个步骤）
jobs:
  # ---------------------------------------------------------------------------
  # 工作流静态检查
  # actionlint 能发现 YAML 层面看不出、但运行时会炸的问题：
  # 表达式拼写错误、上下文用错、run 块里的 shell 问题等。
  # ---------------------------------------------------------------------------
  actionlint:
    name: 工作流静态检查
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # CI 用不到 git 凭证（推送走 docker 凭证），不持久化，
          # 让 checkout 之后的任何脚本都拿不到 GITHUB_TOKEN
          persist-credentials: false

      - name: 安装 actionlint
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL "$url" | tar -xz actionlint
          ./actionlint --version

      - name: 运行 actionlint
        run: ./actionlint -color

  # ---------------------------------------------------------------------------
  # YAML 风格检查
  # ---------------------------------------------------------------------------
  yamllint:
    name: YAML 风格检查
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # CI 用不到 git 凭证（推送走 docker 凭证），不持久化，
          # 让 checkout 之后的任何脚本都拿不到 GITHUB_TOKEN
          persist-credentials: false

      - name: 安装 yamllint
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          pipx install yamllint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: 运行 yamllint
        run: yamllint -c .yamllint .github/

  # ---------------------------------------------------------------------------
  # Shell 脚本检查
  # ---------------------------------------------------------------------------
  shellcheck:
    name: Shell 脚本检查
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # CI 用不到 git 凭证（推送走 docker 凭证），不持久化，
          # 让 checkout 之后的任何脚本都拿不到 GITHUB_TOKEN
          persist-credentials: false

      - name: 运行 shellcheck
        run: shellcheck -x scripts/*.sh

      - name: bash 语法检查
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          for f in scripts/*.sh; do
            echo "检查 ${f}"
            bash -n "$f"
          done

  # ---------------------------------------------------------------------------
  # sync.sh 冒烟测试
  # 用 dry-run 验证脚本能正确解析输入、拆分批量镜像、拼出目标仓库名，
  # 并确认非法输入会被拦下。不需要任何真实凭证。
  # ---------------------------------------------------------------------------
  smoke-test:
    name: sync.sh 冒烟测试
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # CI 用不到 git 凭证（推送走 docker 凭证），不持久化，
          # 让 checkout 之后的任何脚本都拿不到 GITHUB_TOKEN
          persist-credentials: false

      - name: 安装 skopeo
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo

      - name: 验证批量输入解析与目标名生成
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          ./scripts/sync.sh \
            --src "registry.k8s.io/pause:3.9, registry.k8s.io/coredns/coredns:v1.11.1" \
            --src "nginx:1.27" \
            --dest registry.example.com/smoke \
            --dry-run

      - name: 验证非法镜像引用会被拦下
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 两种情况都必须失败：带协议前缀的、缺少 tag 的
          for bad in "https://example.com/nginx:1.27" "nginx"; do
            echo "--- 期望被拒绝：${bad}"
            set +e
            ./scripts/sync.sh --src "$bad" --dest registry.example.com/smoke --dry-run
            code=$?
            set -e

            if [[ "$code" -ne 2 ]]; then
              echo "::error::输入「${bad}」应被判定为同步失败（期望退出码 2，实际 ${code}）"
              exit 1
            fi
            echo "✓ 已正确拒绝（退出码 ${code}）"
          done

      - name: 验证缺少必填参数时报错
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          set +e
          ./scripts/sync.sh --src "nginx:1.27" >/dev/null 2>&1
          code=$?
          set -e
          if [[ "$code" -ne 1 ]]; then
            echo "::error::缺少 --dest 时应以退出码 1 结束，实际为 ${code}"
            exit 1
          fi
          echo "✓ 缺少必填参数时正确报错"

      - name: 验证并发、超时与增量跳过参数
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 并发同步：3 个镜像、并发度 3，dry-run 下应全部走完且结果顺序与输入一致
          output="$(./scripts/sync.sh \
            --src "nginx:1.27,redis:7.4,alpine:3.20" \
            --dest registry.example.com/smoke \
            --concurrency 3 --timeout 120 --skip-existing --dry-run 2>&1)"

          echo "$output"

          # 结果表应按输入顺序排列。并发下各镜像的完成顺序是不确定的，
          # 结果经由带序号的临时文件收集后再按序读回，这里正是在守住这一点。
          order="$(printf '%s\n' "$output" | awk '/✓/ && /^ / {print $NF}' | paste -sd, -)"
          expected="nginx:1.27,redis:7.4,alpine:3.20"
          if [[ "$order" != "$expected" ]]; then
            echo "::error::并发模式下结果顺序异常：期望 ${expected}，实际 ${order}"
            exit 1
          fi
          echo "✓ 并发同步执行完毕，结果顺序与输入一致"

      - name: 验证非法参数被立即拒绝
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 这些都应该以退出码 1（参数错误）结束，而不是跑到一半才炸
          check_reject() {
            local desc="$1"; shift
            set +e
            "$@" >/dev/null 2>&1
            local code=$?
            set -e
            if [[ "$code" -ne 1 ]]; then
              echo "::error::${desc}：期望退出码 1，实际 ${code}"
              exit 1
            fi
            echo "✓ 已拒绝：${desc}"
          }

          check_reject "并发度非数字" ./scripts/sync.sh --src "nginx:1.27" --dest r.example.com/x --concurrency abc
          check_reject "并发度为 0"   ./scripts/sync.sh --src "nginx:1.27" --dest r.example.com/x --concurrency 0
          check_reject "超时为非数字" ./scripts/sync.sh --src "nginx:1.27" --dest r.example.com/x --timeout soon
          check_reject "精确目标配多个镜像" ./scripts/sync.sh --src "nginx:1.27,redis:7.4" --dest-exact h.example.com/a --dry-run

      - name: 验证镜像筛选
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          SRC="registry.k8s.io/kube-apiserver:v1.31.0,registry.k8s.io/pause:3.9,nginx:1.27"

          # --filter 只同步匹配项。同时守住顺序：被排除的项仍占位，
          # 结果表的顺序必须与输入一致（与并发模式下的序号保证是同一件事）。
          output="$(./scripts/sync.sh --src "$SRC" --dest r.example.com/x \
            --filter 'kube-' --dry-run 2>&1)"
          echo "$output"

          order="$(printf '%s\n' "$output" | awk '/^ [✓⊘✗]/ {print $NF}' | paste -sd, -)"
          expected="registry.k8s.io/kube-apiserver:v1.31.0,registry.k8s.io/pause:3.9,nginx:1.27"
          if [[ "$order" != "$expected" ]]; then
            echo "::error::筛选后结果顺序异常：期望 ${expected}，实际 ${order}"
            exit 1
          fi

          if ! grep -q '成功 1 个' <<<"$output"; then
            echo "::error::--filter 未按预期只保留 1 个镜像"
            exit 1
          fi
          echo "✓ --filter 生效，且结果顺序与输入一致"

          # --exclude 跳过匹配项（3 个里排掉 kube-apiserver，剩 2 个应成功）
          output="$(./scripts/sync.sh --src "$SRC" --dest r.example.com/x \
            --exclude 'kube-' --dry-run 2>&1)"
          if ! grep -q '成功 2 个' <<<"$output"; then
            echo "::error::--exclude 未按预期排除 1 个镜像"
            exit 1
          fi
          if ! grep -q 'nginx:1.27' <<<"$output"; then
            echo "::error::--exclude 把不该排除的镜像也排掉了"
            exit 1
          fi
          echo "✓ --exclude 生效"

      - name: 验证筛选的边界情况
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 非法正则必须在同步开始前就被拒绝，而不是跑到一半才炸
          for bad in '[' '(' 'a{2,1}'; do
            set +e
            ./scripts/sync.sh --src "nginx:1.27" --dest r.example.com/x \
              --filter "$bad" --dry-run >/dev/null 2>&1
            code=$?
            set -e
            if [[ "$code" -ne 1 ]]; then
              echo "::error::非法正则「${bad}」应以退出码 1 拒绝，实际 ${code}"
              exit 1
            fi
          done
          echo "✓ 非法正则被立即拒绝"

          # 全部被筛掉时必须明确失败。静默地「不同步任何镜像却报成功」
          # 是最危险的结果——使用者会以为同步完成了。
          set +e
          ./scripts/sync.sh --src "nginx:1.27,redis:7.4" --dest r.example.com/x \
            --filter 'nomatch-any' --dry-run >/dev/null 2>&1
          code=$?
          set -e
          if [[ "$code" -ne 1 ]]; then
            echo "::error::全部镜像被筛掉时应以退出码 1 结束，实际 ${code}"
            exit 1
          fi
          echo "✓ 全部被筛掉时明确失败"

          # 有排除项但仍有镜像可同步时，属于正常成功——排除是使用者的意图，
          # 不是失败。这里防的是把 excluded 误算成 fail 导致退出码变成 2。
          set +e
          ./scripts/sync.sh --src "nginx:1.27,redis:7.4" --dest r.example.com/x \
            --exclude 'redis' --dry-run >/dev/null 2>&1
          code=$?
          set -e
          if [[ "$code" -ne 0 ]]; then
            echo "::error::筛选后仍有镜像可同步时应以退出码 0 结束，实际 ${code}"
            exit 1
          fi
          echo "✓ 排除项不会被误判为失败"

      - name: 验证 regctl 路径的平台列表解析
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 这组断言守的是一个曾经长期存在的缺陷：平台列表用
          #   printf '%s' "$platforms" | tr ',' '\n'
          # 逐行读取，而 printf 不输出结尾换行，read 读到没有换行收尾的最后一段时
          # 会返回非零、循环体不执行。结果：单平台一个都读不到而直接失败，
          # 多平台则**静默丢掉最后一个**——arm64 没同步，却没有任何报错。
          #
          # 之所以能守住，是因为 dry-run 现在打印的是真正会执行的 platform_args，
          # 而不是拿输入去复述一遍。dry-run 一旦与实际行为脱节就失去意义。

          # 单平台：曾经完全无法使用
          output="$(./scripts/sync.sh --src nginx:1.27 --dest r.example.com/x \
            --strip-attestation --platforms linux/amd64 --dry-run 2>&1)"
          echo "$output"
          if ! grep -q -- '--platform linux/amd64' <<<"$output"; then
            echo "::error::单平台未能解析出任何平台"
            exit 1
          fi
          echo "✓ 单平台解析正确"

          # 多平台：曾经丢掉最后一个
          output="$(./scripts/sync.sh --src nginx:1.27 --dest r.example.com/x \
            --strip-attestation --platforms linux/amd64,linux/arm64,linux/arm/v7 --dry-run 2>&1)"
          echo "$output"

          count="$(grep -o -- '--platform ' <<<"$output" | wc -l | tr -d ' ')"
          if [[ "$count" -ne 3 ]]; then
            echo "::error::期望传递 3 个平台，实际 ${count} 个——最后一个平台很可能被丢弃了"
            exit 1
          fi

          # 只数个数还不够：三个位置都对才算真的没丢
          for p in linux/amd64 linux/arm64 linux/arm/v7; do
            if ! grep -q -- "--platform ${p}" <<<"$output"; then
              echo "::error::平台 ${p} 未被传递"
              exit 1
            fi
          done
          echo "✓ 多平台全部传递，未丢弃最后一个"

      - name: 验证重试参数的作用范围
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # regctl 路径下 --retries 到不了 regclient，必须告警而不是静默忽略。
          # 静默失效比直接报错更危险：使用者会以为自己控制住了重试次数，
          # 而这个错误认知要等到真正需要重试时才暴露。
          output="$(./scripts/sync.sh --src nginx:1.27 --dest r.example.com/x \
            --strip-attestation --platforms linux/amd64 \
            --retries 10 --retry-delay 5s --dry-run 2>&1)"

          if ! grep -q 'retries 10 在 regctl 路径下不生效' <<<"$output"; then
            echo "::error::regctl 路径下显式传入 --retries 时应给出告警"
            echo "$output"
            exit 1
          fi
          if ! grep -q 'retry-delay 5s 仅对 skopeo 生效' <<<"$output"; then
            echo "::error::regctl 路径下显式传入 --retry-delay 时应给出告警"
            echo "$output"
            exit 1
          fi
          echo "✓ regctl 路径下失效的参数有明确告警"

          # 未显式指定时不该打扰使用者——默认值不生效是预期内的，不值得每次都刷屏
          output="$(./scripts/sync.sh --src nginx:1.27 --dest r.example.com/x \
            --strip-attestation --platforms linux/amd64 --dry-run 2>&1)"
          if grep -q '不生效' <<<"$output"; then
            echo "::error::未显式传入 --retries / --retry-delay 时不应产生告警"
            echo "$output"
            exit 1
          fi
          echo "✓ 默认情况下不产生多余告警"

          # skopeo 路径下 --retry-delay 必须真的进入命令
          output="$(./scripts/sync.sh --src nginx:1.27 --dest r.example.com/x \
            --retry-delay 10s --dry-run 2>&1)"
          if ! grep -q -- '--retry-delay 10s' <<<"$output"; then
            echo "::error::--retry-delay 未传递给 skopeo"
            echo "$output"
            exit 1
          fi
          echo "✓ --retry-delay 正确传递给 skopeo"

      - name: 验证 history.sh 能从报告中聚合趋势
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          work="$(mktemp -d)"

          # 造两份报告：一份全成功，一份含一个非法镜像（会被记为失败）
          ./scripts/sync.sh --src "nginx:1.27,redis:7.4" --dest r.example.com/x \
            --dry-run --report-dir "${work}/run1" >/dev/null 2>&1

          # 这一条**故意**要失败（那份报告里得有一条 failed 记录），
          # 所以它返回 2 是预期内的。不关掉 errexit 的话，下面所有断言都不会执行——
          # 而失败信息只会是一句没头没尾的「exit code 2」。
          set +e
          ./scripts/sync.sh --src "nginx:1.27,https://bad.example.com/x:1" --dest r.example.com/x \
            --dry-run --report-dir "${work}/run2" >/dev/null 2>&1
          set -e

          set +e
          out="$(./scripts/history.sh --dir "$work" 2>/dev/null)"
          code=$?
          set -e

          echo "$out"

          # 累计应为 4 个镜像次（2 + 2）
          if ! grep -q '累计同步 \*\*4\*\* 个镜像次' <<<"$out"; then
            echo "::error::history.sh 的累计统计不正确"
            exit 1
          fi

          # 失败过的镜像必须出现在表里——聚合的意义正在于此
          if ! grep -q 'bad.example.com' <<<"$out"; then
            echo "::error::history.sh 未列出失败过的镜像"
            exit 1
          fi

          # 历史中有失败即以退出码 2 结束，便于在脚本或 CI 里据此判断
          if [[ "$code" -ne 2 ]]; then
            echo "::error::历史中有失败时应以退出码 2 结束，实际 ${code}"
            exit 1
          fi
          echo "✓ 汇总与退出码正确"

          # 单镜像查询
          out="$(./scripts/history.sh --dir "$work" --image nginx:1.27 2>/dev/null || true)"
          if ! grep -q 'nginx:1.27' <<<"$out"; then
            echo "::error::--image 查询未返回结果"
            exit 1
          fi

          # 查询一个不存在的镜像应给出提示，而不是空表
          out="$(./scripts/history.sh --dir "$work" --image no-such:1.0 2>/dev/null || true)"
          if ! grep -q '没有找到镜像' <<<"$out"; then
            echo "::error::--image 查不到时应给出明确提示"
            exit 1
          fi
          echo "✓ 查询模式正确"

      - name: 验证耗时排行
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          work="$(mktemp -d)"

          # 构造两份报告：c 镜像一次很快、一次超时（600s），a 镜像稳定地慢。
          # 期望 --slowest 按**平均**排序把 c 排第一，同时波动范围能暴露出
          # 它是「偶尔慢」而不是「一直慢」——这正是排行存在的意义。
          for d in r1 r2; do mkdir -p "${work}/${d}"; done
          cat > "${work}/r1/sync-report.json" <<'JSON'
          {"generated_at": "2026-09-11T01:00:00Z", "total": 3, "success": 3, "skipped": 0, "failed": 0,
           "images": [
            {"source": "big.example.com/a:1", "dest": "d/a", "status": "success", "seconds": 100},
            {"source": "mid.example.com/b:1", "dest": "d/b", "status": "success", "seconds": 30},
            {"source": "flaky.example.com/c:1", "dest": "d/c", "status": "success", "seconds": 5}
           ]}
          JSON
          cat > "${work}/r2/sync-report.json" <<'JSON'
          {"generated_at": "2026-09-11T02:00:00Z", "total": 3, "success": 2, "skipped": 0, "failed": 1,
           "images": [
            {"source": "big.example.com/a:1", "dest": "d/a", "status": "success", "seconds": 200},
            {"source": "mid.example.com/b:1", "dest": "d/b", "status": "success", "seconds": 26},
            {"source": "flaky.example.com/c:1", "dest": "d/c", "status": "failed", "seconds": 600}
           ]}
          JSON

          out="$(./scripts/history.sh --dir "$work" --slowest 5 2>/dev/null || true)"
          echo "$out"

          # c 的平均 (5+600)/2=302.5 应排在 a 的平均 150 之前
          if [[ "$(grep -n 'flaky.example.com' <<<"$out" | head -1 | cut -d: -f1)" -gt \
                "$(grep -n 'big.example.com' <<<"$out" | head -1 | cut -d: -f1)" ]]; then
            echo "::error::--slowest 未按平均耗时降序排列"
            exit 1
          fi
          grep -q '302.5s' <<<"$out" || { echo "::error::平均耗时计算不正确"; exit 1; }
          grep -q '5s ~ 600s' <<<"$out" || { echo "::error::波动范围不正确"; exit 1; }
          echo "✓ --slowest 按平均排序，波动范围正确"

          # sync.sh 一侧：dry-run 下秒数全为 0，排行应自觉隐去——
          # 全是 0s 的榜单没有信息量，只会占地方
          rm -rf /tmp/rank && mkdir -p /tmp/rank
          ./scripts/sync.sh --src "nginx:1.27,redis:7.4,alpine:3.20" --dest r.example.com/x \
            --dry-run --report-dir /tmp/rank >/dev/null 2>&1
          if grep -q '最慢的同步记录' /tmp/rank/sync-report.md; then
            echo "::error::耗时全为 0 时不应输出排行"
            exit 1
          fi
          echo "✓ 无有效耗时数据时排行自动隐去"

      - name: 验证完整性校验的差异判定
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # verify_integrity 的核心逻辑用 mock 验证：真实环境里「目标与源不一致」
          # 这个状态没法稳定端到端构造——校验紧跟同步执行，而同步本身会覆盖掉
          # 不一致的目标。mock 的对象是 skopeo_inspect_raw（inspect 的唯一入口），
          # 平台摘要提取走的仍是生产代码里的 platform_digest_map。
          sed -n '/^platform_digest_map()/,/^}/p' scripts/sync.sh > /tmp/verify-fns.sh
          sed -n '/^verify_integrity()/,/^}/p' scripts/sync.sh >> /tmp/verify-fns.sh

          cat > /tmp/test-verify.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          source /tmp/verify-fns.sh
          skopeo_inspect_raw() {
            case "$1" in
              *good*)    printf '{"manifests":[{"platform":{"os":"linux","architecture":"amd64"},"digest":"sha256:aaa"},{"platform":{"os":"linux","architecture":"arm64"},"digest":"sha256:bbb"}]}' ;;
              *missing*) printf '{"manifests":[{"platform":{"os":"linux","architecture":"amd64"},"digest":"sha256:aaa"}]}' ;;
              *empty*)   printf '' ;;
              *)         printf '{"manifests":[]}' ;;
            esac
          }
          run() { set +e; detail="$(verify_integrity "$1" "$2" 2>/dev/null)"; rc=$?; set -e; }

          run good-src good-dest
          [[ $rc -eq 0 ]] || { echo "FAIL: 一致场景应为 rc=0，实际 $rc"; exit 1; }

          run good-src missing-dest
          [[ $rc -eq 1 ]] || { echo "FAIL: 缺平台场景应为 rc=1，实际 $rc"; exit 1; }
          grep -q 'linux/arm64' <<<"$detail" || { echo "FAIL: 未指出缺失的平台"; exit 1; }

          run empty-src good-dest
          [[ $rc -eq 2 ]] || { echo "FAIL: 源不可读应为 rc=2，实际 $rc"; exit 1; }

          run good-src empty-dest
          [[ $rc -eq 2 ]] || { echo "FAIL: 目标不可读应为 rc=2，实际 $rc"; exit 1; }

          run plain-src plain-dest
          [[ $rc -eq 0 ]] || { echo "FAIL: 单平台一致应为 rc=0，实际 $rc"; exit 1; }

          echo "MOCK-OK"
          SCRIPT
          bash /tmp/test-verify.sh | grep -q 'MOCK-OK' || {
            echo "::error::完整性校验的差异判定不符合预期"
            exit 1
          }
          echo "✓ 校验的差异判定正确（一致 / 缺平台 / 不可校验 / 单平台）"

          # --verify 未开启时行为完全不变：输出里不应出现校验相关字样
          output="$(./scripts/sync.sh --src "nginx:1.27,redis:7.4,alpine:3.20" --dest r.example.com/x \
            --dry-run 2>&1)"
          if grep -q '校验' <<<"$output"; then
            echo "::error::未开启 --verify 时不应出现校验行为"
            exit 1
          fi
          echo "✓ 默认行为不变"

      - name: 验证连续失败计数的判定逻辑
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 跨运行状态无法在单次运行中端到端产生（需要多次真实失败的运行），
          # 所以与校验一样用「提取生产函数 + 伪造输入」的方式测判定逻辑本身。
          sed -n '/^readonly FIELD_SEP=/p' scripts/sync.sh > /tmp/notify-fns.sh
          sed -n '/^count_consecutive_failures()/,/^}/p' scripts/sync.sh >> /tmp/notify-fns.sh
          sed -n '/^gather_alert_images()/,/^}/p' scripts/sync.sh >> /tmp/notify-fns.sh

          cat > /tmp/test-notify.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          source /tmp/notify-fns.sh
          log_info() { printf '[信息] %s\n' "$*" >&2; }

          FS="$(printf '\x1f')"
          NOTIFY_AFTER_FAILURES=3

          # 历史：a 连续失败 2 次；b 上次成功（清零）；c 从未出现
          hist="$(mktemp)"
          {
            printf '2026-09-09T01:00:00Z%sa.example.com/x:1%sfailed\n' "$FS" "$FS"
            printf '2026-09-09T01:00:00Z%sb.example.com/y:1%sfailed\n' "$FS" "$FS"
            printf '2026-09-10T01:00:00Z%sa.example.com/x:1%sfailed\n' "$FS" "$FS"
            printf '2026-09-10T01:00:00Z%sb.example.com/y:1%ssuccess\n' "$FS" "$FS"
          } > "$hist"

          R_SRC=(a.example.com/x:1 b.example.com/y:1 c.example.com/z:1)
          R_STATUS=(failed failed failed)

          out="$(gather_alert_images "$hist")"

          grep -q "$(printf 'a.example.com/x:1\x1f3')" <<<"$out" \
            || { echo "FAIL: a 应为连续 3 次（2 历史 + 1 本次）"; exit 1; }
          grep -q 'b.example.com' <<<"$out" \
            && { echo "FAIL: b 上次成功应清零，未达阈值"; exit 1; }
          grep -q 'c.example.com' <<<"$out" \
            && { echo "FAIL: c 无历史应按首次处理"; exit 1; }

          # 阈值 1 = 历史行为：全部失败都通知
          NOTIFY_AFTER_FAILURES=1
          out="$(gather_alert_images "$hist")"
          [[ "$(grep -c 'example.com' <<<"$out")" -eq 3 ]] \
            || { echo "FAIL: 阈值 1 应通知全部 3 个失败"; exit 1; }

          echo "MOCK-OK"
          SCRIPT
          bash /tmp/test-notify.sh | grep -q 'MOCK-OK' || {
            echo "::error::连续失败计数判定不符合预期"
            exit 1
          }
          echo "✓ 连续失败计数正确（累计 / 清零 / 无历史 / 阈值 1 兼容）"

          # 参数校验
          set +e
          ./scripts/sync.sh --src nginx:1.27 --dest r.example.com/x \
            --notify-after-failures 0 --dry-run >/dev/null 2>&1
          code=$?
          set -e
          [[ "$code" -eq 1 ]] || { echo "::error::--notify-after-failures 0 应被拒绝（退出码 1），实际 ${code}"; exit 1; }
          echo "✓ 非法阈值被拒绝"

      - name: 验证凭证映射文件
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          cred="$(mktemp)"
          chmod 600 "$cred"
          { echo "# 注释行"
            echo "harbor.internal.example.com  alice   token-a"
            echo ""
            echo "ghcr.io bob ghp_xxx"
          } > "$cred"

          # 多 host 映射：装载列表只含文件中的 host，
          # 未匹配的镜像走匿名——这是按仓库映射存在的意义
          output="$(./scripts/sync.sh \
            --src "harbor.internal.example.com/lib/a:1,ghcr.io/b/b:2,nginx:1.27" \
            --dest r.example.com/x --src-credentials "$cred" --dry-run 2>&1)"
          echo "$output"

          grep -q '凭证已装载（2 个仓库）' <<<"$output" \
            || { echo "::error::凭证映射未正确装载两个 host"; exit 1; }
          echo "✓ 多 host 映射正确，公开镜像走匿名"

          # 与 --src-username 互斥：混用的语义只能靠猜，直接拒绝
          set +e
          ./scripts/sync.sh --src nginx:1.27 --dest r.example.com/x \
            --src-credentials "$cred" --src-username alice --dry-run >/dev/null 2>&1
          code=$?
          set -e
          [[ "$code" -eq 1 ]] || { echo "::error::混用应退出码 1，实际 ${code}"; exit 1; }
          echo "✓ 与单值凭证互斥"

          # 格式错误的行：指明行号、中止同步，且不回显行内容（行里有密码）
          bad="$(mktemp)"
          chmod 600 "$bad"
          { echo "host1 u1 p1"; echo "host2 只有俩"; } > "$bad"
          set +e
          output="$(./scripts/sync.sh --src nginx:1.27 --dest r.example.com/x \
            --src-credentials "$bad" --dry-run 2>&1)"
          code=$?
          set -e
          [[ "$code" -eq 1 ]] || { echo "::error::格式错误应退出码 1，实际 ${code}"; exit 1; }
          grep -q '第 2 行格式错误' <<<"$output" \
            || { echo "::error::未指明出错的行号"; exit 1; }
          if grep -q '只有俩' <<<"$output"; then
            echo "::error::错误信息回显了行内容（含密码）"
            exit 1
          fi
          echo "✓ 格式错误报行号且不回显行内容"

          # 环境变量方式（CI 的 Secret 注入路径）：值为内容而非路径。
          # cred 内容有两条有效条目，无论 --src 用到哪条，装载的都是全部
          output="$(SYNC_SRC_CREDENTIALS="$(cat "$cred")" \
            ./scripts/sync.sh --src "ghcr.io/b/b:2" --dest r.example.com/x --dry-run 2>&1)"
          grep -q '凭证已装载（2 个仓库）' <<<"$output" \
            || { echo "::error::SYNC_SRC_CREDENTIALS 未生效"; exit 1; }
          echo "✓ 环境变量注入（Secret 场景）可用"

  # ---------------------------------------------------------------------------
  # 工作流安全扫描
  # zizmor 专查 GitHub Actions 的已知反模式：凭证持久化、危险触发器、
  # 依赖未锁定等。豁免项集中放在 .github/zizmor.yml，每条写明理由。
  # 容器按版本 pin（与 action 同一个思路：工具本身也是供应链的一环）。
  # ---------------------------------------------------------------------------
  zizmor:
    name: 工作流安全扫描
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 运行 zizmor
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          # 挂载只读（:ro）：扫描器没有理由改动被扫描的文件
          docker run --rm -v "$PWD":/repo:ro \
            ghcr.io/zizmorcore/zizmor:1.30.1 /repo --no-online-audits

  # ---------------------------------------------------------------------------
  # 真实同步集成测试
  #
  # 与冒烟测试的关键区别：这里**真的会推送镜像**。
  #
  # v1.1.0 期间暴露的三个缺陷——跳过判定失效、目标地址携带 digest、结果文件
  # 字段错位——全部发生在真实推送路径上，而 dry-run 刻意绕开了那条路径，
  # 因此一个都抓不到。这个 job 用本地 registry 容器补上这段验证，
  # 不需要任何外部凭证。
  # ---------------------------------------------------------------------------
  integration-test:
    name: 真实同步集成测试
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # CI 用不到 git 凭证（推送走 docker 凭证），不持久化，
          # 让 checkout 之后的任何脚本都拿不到 GITHUB_TOKEN
          persist-credentials: false

      - name: 启动本地 registry
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          docker run -d -p 5000:5000 --name registry registry:2

          # 等 registry 就绪，最多 30 秒
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:5000/v2/ >/dev/null 2>&1; then
              echo "✓ 本地 registry 已就绪"
              exit 0
            fi
            sleep 1
          done

          echo "::error::本地 registry 启动超时"
          docker logs registry
          exit 1

      - name: 准备源镜像
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          # hello-world 极小，适合作为测试素材
          skopeo copy --dest-tls-verify=false \
            docker://docker.io/library/hello-world:latest \
            docker://localhost:5000/source/hello:latest

      - name: 首次同步（真实推送）
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          # 顺带走一遍 --verify 的真实路径：mock 只能证明判定逻辑正确，
          # 这里证明 inspect + 比对在真实 registry 上也能跑通
          output="$(./scripts/sync.sh \
            --src localhost:5000/source/hello:latest \
            --dest localhost:5000/dest \
            --tls-verify false --concurrency 1 --verify 2>&1)"
          echo "$output"

          if ! grep -q '校验通过' <<<"$output"; then
            echo "::error::开启 --verify 后未看到校验通过"
            exit 1
          fi
          echo "✓ 真实同步 + 校验通过"

          # 单目标没有中转的收益，必须保持常规路径
          if grep -q '本地中转' <<<"$output"; then
            echo "::error::单目标同步不应走本地中转"
            exit 1
          fi
          echo "✓ 单目标保持常规路径"

      - name: 断言目标存在且内容与源一致
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          dest="localhost:5000/dest/localhost_5000_source_hello:latest"

          if ! skopeo inspect --tls-verify=false "docker://${dest}" >/dev/null 2>&1; then
            echo "::error::目标镜像不存在：${dest}"
            exit 1
          fi

          src_sum="$(skopeo inspect --raw --tls-verify=false docker://localhost:5000/source/hello:latest | openssl dgst -sha256 | awk '{print $NF}')"
          dest_sum="$(skopeo inspect --raw --tls-verify=false "docker://${dest}" | openssl dgst -sha256 | awk '{print $NF}')"

          if [[ "$src_sum" != "$dest_sum" ]]; then
            echo "::error::源与目标内容不一致（${src_sum} != ${dest_sum}）"
            exit 1
          fi
          echo "✓ 目标存在，且内容与源完全一致"

      - name: 再次同步应被跳过
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          output="$(./scripts/sync.sh \
            --src localhost:5000/source/hello:latest \
            --dest localhost:5000/dest \
            --tls-verify false --skip-existing 2>&1)"
          echo "$output"

          # 这正是 #13 要防住的回归：跳过判定曾因多层原因完全失效
          if ! grep -q '跳过 1 个' <<<"$output"; then
            echo "::error::第二次同步未被跳过，增量同步已失效"
            exit 1
          fi
          echo "✓ 增量跳过生效"

      - name: 源内容变化后应重新同步
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 用另一个镜像覆盖同一个 tag，内容随之改变
          skopeo copy --dest-tls-verify=false \
            docker://docker.io/library/alpine:latest \
            docker://localhost:5000/source/hello:latest

          output="$(./scripts/sync.sh \
            --src localhost:5000/source/hello:latest \
            --dest localhost:5000/dest \
            --tls-verify false --skip-existing 2>&1)"
          echo "$output"

          if ! grep -q '成功 1 个' <<<"$output"; then
            echo "::error::源内容已变化却仍被跳过，跳过判定过于宽松"
            exit 1
          fi
          echo "✓ 内容变化后正确重新同步"

      - name: 多目标同步
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 同一个源同时推送到两个目标。两个目标都需要推送，
          # 会走本地 OCI 中转——源只拉取一次，这是多目标的默认行为。
          # 注意 set +e 包裹：sync.sh 有失败时退出码非 0，而 output="$(…)"
          # 的退出码就是它的退出码，errexit 会在这里直接中断步骤、
          # 吞掉全部输出——排查时只剩一句 exit code 1。
          set +e
          output="$(./scripts/sync.sh \
            --src localhost:5000/source/hello:latest \
            --dest localhost:5000/mirror-a \
            --dest localhost:5000/mirror-b \
            --tls-verify false --concurrency 1 2>&1)"
          sync_code=$?
          set -e
          echo "$output"

          if [[ "$sync_code" -ne 0 ]]; then
            echo "::error::多目标中转同步失败（退出码 ${sync_code}），输出见上"
            exit 1
          fi

          if ! grep -q '源已拉取到本地中转' <<<"$output"; then
            echo "::error::多目标同步未走本地中转（源被多次拉取）"
            exit 1
          fi
          echo "✓ 多目标走了本地中转（源只拉取一次）"

          # 两个目标都应存在——多目标最容易出的问题是「只推了第一个」。
          # 中转改写了推送路径，更要确认每个目标的内容都完整。
          for repo in mirror-a mirror-b; do
            dest="localhost:5000/${repo}/localhost_5000_source_hello:latest"
            if ! skopeo inspect --tls-verify=false "docker://${dest}" >/dev/null 2>&1; then
              echo "::error::多目标同步后 ${repo} 中缺少镜像：${dest}"
              exit 1
            fi
            echo "✓ ${repo} 中存在目标镜像"
          done

          # 中转推送的内容必须与源一致（逐目标比对平台摘要）
          output="$(./scripts/sync.sh \
            --src localhost:5000/source/hello:latest \
            --dest localhost:5000/mirror-a \
            --tls-verify false --skip-existing 2>&1)"
          if ! grep -q '目标已是最新' <<<"$output"; then
            echo "::error::中转推送的内容与源不一致（增量跳过未生效）"
            exit 1
          fi
          echo "✓ 中转推送内容与源一致"

      # -----------------------------------------------------------------------
      # 私有源：走到认证这条真实路径上
      #
      # 前面所有步骤用的都是匿名 registry，凭证相关的代码一次都没被执行过。
      # 这里起一个需要 htpasswd 认证的 registry，验证三件事：
      # 无凭证确实会失败、有凭证确实能成功、凭证不出现在日志里。
      # -----------------------------------------------------------------------
      - name: 启动需要认证的源 registry
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # registry 的 htpasswd 认证只认 bcrypt。openssl 只能生成 apr1，
          # 用它写出的密码文件会让每一次登录都失败——而且失败得毫无线索。
          sudo apt-get install -y -qq apache2-utils

          mkdir -p /tmp/registry-auth
          htpasswd -Bbn testuser 's3cr3t-pass' > /tmp/registry-auth/htpasswd

          docker run -d -p 5001:5000 --name registry-auth \
            -v /tmp/registry-auth:/auth \
            -e REGISTRY_AUTH=htpasswd \
            -e REGISTRY_AUTH_HTPASSWD_REALM=Registry-Realm \
            -e REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd \
            registry:2

          for _ in $(seq 1 30); do
            # 401 正是「服务已就绪且鉴权生效」的标志——这里期望的就是匿名被拒
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5001/v2/ || true)"
            if [[ "$code" == "401" ]]; then
              echo "✓ 认证 registry 已就绪（匿名访问被拒）"
              exit 0
            fi
            sleep 1
          done

          echo "::error::认证 registry 启动超时"
          docker logs registry-auth
          exit 1

      - name: 推送一个镜像作为私有源
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          skopeo copy --dest-tls-verify=false \
            --dest-creds 'testuser:s3cr3t-pass' \
            docker://docker.io/library/hello-world:latest \
            docker://localhost:5001/private/hello:latest

      - name: 未提供凭证时应失败
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          set +e
          ./scripts/sync.sh \
            --src localhost:5001/private/hello:latest \
            --dest localhost:5000/from-private \
            --tls-verify false --concurrency 1 >/dev/null 2>&1
          code=$?
          set -e

          if [[ "$code" -ne 2 ]]; then
            echo "::error::未提供凭证时同步私有镜像应失败（期望退出码 2，实际 ${code}）"
            exit 1
          fi
          echo "✓ 无凭证时正确失败，没有假装成功"

      - name: 提供凭证后应成功，且凭证不落日志
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          output="$(./scripts/sync.sh \
            --src localhost:5001/private/hello:latest \
            --dest localhost:5000/from-private \
            --tls-verify false --concurrency 1 \
            --src-username testuser --src-password 's3cr3t-pass' 2>&1)"
          echo "$output"

          if ! grep -q '成功 1 个' <<<"$output"; then
            echo "::error::提供凭证后仍未同步成功"
            exit 1
          fi
          echo "✓ 私有源同步成功"

          # 这两条是硬约束：凭证一旦进了日志就等于泄露，
          # 而 Actions 日志是留存 90 天、对仓库协作者可见的。
          if grep -q 's3cr3t-pass' <<<"$output"; then
            echo "::error::密码出现在了日志中"
            exit 1
          fi
          if grep -q 'testuser' <<<"$output"; then
            echo "::error::用户名出现在了日志中"
            exit 1
          fi
          echo "✓ 日志中不含凭证"

          dest="localhost:5000/from-private/localhost_5001_private_hello:latest"
          if ! skopeo inspect --tls-verify=false "docker://${dest}" >/dev/null 2>&1; then
            echo "::error::目标镜像不存在：${dest}"
            exit 1
          fi
          echo "✓ 目标镜像已真实存在于 registry 中"

  # ---------------------------------------------------------------------------
  # 提交信息规范
  # 只在 PR 上跑（push 到 main 的提交已经过 PR 校验）。
  # squash merge 后 PR 标题会成为提交信息，所以标题也要一并校验。
  # ---------------------------------------------------------------------------
  commit-messages:
    name: 提交信息规范
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Repos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # CI 用不到 git 凭证（推送走 docker 凭证），不持久化，
          # 让 checkout 之后的任何脚本都拿不到 GITHUB_TOKEN
          persist-credentials: false
          # 需要完整的提交历史才能校验区间内的所有提交
          fetch-depth: 0

      - name: 校验 PR 中的提交信息
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/check-commit-msg.sh --range "${BASE_SHA}..${HEAD_SHA}"

      - name: 校验 PR 标题
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: ./scripts/check-commit-msg.sh --message "$PR_TITLE"

  # ---------------------------------------------------------------------------
  # CI 总览
  # 把所有检查汇总成一个结果，分支保护规则只需要盯这一个 check 即可。
  # ---------------------------------------------------------------------------
  ci-summary:
    name: CI 总览
    runs-on: ubuntu-latest
    needs: [actionlint, yamllint, shellcheck, zizmor, smoke-test, integration-test, commit-messages]
    if: always()
    steps:
      - name: 汇总各检查结果
        env:
          R_ACTIONLINT: ${{ needs.actionlint.result }}
          R_YAMLLINT: ${{ needs.yamllint.result }}
          R_SHELLCHECK: ${{ needs.shellcheck.result }}
          R_ZIZMOR: ${{ needs.zizmor.result }}
          R_SMOKE: ${{ needs.smoke-test.result }}
          R_INTEGRATION: ${{ needs.integration-test.result }}
          R_COMMITS: ${{ needs.commit-messages.result }}
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          declare -a names=(工作流静态检查 YAML风格检查 Shell脚本检查 工作流安全扫描 冒烟测试 集成测试 提交信息规范)
          declare -a results=("$R_ACTIONLINT" "$R_YAMLLINT" "$R_SHELLCHECK" "$R_ZIZMOR" "$R_SMOKE" "$R_INTEGRATION" "$R_COMMITS")

          failed=0

          {
            echo "## CI 检查结果"
            echo ""
            echo "| 检查项 | 结果 |"
            echo "| --- | :---: |"
          } >> "$GITHUB_STEP_SUMMARY"

          for i in "${!names[@]}"; do
            case "${results[$i]}" in
              success) icon="✅" ;;
              skipped) icon="⏭️" ;;   # PR 之外的触发方式会跳过提交信息检查，属于正常
              *)       icon="❌"; failed=1 ;;
            esac
            printf '| %s | %s |\n' "${names[$i]}" "$icon" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$failed" -ne 0 ]]; then
            echo "❌ 存在未通过的检查，请查看上方各任务的日志。" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::CI 未能全部通过"
            exit 1
          fi

          echo "✅ 全部检查通过。" >> "$GITHUB_STEP_SUMMARY"
