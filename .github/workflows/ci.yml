# 工作流名称
name: CI
# 工作流运行时显示名称
run-name: CI · ${{ github.event_name }} · ${{ github.ref_name }}

# 怎样触发工作流
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 只读权限就够了：CI 不写回仓库，这是最小权限原则的体现。
# 注意那些需要写权限的工作流（labeler / stale）在各自文件里单独声明。
permissions:
  contents: read

# 同一分支连推多次时，取消掉旧的运行，省额度也省等待
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 固定版本以保证 CI 结果可复现
  ACTIONLINT_VERSION: "1.7.12"

# 工作流程任务（通常含有一个或多个步骤）
jobs:
  # ---------------------------------------------------------------------------
  # 工作流静态检查
  # actionlint 能发现 YAML 层面看不出、但运行时会炸的问题：
  # 表达式拼写错误、上下文用错、run 块里的 shell 问题等。
  # ---------------------------------------------------------------------------
  actionlint:
    name: 工作流静态检查
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # CI 用不到 git 凭证（推送走 docker 凭证），不持久化，
          # 让 checkout 之后的任何脚本都拿不到 GITHUB_TOKEN
          persist-credentials: false

      - name: 安装 actionlint
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL "$url" | tar -xz actionlint
          ./actionlint --version

      - name: 运行 actionlint
        run: ./actionlint -color

  # ---------------------------------------------------------------------------
  # YAML 风格检查
  # ---------------------------------------------------------------------------
  yamllint:
    name: YAML 风格检查
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # CI 用不到 git 凭证（推送走 docker 凭证），不持久化，
          # 让 checkout 之后的任何脚本都拿不到 GITHUB_TOKEN
          persist-credentials: false

      - name: 安装 yamllint
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          pipx install yamllint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: 运行 yamllint
        run: yamllint -c .yamllint .github/

  # ---------------------------------------------------------------------------
  # Shell 脚本检查
  # ---------------------------------------------------------------------------
  shellcheck:
    name: Shell 脚本检查
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # CI 用不到 git 凭证（推送走 docker 凭证），不持久化，
          # 让 checkout 之后的任何脚本都拿不到 GITHUB_TOKEN
          persist-credentials: false

      - name: 运行 shellcheck
        run: shellcheck -x scripts/*.sh

      - name: bash 语法检查
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          for f in scripts/*.sh; do
            echo "检查 ${f}"
            bash -n "$f"
          done

  # ---------------------------------------------------------------------------
  # sync.sh 冒烟测试
  # 用 dry-run 验证脚本能正确解析输入、拆分批量镜像、拼出目标仓库名，
  # 并确认非法输入会被拦下。不需要任何真实凭证。
  # ---------------------------------------------------------------------------
  smoke-test:
    name: sync.sh 冒烟测试
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # CI 用不到 git 凭证（推送走 docker 凭证），不持久化，
          # 让 checkout 之后的任何脚本都拿不到 GITHUB_TOKEN
          persist-credentials: false

      - name: 安装 skopeo
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo

      - name: 验证批量输入解析与目标名生成
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          ./scripts/sync.sh \
            --src "registry.k8s.io/pause:3.9, registry.k8s.io/coredns/coredns:v1.11.1" \
            --src "nginx:1.27" \
            --dest registry.example.com/smoke \
            --dry-run

      - name: 验证 dry-run 同步计划预览
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          summary="$(mktemp)"
          output="$(GITHUB_STEP_SUMMARY="$summary" ./scripts/sync.sh \
            --src 'nginx:1.27,redis:7.4' \
            --dest registry.example.com/smoke \
            --exclude redis \
            --skip-existing \
            --dry-run 2>&1)"

          echo "$output"

          if ! grep -q '同步计划预览（dry-run）' <<<"$output"; then
            echo "::error::dry-run 未输出同步计划预览"
            exit 1
          fi
          if ! grep -q '预计命令 1 条' <<<"$output"; then
            echo "::error::dry-run 计划未按筛选后的数量统计命令"
            exit 1
          fi
          if ! grep -F 'nginx:1.27 → registry.example.com/smoke/nginx:1.27' <<<"$output"; then
            echo "::error::dry-run 计划缺少正确的源到目标映射"
            exit 1
          fi
          if ! grep -q '执行路径：skopeo copy --all' <<<"$output"; then
            echo "::error::dry-run 计划未说明执行路径"
            exit 1
          fi
          if ! grep -q '平台策略：全部（--all）' <<<"$output"; then
            echo "::error::dry-run 计划未说明平台策略"
            exit 1
          fi
          if ! grep -q 'skip-existing 只能在实际执行时判断' <<<"$output"; then
            echo "::error::dry-run 计划不应把目标已存在判定为确定的跳过"
            exit 1
          fi

          # Markdown 表格中的反引号是固定文本，禁用 shellcheck 的误报告警。
          # shellcheck disable=SC2016
          if ! grep -q '## Dry-run 同步计划' "$summary" \
            || ! grep -F '| `nginx:1.27` | `registry.example.com/smoke/nginx:1.27` |' "$summary"; then
            echo "::error::dry-run 计划未写入 Step Summary"
            cat "$summary"
            exit 1
          fi
          echo "✓ dry-run 计划预览与 Step Summary 正确"

          # strip-attestation 会改用 regctl 重建索引，计划必须如实区分路径与平台来源。
          output="$(./scripts/sync.sh --src nginx:1.27 --dest registry.example.com/smoke \
            --strip-attestation --platforms linux/amd64,linux/arm64 --dry-run 2>&1)"
          if ! grep -q '执行路径：regctl index create' <<<"$output" \
            || ! grep -q '平台策略：linux/amd64,linux/arm64' <<<"$output"; then
            echo "::error::regctl dry-run 计划未如实说明路径与平台策略"
            echo "$output"
            exit 1
          fi
          echo "✓ regctl dry-run 计划路径与平台策略正确"

          # 多目标计划要反映每个目标的独立命名规则，数量必须是命令数而非源镜像数。
          output="$(GITHUB_STEP_SUMMARY="$summary" ./scripts/sync.sh \
            --src library/nginx:1.27 \
            --dest registry.example.com/flat \
            --dest-keep-path registry.example.com/keep \
            --dry-run 2>&1)"
          echo "$output"
          if ! grep -q '源镜像 1 个 · 目标 2 个 · 预计命令 2 条' <<<"$output" \
            || ! grep -F 'library/nginx:1.27 → registry.example.com/flat/library_nginx:1.27' <<<"$output" \
            || ! grep -F 'library/nginx:1.27 → registry.example.com/keep/library/nginx:1.27' <<<"$output"; then
            echo "::error::多目标 dry-run 计划缺少全部独立目标映射"
            echo "$output"
            exit 1
          fi
          # shellcheck disable=SC2016
          if ! grep -F '| `library/nginx:1.27` | `registry.example.com/flat/library_nginx:1.27` |' "$summary" \
            || ! grep -F '| `library/nginx:1.27` | `registry.example.com/keep/library/nginx:1.27` |' "$summary"; then
            echo "::error::多目标 dry-run 计划未完整写入 Step Summary"
            cat "$summary"
            exit 1
          fi
          echo "✓ 多目标 dry-run 计划完整"

          # dest-exact 不做路径拼接；计划必须复述使用者给定的完整地址。
          output="$(./scripts/sync.sh --src nginx:1.27 \
            --dest-exact registry.example.com/custom/nginx:stable --dry-run 2>&1)"
          if ! grep -F 'nginx:1.27 → registry.example.com/custom/nginx:stable' <<<"$output"; then
            echo "::error::dest-exact dry-run 计划未保留完整目标地址"
            echo "$output"
            exit 1
          fi
          echo "✓ dest-exact dry-run 计划正确"

          # 未显式传平台时，计划不能虚构探测结果，只能说明实际执行时的策略。
          # 用非法引用避免 dry-run 冒烟测试真的访问 Docker Hub 探测平台。
          set +e
          output="$(./scripts/sync.sh --src nginx --dest registry.example.com/smoke \
            --strip-attestation --dry-run 2>&1)"
          code=$?
          set -e
          if [[ "$code" -ne 2 ]] \
            || ! grep -q '平台策略：实际执行时自动探测' <<<"$output"; then
            echo "::error::regctl dry-run 计划不应虚构自动探测出的平台"
            echo "$output"
            exit 1
          fi
          echo "✓ regctl 自动探测策略说明正确"

          # 非法引用不能生成看似可执行的目标映射；脚本会返回 2，先暂时放开 errexit。
          set +e
          output="$(./scripts/sync.sh --src 'nginx' --dest registry.example.com/smoke --dry-run 2>&1)"
          code=$?
          set -e
          if [[ "$code" -ne 2 ]] \
            || ! grep -q '镜像引用无效，实际执行会失败' <<<"$output" \
            || ! grep -q '预计命令 0 条' <<<"$output" \
            || grep -q 'nginx → registry.example.com/smoke' <<<"$output"; then
            echo "::error::非法引用的 dry-run 计划不应生成映射"
            echo "$output"
            exit 1
          fi
          echo "✓ 非法引用不生成映射"

          # --dry-run 在只读检查模式下保持既有语义：显式忽略，不渲染同步计划。
          # 只放 marker 行，可验证参数告警而不用访问 registry。
          lock="$(mktemp)"
          printf '# [失败] nginx:1.27\n' > "$lock"
          output="$(./scripts/sync.sh --audit-lock "$lock" --dry-run 2>&1)"
          if grep -q '同步计划预览（dry-run）' <<<"$output"; then
            echo "::error::audit 模式不应输出同步计划预览"
            echo "$output"
            exit 1
          fi
          if ! grep -q -- '--dry-run' <<<"$output"; then
            echo "::error::audit 模式应保持 --dry-run 显式忽略告警"
            echo "$output"
            exit 1
          fi
          echo "✓ 只读检查模式不渲染同步计划"

      - name: 验证 --file 清单解析
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # --file / -f / --source-file 走的是 collect_images 的文件解析分支，
          # 也是两个生产工作流（sync-images-batch.yml、check-registry.yml）的正式入口，
          # 此前整条路径零覆盖。
          #
          # 断言一律断「数量 + 内容」两件事。解析分六步——整行注释剥离、行尾注释剥离、
          # 空行跳过、首尾空白 trim、去重保序、以及与 --src 合并——其中任何一步退化都可能
          # 让**数量碰巧不变而内容已错**，只断数量就会被静默放过。实测（删掉尾部 trim）：
          # 带空白的引用被判为非法而**整条掉出计划**、脚本以 2 退出，而
          # 「待同步镜像 2 个」照旧——那条只断数量的断言依然是绿的。
          #
          # 断内容断的是计划映射行 `[i] src → dest` 的**原文**：dry-run 复述的就是真正
          # 会执行的命令参数，源名或目标名多一个字符都对不上。

          # 输出与退出码都要看，所以用全局变量传出（命令替换是子 shell，函数里赋值传不回
          # 调用方）。也不能写 out="$(...)" 再靠 set -e 兜底：解析退化时脚本会以非零退出，
          # 而命令替换把它的输出一并吞掉，日志里只剩一条没有上下文的失败——排查的人
          # 正是最需要看到「清单被解析成了什么」的那个。
          OUT=""
          CODE=0
          run_sync() {
            set +e
            OUT="$(./scripts/sync.sh "$@" 2>&1)"
            CODE=$?
            set -e
          }

          fail() {
            echo "::error::$1"
            printf '%s\n' "$OUT"
            exit 1
          }

          # 期望解析成功：退出码 0，数量对，且清单里**每一个**镜像都出现在计划里。
          # $1 用例说明，$2 期望镜像个数，$3 seq/any，其余为清单中的镜像。
          #
          # seq 连计划序号一起断（`[1] a → …`），顺带锁住「去重保序」——第 i 个输入必须
          # 落在第 i 条计划上。any 只要求出现过：合并语义里 --src 与清单的先后不是契约，
          # 锁它就成了对正确实现的假报错。
          assert_parsed() {
            local desc="$1" expect="$2" mode="$3"; shift 3
            local i=0 src pattern
            [[ "$CODE" -eq 0 ]] || fail "${desc}：期望退出码 0，实际 ${CODE}"
            grep -qF -- "待同步镜像 ${expect} 个" <<<"$OUT" \
              || fail "${desc}：期望待同步镜像 ${expect} 个"
            for src in "$@"; do
              i=$((i + 1))
              pattern="${src} → r.example.com/x/${src}"
              if [[ "$mode" == "seq" ]]; then
                pattern="[${i}] ${pattern}"
              fi
              grep -qF -- "$pattern" <<<"$OUT" \
                || fail "${desc}：计划里没有「${pattern}」"
            done
          }

          # 期望解析失败：退出码 1 **且**报错文案对得上。两类「清单不可用」的退出码都是 1，
          # 含义却完全不同——文件不存在要人去核对路径，内容为空要人去看清单本身——所以
          # 只断退出码等于把两者混成一条。$3 是**不该出现**的另一条文案。
          assert_rejected() {
            local desc="$1" expect="$2" other="$3"
            [[ "$CODE" -eq 1 ]] || fail "${desc}：期望退出码 1，实际 ${CODE}"
            grep -qF -- "$expect" <<<"$OUT" || fail "${desc}：输出里没有「${expect}」"
            if grep -qF -- "$other" <<<"$OUT"; then
              fail "${desc}：误报了「${other}」"
            fi
          }

          work="$(mktemp -d)"

          # ---- 六项解析行为：每项一个独立清单 ----
          # 不合并成一个「大杂烩」清单：那样任何一步退化都只表现为数量变了，指不出坏在
          # 哪一步，也没法对单点变异做验证。

          # ① 整行注释剥离（# 起头的整行都不是镜像）
          printf '# 这是整行注释\nnginx:1.27\n# 另一行注释\nredis:7.4\n' > "${work}/whole-comment.txt"
          run_sync --file "${work}/whole-comment.txt" --dest r.example.com/x --dry-run
          assert_parsed "整行注释必须被剥离" 2 seq nginx:1.27 redis:7.4
          echo "✓ 整行注释被剥离"

          # ② 行尾注释剥离（含制表符分隔的注释）。顺带覆盖短选项 -f。
          # 第二行故意让注释里再出现一个 #（写 issue 号是常见写法）：行内注释从
          # **第一个** # 起截断，所以 `%%#*` 才是对的；换成 `%#*`（从最后一个 # 截）
          # 会留下 `redis:7.4\t# 制表符后的注释` 这样一段非法引用。锁文件的解析器
          # （`parse_lockfile`）用的是同一套规则，并注明「与 --file 的读取规则一致」。
          printf 'nginx:1.27 # 行尾注释\nredis:7.4\t# 制表符后的注释 #135\n' > "${work}/trailing-comment.txt"
          run_sync -f "${work}/trailing-comment.txt" --dest r.example.com/x --dry-run
          assert_parsed "行尾注释必须被剥离（-f）" 2 seq nginx:1.27 redis:7.4
          echo "✓ 行尾注释被剥离"

          # ③ 空行跳过（首、中、尾都放上空行）。顺带覆盖长选项 --source-file。
          printf '\nnginx:1.27\n\n\nredis:7.4\n\n' > "${work}/blank-lines.txt"
          run_sync --source-file "${work}/blank-lines.txt" --dest r.example.com/x --dry-run
          assert_parsed "空行必须被跳过（--source-file）" 2 seq nginx:1.27 redis:7.4
          echo "✓ 空行被跳过"

          # ④ 首尾空白 trim。这条**只能断内容**：删掉 trim 后「待同步镜像 2 个」照旧，
          # 而带空白的引用被判为非法、整条掉出计划（脚本以 2 退出）。只断数量的断言
          # 在这里是绿的，所以映射行必须逐条断原文。
          printf '  nginx:1.27  \n\t redis:7.4\t\n' > "${work}/padding.txt"
          run_sync --file "${work}/padding.txt" --dest r.example.com/x --dry-run
          assert_parsed "首尾空白必须被去掉" 2 seq nginx:1.27 redis:7.4
          echo "✓ 首尾空白被去掉"

          # ⑤ 去重保序。只断数量不够：换成 sort -u 去重，数量照样对、顺序却变了，
          # 所以第二个清单故意让先出现的那个不是字典序靠前的。
          printf 'nginx:1.27\nnginx:1.27\n' > "${work}/duplicate.txt"
          run_sync --file "${work}/duplicate.txt" --dest r.example.com/x --dry-run
          assert_parsed "重复项必须去重" 1 seq nginx:1.27
          printf 'redis:7.4\nnginx:1.27\nredis:7.4\n' > "${work}/order.txt"
          run_sync --file "${work}/order.txt" --dest r.example.com/x --dry-run
          assert_parsed "去重必须保持原有顺序" 2 seq redis:7.4 nginx:1.27
          echo "✓ 重复项被去重且顺序保持"

          # ---- 两类「清单不可用」是两条不同的报错 ----
          # 退出码相同（1），含义完全不同，所以文案必须分别断：只断退出码等于把
          # 「路径写错了」和「清单是空的」混成一条，而使用者要做的下一步完全不同。

          # ⑥ 文件不存在
          run_sync --file "${work}/absent.txt" --dest r.example.com/x --dry-run
          assert_rejected "文件不存在" "镜像清单文件不存在：${work}/absent.txt" "没有提供任何源镜像"
          echo "✓ 文件不存在时报的是路径"

          # ⑦ 内容为空：空文件 / 纯空白 / 只有注释，三条都要落到「没有源镜像」
          printf '' > "${work}/empty.txt"
          printf '   \n\t\n' > "${work}/blank-only.txt"
          printf '# 只有注释\n# 又一行注释\n' > "${work}/comment-only.txt"
          for f in empty blank-only comment-only; do
            run_sync --file "${work}/${f}.txt" --dest r.example.com/x --dry-run
            assert_rejected "清单 ${f} 内容为空" "没有提供任何源镜像" "镜像清单文件不存在"
          done
          echo "✓ 空文件 / 纯空白 / 纯注释都报「没有提供任何源镜像」"

          # ⑧ 清单末尾的换行可有可无。三种形态必须解析出**同样的结果**——这才是要锁的
          # 不变量；写成「无结尾换行时同步 N-1 个」就等于把缺陷固化成契约。而这条缺陷
          # 的形态正是最坏的一种：少读一行、退出码仍是 0、日志照旧打印「同步完成」，
          # 使用者以为全同步了（Issue #143）。单行那条尤其要断——修复前它整段读不到，
          # 落到「没有提供任何源镜像」并以 1 退出，报的还是「你明明提供了」的那句话。
          # 根因是 `read` 读到没有换行符收尾的最后一段时返回非零（EOF 而非完整行），
          # 循环体便不执行。这三条不是恒真的：实测把这处 `|| [[ -n "$line" ]]` 单独
          # 去掉后，**后两条**变红；第一条照样绿——带结尾换行的清单本来就不依赖这个
          # 保护，所以只写它等于没测（这正是「恒真断言比没有断言更糟」的又一形态）。
          printf 'nginx:1.27\nredis:7.4\n' > "${work}/ends-with-nl.txt"
          run_sync --file "${work}/ends-with-nl.txt" --dest r.example.com/x --dry-run
          assert_parsed "清单末尾有换行" 2 seq nginx:1.27 redis:7.4

          printf 'nginx:1.27\nredis:7.4' > "${work}/no-final-nl.txt"
          run_sync --file "${work}/no-final-nl.txt" --dest r.example.com/x --dry-run
          assert_parsed "清单末尾无换行" 2 seq nginx:1.27 redis:7.4

          printf 'nginx:1.27' > "${work}/single-no-final-nl.txt"
          run_sync --file "${work}/single-no-final-nl.txt" --dest r.example.com/x --dry-run
          assert_parsed "单行清单末尾无换行" 1 seq nginx:1.27
          echo "✓ 清单末尾的换行可有可无（有 / 无 / 单行无）"

          # ---- 合并语义：--src 与 --file 是**合并**，不是替换 ----
          # ARCHITECTURE 把这条当作一个必须解释的坑记着，此前没有任何测试保护。
          # 断言必须**分别**看到 --src 的镜像与清单里的镜像：只断总数（2 个）的话，
          # 实现退化成「替换」而这个清单恰好有 2 行时，断言会恒真。
          printf 'redis:7.4\n' > "${work}/merge.txt"
          run_sync --src nginx:1.27 --file "${work}/merge.txt" --dest r.example.com/x --dry-run
          assert_parsed "--src 与 --file 必须合并" 2 any nginx:1.27 redis:7.4
          echo "✓ --src 与 --file 是合并而非替换"

          echo "✓ --file 清单解析全部断言通过"

      - name: 验证报告 JSON 转义与字段类型
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 镜像引用含引号、反斜杠或控制字符时，sync-report.json 仍必须是合法
          # JSON，且解析回来的值与输入逐字符相等。裸 printf 拼接时代这里会静默
          # 产出坏数据，直到 history.sh 解析时才炸——那时已远离现场。
          report_dir="$(mktemp -d)"
          ./scripts/sync.sh --src 'ngi"nx:1.0' --dest registry.example.com/smoke \
            --report-dir "$report_dir" --dry-run >/dev/null
          json="$report_dir/sync-report.json"

          if ! jq -e . "$json" >/dev/null; then
            echo "::error::含引号的镜像引用产出了非法 JSON"
            cat "$json"
            exit 1
          fi
          if [[ "$(jq -r '.images[0].source' "$json")" != 'ngi"nx:1.0' ]]; then
            echo "::error::source 未与输入逐字符相等"
            jq -r '.images[0].source' "$json"
            exit 1
          fi
          # dest 由「目标前缀 + 源引用」生成，同样带着那个引号
          if [[ "$(jq -r '.images[0].dest' "$json")" != 'registry.example.com/smoke/ngi"nx:1.0' ]]; then
            echo "::error::dest 未与输入逐字符相等"
            jq -r '.images[0].dest' "$json"
            exit 1
          fi

          # 字段类型不变性：history.sh 的 map(.total) | add 依赖 number，
          # 用 --arg 传值会退化成 string，那比原缺陷更具破坏性。
          for k in total success skipped failed excluded; do
            if [[ "$(jq -r ".${k} | type" "$json")" != "number" ]]; then
              echo "::error::顶层字段 ${k} 不是 number"
              exit 1
            fi
          done
          # dry_run 与 strip_attestation 都是布尔顶层字段，必须同样用 --argjson
          # 传（--arg 会退化成字符串 "false"，在 jq 里为真——消费方的
          # `.dry_run != true` 判据会因此恒真，过滤彻底失效）
          if [[ "$(jq -r '.strip_attestation | type' "$json")" != "boolean" ]] \
            || [[ "$(jq -r '.dry_run | type' "$json")" != "boolean" ]]; then
            echo "::error::strip_attestation / dry_run 不是 boolean"
            exit 1
          fi
          # 这个 job 全程用 --dry-run 造报告，所以值必须是 true——写死 false
          # （或漏传字段）时上面那条类型断言照样通过，只有值能抓住
          if [[ "$(jq -r '.dry_run' "$json")" != "true" ]]; then
            echo "::error::--dry-run 产出的报告里 dry_run 不为 true"
            exit 1
          fi
          if [[ "$(jq -r '.images[0].seconds | type' "$json")" != "number" ]] \
            || [[ "$(jq -r '.rerun.not_rerunnable | type' "$json")" != "number" ]]; then
            echo "::error::seconds / rerun.not_rerunnable 不是 number"
            exit 1
          fi

          # 无失败项时 rerun.images 是 []（不是 null），三个字段一个都不能少
          if ! jq -e '.rerun.images == []' "$json" >/dev/null \
            || ! jq -e '.rerun | has("filter") and has("not_rerunnable")' "$json" >/dev/null; then
            echo "::error::无失败项时 rerun 的零值语义不正确"
            exit 1
          fi

          # 反斜杠与控制字符（tab）同样不能破坏 JSON
          for src in 'ngi\x:1.0' $'ngi\tx:1.0'; do
            dir="$(mktemp -d)"
            ./scripts/sync.sh --src "$src" --dest registry.example.com/smoke \
              --report-dir "$dir" --dry-run >/dev/null
            if ! jq -e --arg s "$src" --arg d "registry.example.com/smoke/$src" \
              '.images[0].source == $s and .images[0].dest == $d' \
              "$dir/sync-report.json" >/dev/null; then
              echo "::error::镜像引用 $(printf '%q' "$src") 未正确转义"
              exit 1
            fi
          done
          echo "✓ 报告 JSON 转义与字段类型正确"

          # 下游必须能消费新报告（趋势 / 聚合都读同一份 schema）。
          #
          # 上面这份报告是 --dry-run 产出的（本 step 不真的搬运任何东西），而
          # history.sh 现在会正确地跳过干跑报告——那与「schema 能不能消费」无关，
          # 所以这里把唯一决定「真实运行 vs 计划」的那个字段翻成 false 再喂下去。
          # 干跑报告被跳过这件事由「验证 dry-run 不留做过的痕迹」的第 ⑤ 节断言。
          hist_dir="$(mktemp -d)"
          jq '.dry_run = false' "$json" > "${hist_dir}/sync-report.json"
          if ! ./scripts/history.sh --dir "$hist_dir" >/dev/null 2>&1; then
            echo "::error::history.sh 无法消费新的 sync-report.json"
            exit 1
          fi
          echo "✓ history.sh 可消费新报告"

      - name: 验证失败原因进入报告与 Step Summary
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 失败原因（R_NOTE）此前只出现在终端日志里：同一份运行，终端知道原因，报告与
          # Step Summary 不知道。三种只读检查的报告都带 note，唯独同步主模式没有，使用者
          # 因此无法区分「改输入」与「重跑」。
          #
          # 用一条没有 tag 的非法引用造真实失败，不需要 registry 与网络。同一份报告里
          # 再放一个合法引用，用来验证成功项的 note 是空串（字段存在且不被省略）。
          fail() {
            echo "::error::$1"
            exit 1
          }

          report_dir="$(mktemp -d)"
          summary_file="$(mktemp)"
          # 失败项按设计以退出码 2 结束，不是异常
          GITHUB_STEP_SUMMARY="$summary_file" ./scripts/sync.sh \
            --src 'nginx:1.27,nginx' --dest registry.example.com/smoke \
            --report-dir "$report_dir" --dry-run >/dev/null 2>&1 || true

          json="$report_dir/sync-report.json"
          md="$report_dir/sync-report.md"

          # ---- json：字段始终存在，失败项带出真实原因，成功项为空串 ----
          # 必须用 all(...) 逐个判：`jq -e '.images[] | has("note")'` 的退出码只看
          # **最后一个**输出值，只要末条有 note，前面几条缺字段也照样返回 0——
          # 那样这条断言就只剩「末条有没有 note」，与它声称的「始终存在」不符。
          jq -e '.images | length == 2' "$json" >/dev/null || fail "预期 2 条记录"
          jq -e 'all(.images[]; has("note"))' "$json" >/dev/null \
            || fail "images[].note 字段缺失（消费方不必判空，字段必须始终存在）"
          jq -e 'all(.images[]; (.note | type) == "string")' "$json" >/dev/null \
            || fail "images[].note 不是 string"

          ok_note="$(jq -r '.images[] | select(.status=="success") | .note' "$json")"
          [[ -z "$ok_note" ]] || fail "成功项的 note 应为空串，实际：[${ok_note}]"

          fail_note="$(jq -r '.images[] | select(.status=="failed") | .note' "$json")"
          [[ "$fail_note" == 镜像引用格式错误* ]] || fail "失败项未带出真实原因：[${fail_note}]"

          # ---- md：新增「说明」列，失败行写原因，无原因的行写 — ----
          # 表头与数据行的列数必须一致——说明列里的 note 含 | 或换行时不得多切一列
          # （转义由 md_cell 负责）。只查数据行会漏掉「表头少了说明列」这种表头/数据
          # 脱节，所以这里把表头与紧随其后的每个表格行放在一起核对。
          md_header="$(grep -F '| 源镜像 |' "$md" | grep -F '结果' | head -1)"
          [[ -n "$md_header" ]] || fail "md 里找不到同步结果表头"
          grep -qF '说明' <<<"$md_header" || fail "md 表头缺少「说明」列：[$md_header]"
          hdr_cols="$(awk '{print gsub(/\|/,"")}' <<<"$md_header")"
          [[ "$hdr_cols" -eq 9 ]] || fail "md 表头竖线数不是 9（即 8 列）：${hdr_cols}"

          # 数的是**未转义**的竖线：md_cell 把 note 里的 | 写成 \|，那些不是列分隔，
          # 若一并计入，一条转义正确的行会被数成多一列——断言就成了对正确实现的假报错。
          awk -F'|' -v n="$hdr_cols" '
            /^\| 源镜像 \|/ && /结果/ { intbl=1; next }
            intbl && /^\|/ {
              line = $0
              gsub(/\\\|/, "", line)          # 已转义的竖线不算列分隔
              c = gsub(/\|/, "", line)
              if (c != n) { print "cols=" c " want=" n; bad=1 }
              next
            }
            intbl && !/^\|/ { intbl=0 }
            END { exit bad }
          ' "$md" >/tmp/md-cols.out || fail "md 表格有行与表头列数不一致：$(cat /tmp/md-cols.out)"

          md_fail_row="$(grep -F 'nginx' "$md" | grep -F '❌' || true)"
          [[ -n "$md_fail_row" ]] || fail "md 里找不到失败行"
          grep -qF '镜像引用格式错误' <<<"$md_fail_row" || fail "md 失败行没有带出原因"

          md_ok_row="$(grep -F 'nginx:1.27' "$md" | head -1)"
          md_ok_note="$(awk -F'|' '{gsub(/^ +| +$/,"",$9); print $9}' <<<"$md_ok_row")"
          [[ "$md_ok_note" == "—" ]] || fail "md 成功行的说明列应为 —，实际：[${md_ok_note}]"

          # ---- Step Summary：与 md 同源同口径，同样有「说明」列 ----
          sum_header="$(grep -F '| 源镜像 |' "$summary_file" | grep -F 'Digest | 耗时' | head -1)"
          [[ -n "$sum_header" ]] || fail "Step Summary 里找不到同步结果表头"
          grep -qF '说明' <<<"$sum_header" || fail "Step Summary 表头缺少「说明」列：[$sum_header]"
          sum_cols="$(awk '{print gsub(/\|/,"")}' <<<"$sum_header")"
          [[ "$sum_cols" -eq 8 ]] || fail "Step Summary 表头竖线数不是 8（即 7 列）：${sum_cols}"

          # 同 md：只数未转义的竖线，转义正确的行不该被数成多一列
          awk -F'|' -v n="$sum_cols" '
            /^\| 源镜像 \|/ && /Digest \| 耗时/ { intbl=1; next }
            intbl && /^\|/ {
              line = $0
              gsub(/\\\|/, "", line)
              c = gsub(/\|/, "", line)
              if (c != n) { print "cols=" c " want=" n; bad=1 }
              next
            }
            intbl && !/^\|/ { intbl=0 }
            END { exit bad }
          ' "$summary_file" >/tmp/sum-cols.out || fail "Step Summary 表格有行与表头列数不一致：$(cat /tmp/sum-cols.out)"

          sum_fail_row="$(grep -F '❌' "$summary_file" || true)"
          [[ -n "$sum_fail_row" ]] || fail "Step Summary 里找不到失败行"
          grep -qF '镜像引用格式错误' <<<"$sum_fail_row" || fail "Step Summary 失败行没有带出原因"

          # ---- md 与 Step Summary 的「说明」列共用 md_cell 转义 ----
          # 失败原因里出不了 |（两条固定文案、一条是 digest 描述），所以转义规则
          # 单独提出来测——与 CI 其他步骤用「提取生产函数」的手法一致。
          # 说明列**能**收到带 | 的文本的可复现路径在下面（排除原因带出 filter 正则）。
          sed -n '/^md_cell()/,/^}/p' scripts/sync.sh > /tmp/cell-fns.sh
          grep -qF 'printf' /tmp/cell-fns.sh || fail "未能从 sync.sh 抽出 md_cell"

          cat > /tmp/test-cell.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          source /tmp/cell-fns.sh
          fail() { echo "FAIL: $*" >&2; exit 1; }

          # 竖线会多切一列：必须转义
          out="$(md_cell 'a|b')"
          [[ "$out" == 'a\|b' ]] || fail "竖线未转义：[$out]"

          # 换行会截断整行：必须收敛为单行
          out="$(md_cell $'a\nb')"
          [[ "$out" == 'a b' ]] || fail "换行未收敛为单行：[$out]"

          # 两者都含时仍是单行，且没有裸竖线
          out="$(md_cell $'a|b\nc|d')"
          [[ "$out" == 'a\|b c\|d' ]] || fail "混合输入：[$out]"
          case "$out" in
            *[^\\]\|*) fail "仍有未转义的竖线：[$out]" ;;
          esac

          # 空串返回空串——调用方据此显示 —
          out="$(md_cell '')"
          [[ -z "$out" ]] || fail "空串应返回空串：[$out]"

          # 真实文案原样通过（不含待转义字符）
          out="$(md_cell '完整性校验失败：sha256:aaa != sha256:bbb')"
          [[ "$out" == '完整性校验失败：sha256:aaa != sha256:bbb' ]] || fail "真实文案被改动：[$out]"

          echo "CELL-OK"
          SCRIPT

          if ! cell_out="$(bash /tmp/test-cell.sh 2>&1)"; then
            printf '%s\n' "$cell_out"
            fail "md_cell 的表格转义不符合预期"
          fi
          grep -qF 'CELL-OK' <<<"$cell_out" || {
            printf '%s\n' "$cell_out"
            fail "md_cell 的表格转义不符合预期"
          }

          # ---- 说明列真的收到带 | 的文本时，表格列数不变（可复现路径）----
          # 设计文档说「含 | 的真实 note 造不出来」——对**失败原因**成立，但排除原因
          # 会把 --filter 的正则原样带进说明列：一条带 | 的过滤表达式就够了，dry-run
          # 即可，不需要 registry 与网络。这正是 md_cell 存在的理由，值得端到端跑一次。
          pipe_dir="$(mktemp -d)"
          ./scripts/sync.sh --src 'nginx:1.27,redis:7.4' --dest registry.example.com/smoke \
            --filter 'nginx|foo' --report-dir "$pipe_dir" --dry-run >/dev/null 2>&1 || true
          pipe_md="$pipe_dir/sync-report.md"
          grep -qF '未匹配 --filter「nginx\|foo」' "$pipe_md" \
            || fail "排除原因里的 | 没有转义成 \\|（md 表格会被多切一列）"
          pipe_row="$(grep -F 'redis:7.4' "$pipe_md" | head -1)"
          # 去掉已转义的 \| 之后再数列分隔：8 列的行应当仍是 9 个
          pipe_cols="$(printf '%s\n' "$pipe_row" | sed 's/\\|//g' | awk '{print gsub(/\|/,"")}')"
          [[ "$pipe_cols" -eq 9 ]] \
            || fail "含 | 的说明列把表格切坏了：cols=${pipe_cols}（期望 9）"
          # 表头与数据行必须一样宽——只查一行的话，表头少列会漏掉
          pipe_hdr_cols="$(grep -F '| 源镜像 |' "$pipe_md" | awk '{print gsub(/\|/,"")}' | head -1)"
          [[ "$pipe_hdr_cols" -eq "$pipe_cols" ]] \
            || fail "含 | 时表头与数据行列数不一致：表头 ${pipe_hdr_cols} 数据 ${pipe_cols}"

          echo "CI-FAILURE-NOTE-OK"

      - name: 验证失败原因真的随通知发得出去
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 失败原因进入通知的端到端验证。同步失败的通知此前只有「提取函数 + mock」的
          # 单元测试，而段序解析（cnt 不能再取最后一段）恰好是最容易改错的一处——
          # 这里真发一次，确认「失败详情」里带出的是原因而不是把次数读成原因文本。
          #
          # 用非法引用造失败，不需要 registry 与网络。
          #
          # 这里**不能**加 --dry-run：dry-run 不发送通知（它没真的搬过任何东西，
          # 通知的对象不存在），加了就没有通知可断言。带协议前缀的引用在
          # validate_ref 阶段直接失败、不联网，是「必定失败」的最明确表达。
          cat > /tmp/hook-note.py <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer


          class H(BaseHTTPRequestHandler):
              def do_POST(self):
                  n = int(self.headers.get('Content-Length', 0))
                  with open('/tmp/hook-note-payload.json', 'wb') as f:
                      f.write(self.rfile.read(n))
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b'ok')

              def log_message(self, *a):
                  pass


          HTTPServer(('127.0.0.1', 8898), H).serve_forever()
          PY
          rm -f /tmp/hook-note-payload.json
          python3 /tmp/hook-note.py &
          hook_pid=$!
          trap 'kill "$hook_pid" 2>/dev/null || true' EXIT
          sleep 2

          set +e
          ./scripts/sync.sh --src 'https://bad.example.com/x:1' --dest registry.example.com/smoke \
            --notify-webhook http://127.0.0.1:8898/hook --notify-type generic >/dev/null 2>&1
          set -e

          if [[ ! -s /tmp/hook-note-payload.json ]]; then
            echo "::error::同步失败时未发送通知"
            exit 1
          fi

          text="$(jq -r '.text' /tmp/hook-note-payload.json)"

          # 失败详情必须带出原因，且是「- 镜像：原因」的形态
          grep -qF '### 失败详情' <<<"$text" || {
            echo "::error::通知里没有失败详情小节"
            printf '%s\n' "$text"
            exit 1
          }
          grep -qF -- '- https://bad.example.com/x:1：镜像引用格式错误' <<<"$text" || {
            echo "::error::失败详情未带出真实原因（段序解析是否把次数读成了原因？）"
            printf '%s\n' "$text"
            exit 1
          }
          # 次数为 1 时不该出现「连续第 N 次失败」——那说明 cnt 被解析成了别的东西
          if grep -qF '连续第' <<<"$text"; then
            echo "::error::次数为 1 却渲染出连续失败标记，cnt 解析错位"
            printf '%s\n' "$text"
            exit 1
          fi

          echo "✓ 同步失败的通知带出了失败原因"

      - name: 验证 --history-artifact 的取值真的来自命令行
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # --history-artifact 的**本体**（坏报告分类、干跑报告不进历史、连续失败
          # 计数不被干跑清零）已由「验证连续失败计数与失败原因渲染的判定逻辑」覆盖，
          # 缺的只是 CLI 值有没有真的传进全局变量。
          #
          # 这个缺口的后果是一笔**静默错账**：值没传进去时下载的是默认的
          # sync-report-aliyuncs，连续失败计数就在**错误的历史集合**上计算——
          # 次数偏小，把该响的告警压掉，而且没有任何一条日志会提到这件事。
          # 所以断的必须是「告警文案里带出的那个名字」，不是「跑通了」。
          #
          # 与默认值**对照**是实现上唯一能证伪的方式：只断「文案里有这段」的话，
          # 一个丢掉 CLI 值的实现照样绿——默认值恰好也在文案里。
          fail() { echo "::error::$1"; exit 1; }

          # mock gh：run list 给一个运行 id（好走到下载那一步）、下载一律失败 →
          # fetch_sync_history 返回非零，既不联网也不 sleep。要断的那句告警正好
          # 打印在「拿不到历史」之后。
          #
          # 参数记进日志：断「CLI 的值真的传到了 gh run download -n 上」——
          # 那才是决定「在哪个历史集合上算连续失败」的那一处。只断告警文案的话，
          # 一个「文案用 CLI 值、下载却仍用默认值」的实现照样绿。
          mock_dir="$(mktemp -d)"
          gh_calls="${mock_dir}/gh-calls.log"
          : > "$gh_calls"
          cat > "${mock_dir}/gh" <<'MOCK'
          #!/usr/bin/env bash
          printf '%s\n' "$*" >> "$GH_CALL_LOG"
          if [[ "$1" == "run" && "$2" == "list" ]]; then
            printf '111\n'
            exit 0
          fi
          exit 1
          MOCK
          chmod +x "${mock_dir}/gh"
          PATH="${mock_dir}:$PATH"
          GH_CALL_LOG="$gh_calls"
          export PATH GH_CALL_LOG

          # 非法引用造出一次确定的失败：同步真的失败了，才会走到失败通知的历史查询。
          # **不能加 --dry-run**——干跑不发通知（没有「已发生的事」可通知），
          # 加了就连这条告警都不会有。
          run_with_history_artifact() {
            local out
            # 每次先清空日志，让下面只看到本次收到的参数
            : > "$gh_calls"
            set +e
            out="$(./scripts/sync.sh --src 'https://bad.example.com/x:1' --dest r.example.com/x \
              --notify-webhook http://127.0.0.1:8897/hook \
              --notify-after-failures 2 "$@" 2>&1)"
            set -e
            printf '%s\n' "$out"
          }

          custom="$(run_with_history_artifact --history-artifact my-custom-artifact)"
          want='无法获取历史报告（--history-artifact「my-custom-artifact」），无法判断连续失败次数，本次不发送失败通知'
          if ! grep -qF -- "$want" <<<"$custom"; then
            printf '%s\n' "$custom"
            fail "--history-artifact 的 CLI 值没有落到全局变量上（期望告警整句：「${want}」）"
          fi
          if ! grep -qF -- '-n my-custom-artifact' "$gh_calls"; then
            cat "$gh_calls"
            fail "CLI 的值没传到 gh run download -n 上——历史集合仍是默认的那个"
          fi
          echo "✓ 传 --history-artifact 时，告警与下载参数用的都是 CLI 给的名字"

          # 正对照：不传时带出默认值。它同时堵死「夹具自己没生效」——mock 没挡住、
          # 引用没失败、告警根本没打印出来时，这一条会与上面那条**一起**红，
          # 而不是让上面那句静默变绿。
          defaulted="$(run_with_history_artifact)"
          want_default='无法获取历史报告（--history-artifact「sync-report-aliyuncs」），无法判断连续失败次数，本次不发送失败通知'
          if ! grep -qF -- "$want_default" <<<"$defaulted"; then
            printf '%s\n' "$defaulted"
            fail "不传 --history-artifact 时未带出默认值（期望告警整句：「${want_default}」）"
          fi
          if ! grep -qF -- '-n sync-report-aliyuncs' "$gh_calls"; then
            cat "$gh_calls"
            fail "不传 --history-artifact 时下载参数不是默认值"
          fi
          echo "✓ 正对照：不传时告警与下载参数都是默认值 sync-report-aliyuncs"

      - name: 验证 --notify-type 的类型识别与包装格式
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # CI 里另外 5 处 --notify-type 全是 generic，于是两件事从没被跑过：
          # URL → 平台的识别，以及 dingtalk / feishu 的外层包装。这两处坏了都是
          # 静默的——通知照样「发出去了（HTTP 200）」，只是发错平台或格式不合规。
          fail() { echo "::error::$1"; exit 1; }

          # ---- ① detect_notify_type：四类 URL 各一条 ----
          # 纯字符串匹配，不需要 webhook。整段抽出生产函数（CI 里已有这个做法，
          # 见「验证重跑指引」那一步）。
          sed -n '/^detect_notify_type()/,/^}/p' scripts/sync.sh > /tmp/detect-notify-type-fn.sh
          [[ -s /tmp/detect-notify-type-fn.sh ]] || fail "没能从 sync.sh 抽出 detect_notify_type（函数改名了？）"
          # shellcheck disable=SC1091
          source /tmp/detect-notify-type-fn.sh

          # 断言用**等值**：只断「非空」的话，函数被改成恒返回某一个平台也照样绿。
          # 判据是「这个判据能区分几种形态」——四类平台加兜底 generic 共五种，
          # 逐条比对才分得开。
          expect_type() {
            local url="$1" want="$2" got
            got="$(detect_notify_type "$url")"
            if [[ "$got" != "$want" ]]; then
              fail "URL「${url}」应识别为 ${want}，实际 ${got}"
            fi
            echo "✓ ${url} → ${got}"
          }

          expect_type 'https://oapi.dingtalk.com/robot/send?access_token=abc' dingtalk
          expect_type 'https://open.feishu.cn/open-apis/bot/v2/hook/xxx' feishu
          expect_type 'https://open.larksuite.com/open-apis/bot/v2/hook/xxx' feishu
          expect_type 'https://hooks.slack.com/services/T000/B000/xxx' slack
          expect_type 'https://hooks.example.com/services/xxx' generic

          # ---- ② 包装格式：用本机 webhook 真发一次 ----
          # 不能加 --dry-run（干跑不发通知）；用非法引用造失败，不需要 registry。
          cat > /tmp/hook-notify-type.py <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer


          class H(BaseHTTPRequestHandler):
              def do_POST(self):
                  n = int(self.headers.get('Content-Length', 0))
                  with open('/tmp/hook-notify-type-payload.json', 'wb') as f:
                      f.write(self.rfile.read(n))
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b'ok')

              def log_message(self, *a):
                  pass


          HTTPServer(('127.0.0.1', 8896), H).serve_forever()
          PY
          rm -f /tmp/hook-notify-type-payload.json
          python3 /tmp/hook-notify-type.py &
          hook_pid=$!
          trap 'kill "$hook_pid" 2>/dev/null || true' EXIT
          sleep 2

          # 每次调用前清掉上一份 payload——否则「这一次没发」会被上一份文件
          # 冒充成「发了」，而下面几条断言看的正是那个文件
          send_to_hook() {
            local out
            rm -f /tmp/hook-notify-type-payload.json
            set +e
            out="$(./scripts/sync.sh --src 'https://bad.example.com/x:1' --dest r.example.com/x \
              "$@" 2>&1)"
            set -e
            printf '%s\n' "$out"
          }

          payload=/tmp/hook-notify-type-payload.json

          # dingtalk：msgtype=markdown + markdown{title,text}
          out="$(send_to_hook --notify-webhook http://127.0.0.1:8896/hook --notify-type dingtalk)"
          if [[ ! -s "$payload" ]]; then
            printf '%s\n' "$out"
            fail "dingtalk 通知没发出去（假 webhook 没收到 POST）"
          fi
          if ! jq -e '(.msgtype == "markdown")
                 and (.markdown | keys == ["text","title"])
                 and (.markdown.title == "镜像同步完成")
                 and (.markdown.text | contains("### 失败详情"))' \
               "$payload" >/dev/null; then
            cat "$payload"
            fail "dingtalk 的包装应为 msgtype=markdown + markdown{title,text}，且正文与通用版同源"
          fi
          echo "✓ dingtalk 包装正确，且正文共用了同一份"

          # feishu：msg_type=text + content.text
          out="$(send_to_hook --notify-webhook http://127.0.0.1:8896/hook --notify-type feishu)"
          if [[ ! -s "$payload" ]]; then
            printf '%s\n' "$out"
            fail "feishu 通知没发出去（假 webhook 没收到 POST）"
          fi
          if ! jq -e '(.msg_type == "text")
                 and (.content | keys == ["text"])
                 and (.content.text | contains("### 失败详情"))' \
               "$payload" >/dev/null; then
            cat "$payload"
            fail "feishu 的包装应为 msg_type=text + content.text，且正文与通用版同源"
          fi
          echo "✓ feishu 包装正确，且正文共用了同一份"

          # 不传 --notify-type（默认 auto）+ 不匹配任何平台的 URL → generic。
          # 这条同时覆盖 auto 这条通路：识别不出平台时才落到兜底包装。
          out="$(send_to_hook --notify-webhook http://127.0.0.1:8896/hook)"
          if [[ ! -s "$payload" ]]; then
            printf '%s\n' "$out"
            fail "auto 类型下通知没发出去（假 webhook 没收到 POST）"
          fi
          if ! jq -e 'keys == ["text"] and (.text | contains("### 失败详情"))' "$payload" >/dev/null; then
            cat "$payload"
            fail "auto + 非平台 URL 的包装应为顶层 text（且只有这一个键）"
          fi
          echo "✓ auto 识别为 generic，包装为顶层 text"

          # 未知类型：只告警、不发送——静默当成某个平台发出去比一次可见的失败更糟
          out="$(send_to_hook --notify-webhook http://127.0.0.1:8896/hook --notify-type bogus)"
          want='未知的通知类型：bogus（可选：dingtalk / feishu / slack / generic）'
          if ! grep -qF -- "$want" <<<"$out"; then
            printf '%s\n' "$out"
            fail "未知类型未按「未知的通知类型」告警（期望：「${want}」）"
          fi
          if [[ -e "$payload" ]]; then
            cat "$payload"
            fail "未知类型被静默当成某个平台发出去了"
          fi
          echo "✓ 未知类型只告警、不发送"

      - name: 验证通知送达判定（按平台解析响应体）
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # HTTP 码只说明「对方应答了」，而钉钉与飞书恰恰在 HTTP 200 的响应体里报错
          # （Issue #159）：改前的判定是 `[[ "$http_code" =~ ^2 ]]`，于是「平台侧拒收」
          # 被报成「结果已推送到」。判定的对错只能靠喂不同响应体来分辨，
          # 所以把生产函数整段抽出来（CI 里已有的做法，见「验证重跑指引」那一步）。
          #
          # 抽取面要求函数自包含：下面以 `set -u` 运行，它若引用了运行级全局变量
          # （WORK_DIR 之类），这一项会当场 unbound variable。
          fail() { echo "::error::$1"; exit 1; }

          sed -n '/^notify_delivery_verdict()/,/^}/p' scripts/sync.sh > /tmp/notify-verdict-fn.sh
          [[ -s /tmp/notify-verdict-fn.sh ]] || fail "没能从 sync.sh 抽出 notify_delivery_verdict（函数改名了？）"
          [[ "$(tail -n 1 /tmp/notify-verdict-fn.sh)" == "}" ]] \
            || fail "抽出的片段没有以函数的收尾大括号结束（函数里出现了顶格的 } ？）"
          # shellcheck disable=SC1091
          source /tmp/notify-verdict-fn.sh

          # 判定同时写到 stdout 与全局变量：stdout 供独立验证，全局变量供调用方读
          # （调用方**不能**用命令替换取值——那是子 shell，赋值传不回父进程）。
          # 三处都比对，「stdout 对了但全局变量忘了写」这类半吊子实现才拦得住。
          out_file=/tmp/notify-verdict-stdout.txt
          check() {
            local desc="$1" type="$2" http_code="$3" body="$4" want_verdict="$5" want_detail="$6"
            local body_file got_out got_verdict got_detail
            body_file="$(mktemp)"
            printf '%s' "$body" > "$body_file"
            NOTIFY_VERDICT=""
            NOTIFY_VERDICT_DETAIL=""
            notify_delivery_verdict "$type" "$http_code" "$body_file" > "$out_file"
            got_out="$(cat "$out_file")"
            got_verdict="$NOTIFY_VERDICT"
            got_detail="$NOTIFY_VERDICT_DETAIL"
            rm -f "$body_file"
            [[ "$got_out" == "$want_verdict" ]] \
              || fail "${desc}：stdout 结论应为 ${want_verdict}，实际「${got_out}」"
            [[ "$got_verdict" == "$want_verdict" ]] \
              || fail "${desc}：NOTIFY_VERDICT 应为 ${want_verdict}，实际「${got_verdict}」"
            [[ "$got_detail" == "$want_detail" ]] \
              || fail "${desc}：详情应为「${want_detail}」，实际「${got_detail}」"
            echo "✓ ${desc} → ${got_verdict}${got_detail:+（${got_detail}）}"
          }

          # ---- 非 2xx：连不上（000）与网关错误页，先判、不去解析响应体 ----
          check "连接失败（000）" dingtalk 000 '' rejected 'HTTP 000'
          check "500 + 错误页首行" generic 500 'upstream error' rejected 'HTTP 500，upstream error'
          # 响应体进日志要限长：代理的错误页可能有几十 KB
          long_body="$(printf 'x%.0s' {1..300})"
          long_kept="$(printf 'x%.0s' {1..200})"
          check "500 + 超长首行只留 200 字符" generic 500 "$long_body" rejected "HTTP 500，${long_kept}"
          # 详情直接进 GitHub 注解，而注解按行解析：平台侧文本里的换行必须压掉，
          # 否则后半段会被当成另一条工作流命令
          check "500 + CRLF 首行只留一行" generic 500 $'bad gateway\r\nmore' rejected 'HTTP 500，bad gateway'

          # ---- 钉钉：成败在响应体的 errcode 里，不在 HTTP 码里 ----
          # 正对照：errcode 0 必须判「平台已确认送达」。没有它，一个「永远 rejected」
          # 的实现也能让下面每条失败用例全绿。
          check "钉钉 200 + errcode 0（正对照）" dingtalk 200 '{"errcode":0,"errmsg":"ok"}' confirmed ''
          check "钉钉 200 + errcode 310000（关键词不命中）" dingtalk 200 \
            '{"errcode":310000,"errmsg":"keywords not in content"}' \
            rejected 'errcode=310000 errmsg=keywords not in content'
          check "钉钉 200 + errcode 非 0 且无 errmsg" dingtalk 200 '{"errcode":300001}' rejected 'errcode=300001'
          # jq -r 会把 JSON 里的 \n 还原成真换行（实测如此），平台侧文本因此可能
          # 带换行——详情压成单行是进入 GitHub 注解的前提
          check "钉钉 200 + errmsg 含换行（压成单行）" dingtalk 200 \
            '{"errcode":310000,"errmsg":"first\nsecond"}' rejected 'errcode=310000 errmsg=first second'

          # ---- 飞书：字段叫 code，StatusCode 只是回退 ----
          check "飞书 200 + code 0（正对照）" feishu 200 '{"code":0,"msg":"success","data":{}}' confirmed ''
          check "飞书 200 + code 11232（限流）" feishu 200 '{"code":11232,"msg":"rate limit"}' \
            rejected 'code=11232 msg=rate limit'
          check "飞书 200 + code 缺失时回退 StatusCode" feishu 200 \
            '{"StatusCode":0,"StatusMessage":"success"}' confirmed ''
          check "飞书 200 + 回退字段报错" feishu 200 '{"StatusCode":9499,"StatusMessage":"rate limit"}' \
            rejected 'StatusCode=9499 msg=rate limit'

          # ---- 无法判定：独立成类，绝不默认成功 ----
          check "钉钉 200 + 非 JSON（代理错误页）" dingtalk 200 '<html>502 Bad Gateway</html>' \
            undetermined '响应体不是 JSON'
          check "飞书 200 + 非 JSON" feishu 200 '<html>502 Bad Gateway</html>' undetermined '响应体不是 JSON'
          check "钉钉 200 + JSON 里没有 errcode" dingtalk 200 '{"foo":"bar"}' \
            undetermined '响应体里没有 errcode 字段'
          check "飞书 200 + JSON 里没有 code" feishu 200 '{"foo":"bar"}' undetermined '响应体里没有 code 字段'
          check "钉钉 200 + 空体" dingtalk 200 '' undetermined '响应体为空'
          check "飞书 200 + 空体" feishu 200 '' undetermined '响应体为空'
          # `null` 是**合法** JSON，只是取值本身为假。判「能不能解析」不能用
          # `jq -e .`——它在 null / false 上返回非零，会把「能解析」读成「不是 JSON」，
          # 于是给出的原因与事实不符（判定同为 undetermined，但排查方向被带偏）。
          # 仓库在 regctl 凭证合并那处已经记过这一条。
          check "钉钉 200 + 裸 null（合法 JSON 但不是对象）" dingtalk 200 'null' \
            undetermined '响应体里没有 errcode 字段'
          check "未知类型不默认成功" bogus 200 'ok' undetermined '未知的通知类型：bogus'

          # ---- Slack：回执是纯文本，不是 JSON ----
          check "Slack 200 + ok（正对照）" slack 200 'ok' confirmed ''
          check "Slack 200 + invalid_payload" slack 200 'invalid_payload' rejected 'invalid_payload'
          check "Slack 200 + 空体" slack 200 '' undetermined '响应体为空'
          # 透明代理返回的 200 HTML 错误页走的是同一条路径。它不是 Slack 的回执，
          # 报成「平台拒收」会把排查方向带偏到机器人配置上——AC3 要求「响应体不是
          # 预期结构」单独成「无法判定」，对 Slack 一样成立。
          check "Slack 200 + HTML（透明代理的错误页）" slack 200 '<html>502 Bad Gateway</html>' \
            undetermined '响应体不是 Slack 的预期回执（<html>502 Bad Gateway</html>）'

          # ---- generic：自建 webhook 没有可依据的回执契约，不猜它的成败 ----
          # 200 空体是本项目明确保留的边界：**必须继续算成功**，不能因为解析不了
          # 就报失败。
          check "generic 200 + 空体（自建 webhook 的常态）" generic 200 '' accepted '该类型无统一回执'
          check "generic 200 + 任意响应体" generic 200 '{"whatever":true}' accepted '该类型无统一回执'

          echo "NOTIFY-VERDICT-OK"

      - name: 验证通知送达判定的端到端行为
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 抽取式单测证不了「响应体真的被交给了判定」——把 `-o "$body_file"` 改回
          # `-o /dev/null`，判定看到的永远是空文件，而上面的单测照样全绿。
          # 所以真发一次：让假 webhook 给出不同的响应体，看脚本怎么讲。
          #
          # 不能加 --dry-run（干跑不发通知，通知的对象不存在）；用非法引用造失败，
          # 不需要 registry、也不联网。
          fail() { echo "::error::$1"; exit 1; }

          # 端口是 job 内共享的资源：8896 / 8897 / 8898 / 8899 已被本 job 其它步骤占用。
          # 四个用例的响应体各不相同，改行为就重启服务器——不在同一个端口上复用响应内容。
          hook_port=8895
          cat > /tmp/hook-verdict.py <<'PY'
          import os
          from http.server import BaseHTTPRequestHandler, HTTPServer

          BODY = os.environ.get('HOOK_BODY', '').encode()


          class H(BaseHTTPRequestHandler):
              def do_POST(self):
                  n = int(self.headers.get('Content-Length', 0))
                  self.rfile.read(n)
                  self.send_response(int(os.environ.get('HOOK_CODE', '200')))
                  self.end_headers()
                  self.wfile.write(BODY)

              def log_message(self, *a):
                  pass


          HTTPServer(('127.0.0.1', int(os.environ['HOOK_PORT'])), H).serve_forever()
          PY

          hook_pid=""
          stop_hook() {
            if [[ -n "$hook_pid" ]]; then
              kill "$hook_pid" 2>/dev/null || true
              wait "$hook_pid" 2>/dev/null || true
              hook_pid=""
            fi
          }
          trap stop_hook EXIT

          # 换响应体就重启服务器，并等它真的能收请求：用固定 sleep 猜时长，
          # 偶发会走成「连接失败」，而那条输出与「平台拒收」长得很像。
          start_hook() {
            HOOK_BODY="$1" HOOK_CODE="${2:-200}" HOOK_PORT="$hook_port" python3 /tmp/hook-verdict.py &
            hook_pid=$!
            local tries=0
            while [[ "$tries" -lt 20 ]]; do
              if curl -sS -o /dev/null --max-time 1 "http://127.0.0.1:${hook_port}/hook" 2>/dev/null; then
                return 0
              fi
              tries=$((tries + 1))
              sleep 0.25
            done
            fail "假 webhook 没起来（端口 ${hook_port}）"
          }

          # 输出落文件、退出码落变量：命令替换配 errexit 会把整段输出连同退出码
          # 一起吞掉，而这两个都要断。
          sync_out=/tmp/notify-verdict-sync-out.txt
          sync_rc=0
          run_sync() {
            set +e
            ./scripts/sync.sh --src 'https://bad.example.com/x:1' --dest r.example.com/x \
              --notify-webhook "http://127.0.0.1:${hook_port}/hook" "$@" > "$sync_out" 2>&1
            sync_rc=$?
            set -e
          }

          # --- (a) 200 + errcode 0：平台确认接收 ---
          start_hook '{"errcode":0,"errmsg":"ok"}'
          run_sync --notify-type dingtalk
          grep -qF '结果已推送到 dingtalk（平台已确认送达）' "$sync_out" \
            || { cat "$sync_out"; fail "200 + errcode 0 未报「平台已确认送达」"; }
          # AC5：通知的结论不能影响运行的退出码（这里是镜像失败的 2）
          [[ "$sync_rc" == "2" ]] || fail "通知判定改变了退出码（期望 2，实际 ${sync_rc}）"
          stop_hook
          echo "✓ (a) 200 + errcode 0 → 平台已确认送达"

          # --- (b) 200 + errcode 310000：平台侧拒收（本 issue 的缺陷形态）---
          start_hook '{"errcode":310000,"errmsg":"keywords not in content"}'
          run_sync --notify-type dingtalk
          grep -qF '通知被 dingtalk 拒收' "$sync_out" \
            || { cat "$sync_out"; fail "200 + errcode 非 0 未报「拒收」（HTTP 码不是成功的充分条件）"; }
          grep -qF 'errcode=310000 errmsg=keywords not in content' "$sync_out" \
            || { cat "$sync_out"; fail "拒收文案未带出平台给出的原因"; }
          # 负向判据必须与上面的正向成对：单写「不含成功字样」时，一个根本没跑成的
          # 步骤（跳过、输出为空）也会「通过」。
          if grep -qF '平台已确认送达' "$sync_out"; then
            cat "$sync_out"
            fail "平台已拒收却仍报「已送达」——这正是 Issue #159 的缺陷形态"
          fi
          stop_hook
          echo "✓ (b) 200 + errcode 310000 → 拒收，且带出原因"

          # --- (c) 200 + 非 JSON：无法判定单独成一类 ---
          start_hook '<html>502 Bad Gateway</html>'
          run_sync --notify-type dingtalk
          grep -qF '通知发送结果无法判定' "$sync_out" \
            || { cat "$sync_out"; fail "200 + 非 JSON 未报「无法判定」"; }
          grep -qF '响应体不是 JSON' "$sync_out" \
            || { cat "$sync_out"; fail "无法判定未说明原因"; }
          if grep -qF '平台已确认送达' "$sync_out"; then
            cat "$sync_out"
            fail "判不出来却被报成「已送达」"
          fi
          stop_hook
          echo "✓ (c) 200 + 非 JSON → 无法判定"

          # --- (d) generic + 200 空体：自建 webhook 必须继续算成功 ---
          start_hook ''
          run_sync --notify-type generic
          grep -qF '结果已推送到 generic（该类型无统一回执，送达状态无法判定）' "$sync_out" \
            || { cat "$sync_out"; fail "自建 webhook 的 200 空体未继续算成功（PRD 边界）"; }
          if grep -qF '拒收' "$sync_out"; then
            cat "$sync_out"
            fail "自建 webhook 的空体被判成了拒收"
          fi
          stop_hook
          echo "✓ (d) generic + 200 空体 → 仍算成功"

          # --- (e) 非 2xx：网关的错误，与「平台拒收」是两副面孔 ---
          # 合成一句话会误导排查方向（去查平台配置，而真正的问题是代理挂了）
          start_hook 'bad gateway' 502
          run_sync --notify-type dingtalk
          grep -qF '通知发送失败（HTTP 502，bad gateway）' "$sync_out" \
            || { cat "$sync_out"; fail "非 2xx 未报「通知发送失败」（HTTP 码与响应体首行都要带出）"; }
          if grep -qF '拒收' "$sync_out"; then
            cat "$sync_out"
            fail "代理返回 502 被说成了「平台拒收」——两副面孔合并会误导排查方向"
          fi
          stop_hook
          echo "✓ (e) HTTP 502 → 通知发送失败（与「拒收」文案分开）"

          # --- (f) 非 2xx 且响应体为空：与改前的文案一字不差 ---
          # 非 2xx 是既有路径（改前就在报「通知发送失败（HTTP <码>）」），使用者
          # 的日志检索可能依赖这句话。带响应体是在它后面**追加**，不是替换；
          # 空体这一支必须逐字保持原样。
          start_hook '' 502
          run_sync --notify-type dingtalk
          grep -qF '通知发送失败（HTTP 502），结果不受影响' "$sync_out" \
            || { cat "$sync_out"; fail "非 2xx 空体的文案与改前不一致（既有检索会失效）"; }
          stop_hook
          echo "✓ (f) HTTP 502 + 空体 → 文案与改前一字不差"

          # --- AC5：通知发不出去只告警，绝不能让运行变红 ---
          # 直接调 notify_send_text（抽出两个函数、桩掉日志函数），断返回值仍是 0：
          # 它若返回非零，调用方在 set -e 下会当场中断——一次成功的同步就变红了。
          for fn in notify_delivery_verdict notify_send_text; do
            sed -n "/^${fn}()/,/^}/p" scripts/sync.sh
          done > /tmp/notify-send-fns.sh
          grep -qF 'notify_send_text()' /tmp/notify-send-fns.sh || fail "没能从 sync.sh 抽出 notify_send_text"

          cat > /tmp/test-notify-return.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          # shellcheck disable=SC1091
          source /tmp/notify-send-fns.sh

          log_info() { :; }
          log_warn() { :; }
          gh_warning() { :; }

          # 可选：把 mktemp 换成一定失败，验证「建不出临时文件」时仍返回 0。
          # 用 stub 而不是给 TMPDIR 一个不存在的目录：BSD 的 mktemp 根本不读
          # TMPDIR（本机实测仍成功），那样写会在本地假绿、只有 Linux 上才红。
          if [[ "${STUB_MKTEMP_FAIL:-}" == "1" ]]; then
            mktemp() { return 1; }
          fi

          NOTIFY_TYPE=dingtalk
          NOTIFY_VERDICT=""
          NOTIFY_VERDICT_DETAIL=""
          NOTIFY_WEBHOOK="$1"

          # **裸调用**，不写成 `notify_send_text ... || fail`：调用点一旦进了
          # `||` 列表，errexit 对函数**内部**就失效了——内部命令失败不会中断，
          # 函数照常跑到 return 0，断言于是只能看到「返回值是 0」这一个形态
          # （实测：mktemp 失败时函数继续执行、脚本以 0 退出，假绿）。
          # 真实调用点（send_notification）就是裸调用，这里照着它写：
          # 返回值非零、或内部命令失败触发 errexit，两种都会让本脚本以非零退出。
          notify_send_text "正文" "标题"
          echo "✓ notify_send_text 在「${2}」时既没中断、也没返回非零"
          SCRIPT

          # 两种失败形态各一次：判定落到 rejected（服务器此刻已经关掉，先重新起
          # 一个会「拒收」的），以及连不上（8894 上没有东西在听 → HTTP 000）
          start_hook '{"errcode":310000,"errmsg":"keywords not in content"}'
          bash /tmp/test-notify-return.sh "http://127.0.0.1:${hook_port}/hook" 平台拒收
          stop_hook
          bash /tmp/test-notify-return.sh 'http://127.0.0.1:8894/hook' 连接失败
          # 建不出临时文件（TMPDIR 不可写这类环境）也必须返回 0：临时文件是本次
          # 新增的失败面，而 set -e 会穿透函数——mktemp 的失败一旦冒出去，一次
          # 成功的同步就会因为通知这个附属动作而以非零退出。
          STUB_MKTEMP_FAIL=1 bash /tmp/test-notify-return.sh 'http://127.0.0.1:8894/hook' 临时文件建不出来

          echo "NOTIFY-VERDICT-E2E-OK"

      - name: 验证 feishu / slack 通知的端到端（包装与结论）
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # #159 把「通知到底送达没有」改成按平台分别解析响应体 —— **每多一个平台就多一份
          # 实现**：类型识别、payload 包装、回执判定、日志结论四处都要各自接一遍线。
          # 端到端此前只跑了 dingtalk 与 generic（见「验证通知送达判定的端到端行为」），
          # feishu / slack 只有抽取式单测，而单测喂的是判定函数本身，绕开了
          # 「payload 构造 → 假 webhook → 判定 → 文案」整条链路。feishu 的 msg_type 包装
          # 或 slack 的 text 包装改错时，单测照样绿，**而真实发出去的 payload 平台不认**。
          #
          # 所以为这两个平台各跑一次真发（假 webhook 按该平台的回执形态应答），并且
          # 同时断**包装字段**与**日志结论** —— 它们分属两条实现路径，只断一条等于
          # 只接了一半的线。
          #
          # 端口是 job 内共享的资源：8894（用来造「连不上」）/ 8895 / 8896 / 8897 / 8898 /
          # 8899 已被本 job 其它步骤占用，这里另起 8893。
          fail() { echo "::error::$1"; exit 1; }

          hook_port=8893
          payload=/tmp/hook-platform-payload.json
          sync_out=/tmp/hook-platform-sync-out.txt
          sync_rc=0

          # 假 webhook：请求体落盘（断言包装字段要看它），并按配置回应该平台的回执形态
          cat > /tmp/hook-platform.py <<'PY'
          import os
          from http.server import BaseHTTPRequestHandler, HTTPServer

          BODY = os.environ.get('HOOK_BODY', '').encode()


          class H(BaseHTTPRequestHandler):
              def do_POST(self):
                  n = int(self.headers.get('Content-Length', 0))
                  with open(os.environ['HOOK_PAYLOAD'], 'wb') as f:
                      f.write(self.rfile.read(n))
                  self.send_response(int(os.environ.get('HOOK_CODE', '200')))
                  self.end_headers()
                  self.wfile.write(BODY)

              def log_message(self, *a):
                  pass


          HTTPServer(('127.0.0.1', int(os.environ['HOOK_PORT'])), H).serve_forever()
          PY

          hook_pid=""
          stop_hook() {
            if [[ -n "$hook_pid" ]]; then
              kill "$hook_pid" 2>/dev/null || true
              wait "$hook_pid" 2>/dev/null || true
              hook_pid=""
            fi
          }
          trap stop_hook EXIT

          # 换回执就重启服务器，并等它真的能收请求：用固定 sleep 猜时长，偶发会走成
          # 「连接失败」，而那条输出与「平台拒收」长得很像，排查会从一开始就被带偏
          start_hook() {
            HOOK_BODY="$1" HOOK_PAYLOAD="$payload" HOOK_PORT="$hook_port" \
              python3 /tmp/hook-platform.py &
            hook_pid=$!
            local tries=0
            while [[ "$tries" -lt 20 ]]; do
              if curl -sS -o /dev/null --max-time 1 "http://127.0.0.1:${hook_port}/hook" 2>/dev/null; then
                return 0
              fi
              tries=$((tries + 1))
              sleep 0.25
            done
            fail "假 webhook 没起来（端口 ${hook_port}）"
          }

          # 不能加 --dry-run（干跑不发通知，通知的对象不存在）；用非法引用造失败，
          # 不需要 registry、也不联网。输出落文件、退出码落变量：命令替换配 errexit
          # 会把整段输出连同退出码一起吞掉，而这两个都要断。
          #
          # 每次发送前清掉上一份 payload —— 否则「这一次没发」会被上一份文件冒充成
          # 「发了」，而下面几条断言看的正是那个文件
          send_to_hook() {
            rm -f "$payload"
            set +e
            ./scripts/sync.sh --src 'https://bad.example.com/x:1' --dest r.example.com/x \
              --notify-webhook "http://127.0.0.1:${hook_port}/hook" "$@" > "$sync_out" 2>&1
            sync_rc=$?
            set -e
          }

          # --- feishu：HTTP 200 + code:0 → 平台确认送达 ---
          start_hook '{"code":0,"msg":"success"}'
          send_to_hook --notify-type feishu
          # 夹具前提要自己先立住：这是一次**真的失败**运行（退出码 2），通知正文才可能是
          # 「失败详情」。少了这一条，夹具哪天不再造出失败（比如非法引用被放行），
          # 下面只断包装字段的几条会照样绿，而它们验证的现场已经不存在了
          [[ "$sync_rc" == "2" ]] || fail "用例前提不成立：非法引用应让运行以 2 结束，实际 ${sync_rc}"
          grep -qF '结果已推送到 feishu（平台已确认送达）' "$sync_out" \
            || { cat "$sync_out"; fail "feishu 回执 code:0 未报「平台已确认送达」"; }
          [[ -s "$payload" ]] || { cat "$sync_out"; fail "feishu 通知没发出去（假 webhook 没收到 POST）"; }
          jq -e '(.msg_type == "text") and (.content | keys == ["text"])' "$payload" >/dev/null \
            || { cat "$payload"; fail "feishu 真实发出的包装应为 msg_type=text + content.text"; }
          # 与上面成对：确认送达时不该同时出现拒收的字样
          if grep -qF '通知被 feishu 拒收' "$sync_out"; then
            cat "$sync_out"
            fail "feishu 已确认送达，却又报了拒收"
          fi
          stop_hook
          echo "✓ feishu：回执 code:0 → 已确认送达，且包装为 msg_type=text"

          # --- slack：HTTP 200 + 纯文本 invalid_payload → 拒收 ---
          start_hook 'invalid_payload'
          send_to_hook --notify-type slack
          grep -qF '通知被 slack 拒收' "$sync_out" \
            || { cat "$sync_out"; fail "slack 回执 invalid_payload 未报「拒收」（HTTP 码不是成功的充分条件）"; }
          # 结论之外还要带出平台给的那枚 token：只说「拒收」会让人无从下手
          grep -qF 'invalid_payload' "$sync_out" \
            || { cat "$sync_out"; fail "slack 的拒收文案没带出平台回执里的 token"; }
          [[ -s "$payload" ]] || { cat "$sync_out"; fail "slack 通知没发出去（假 webhook 没收到 POST）"; }
          # slack 与 generic 共用同一条 payload 分支，所以这里要钉住「发出去的正是顶层
          # text 这一种包装」——写成 feishu 的 msg_type 时，平台不认而单测照样绿
          jq -e 'keys == ["text"]' "$payload" >/dev/null \
            || { cat "$payload"; fail "slack 真实发出的包装应为顶层 text（且只有这一个键）"; }
          if grep -qF '平台已确认送达' "$sync_out"; then
            cat "$sync_out"
            fail "slack 已拒收却仍报「已送达」——这正是 Issue #159 的缺陷形态"
          fi
          stop_hook
          echo "✓ slack：回执 invalid_payload → 拒收并带出 token，且包装为顶层 text"
      - name: 验证非法镜像引用会被拦下
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 两种情况都必须失败：带协议前缀的、缺少 tag 的
          for bad in "https://example.com/nginx:1.27" "nginx"; do
            echo "--- 期望被拒绝：${bad}"
            set +e
            ./scripts/sync.sh --src "$bad" --dest registry.example.com/smoke --dry-run
            code=$?
            set -e

            if [[ "$code" -ne 2 ]]; then
              echo "::error::输入「${bad}」应被判定为同步失败（期望退出码 2，实际 ${code}）"
              exit 1
            fi
            echo "✓ 已正确拒绝（退出码 ${code}）"
          done

      - name: 验证缺少必填参数时报错
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          set +e
          out="$(./scripts/sync.sh --src "nginx:1.27" 2>&1)"
          code=$?
          set -e
          if [[ "$code" -ne 1 ]]; then
            echo "::error::缺少 --dest 时应以退出码 1 结束，实际为 ${code}"
            exit 1
          fi
          echo "✓ 缺少必填参数时正确报错"

          # 报错文案要把**三种**目标模式列全（--dest / --dest-keep-path / --dest-exact）。
          # 漏掉 --dest-keep-path 会把「想保留路径」的人引向 --dest（压平，正是他不想要的）
          # 或 --dest-exact（只接受单个源镜像）——他最容易撞上这条报错，也最需要它说对。
          #
          # **只查报错那一行，不查完整输出**：log_error 之后紧跟着打印 usage，而 usage
          # 本来就列出了全部参数，拿完整输出 grep 无论文案写得多烂都会命中——那是恒真的
          # 断言。这个缺陷此前正是这样长期存在的：原断言只看退出码，不看文案。
          err_line="$(grep -m1 '缺少必填参数' <<<"$out")"
          if [[ -z "$err_line" ]]; then
            echo "::error::输出里没有「缺少必填参数」的报错行"
            exit 1
          fi
          for flag in --dest --dest-keep-path --dest-exact; do
            if ! grep -qF -- "$flag" <<<"$err_line"; then
              echo "::error::报错文案漏了 ${flag}：${err_line}"
              exit 1
            fi
          done
          echo "✓ 报错文案把三种目标模式都列了出来"

      - name: 验证并发、超时与增量跳过参数
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 并发同步：3 个镜像、并发度 3，dry-run 下应全部走完且结果顺序与输入一致
          output="$(./scripts/sync.sh \
            --src "nginx:1.27,redis:7.4,alpine:3.20" \
            --dest registry.example.com/smoke \
            --concurrency 3 --timeout 120 --skip-existing --dry-run 2>&1)"

          echo "$output"

          # 结果表应按输入顺序排列。并发下各镜像的完成顺序是不确定的，
          # 结果经由带序号的临时文件收集后再按序读回，这里正是在守住这一点。
          order="$(printf '%s\n' "$output" | awk '/✓/ && /^ / {print $NF}' | paste -sd, -)"
          expected="nginx:1.27,redis:7.4,alpine:3.20"
          if [[ "$order" != "$expected" ]]; then
            echo "::error::并发模式下结果顺序异常：期望 ${expected}，实际 ${order}"
            exit 1
          fi
          echo "✓ 并发同步执行完毕，结果顺序与输入一致"

          # perl 兜底是 macOS 的唯一防线（系统默认没有 timeout/gtimeout），
          # ubuntu 上走不到那个分支，所以直接测兜底机制本身：alarm 应在 2 秒
          # 内终止 sleep 10（SIGALRM 默认退出码 142），正常命令与参数透传不受影响
          start="$(date +%s)"
          if perl -e 'alarm shift; exec @ARGV' 2 sleep 10 2>/dev/null; then
            echo "::error::perl alarm 未终止超时命令"
            exit 1
          fi
          elapsed=$(( $(date +%s) - start ))
          if [[ "$elapsed" -ge 9 ]]; then
            echo "::error::perl alarm 未在超时点终止命令（耗时 ${elapsed}s）"
            exit 1
          fi
          out="$(perl -e 'alarm shift; exec @ARGV' 5 printf '%s-%s\n' arg1 arg2)"
          if [[ "$out" != "arg1-arg2" ]]; then
            echo "::error::perl 兜底下参数透传异常：${out}"
            exit 1
          fi
          echo "✓ perl alarm 兜底可用（${elapsed}s 终止超时命令，参数透传正常）"

      - name: 验证检查模式的报告落盘
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          rm -rf /tmp/report-smoke && mkdir -p /tmp/report-smoke
          ./scripts/sync.sh \
            --src "nginx:1.27" \
            --dest registry.example.com/smoke \
            --dry-run --report-dir /tmp/report-smoke >/dev/null 2>&1 || true
          ./scripts/sync.sh \
            --src "nginx:1.27" \
            --dest registry.example.com/smoke \
            --audit --dry-run --report-dir /tmp/report-smoke >/dev/null 2>&1 || true

          # --audit 的报告必须真的落盘（dry-run 不影响审计本身，但也不该影响报告）
          for f in audit-report.md audit-report.json; do
            if [[ ! -s "/tmp/report-smoke/$f" ]]; then
              echo "::error::审计报告未落盘或为空：$f"
              exit 1
            fi
          done
          # JSON 必须可解析，且顶层字段齐全
          jq -e '.generated_at and .check == "audit" and (.records | type == "array")' \
            /tmp/report-smoke/audit-report.json >/dev/null
          echo "✓ 检查报告 .md 与 .json 落盘且 JSON 结构正确"

      - name: 验证非法参数被立即拒绝
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 这些都应该以退出码 1（参数错误）结束，而不是跑到一半才炸。
          #
          # 光断退出码是不够的：启动校验区里有将近二十条 die，退出码 1 可能来自
          # 任何一条，「这条被拒绝」与「别的 die 先炸了」区分不开。所以必须再断
          # **报错文案**——一条断言的可信度取决于它能不能指出是哪条 die 触发的。
          check_reject() {
            local desc="$1" expect="$2"; shift 2
            local out code
            set +e
            out="$("$@" 2>&1)"
            code=$?
            set -e
            if [[ "$code" -ne 1 ]]; then
              printf '%s\n' "$out"
              echo "::error::${desc}：期望退出码 1，实际 ${code}"
              exit 1
            fi
            if [[ "$out" != *"$expect"* ]]; then
              printf '%s\n' "$out"
              echo "::error::${desc}：报错文案里没有「${expect}」——退出码对，但炸的不是这条"
              exit 1
            fi
            echo "✓ 已拒绝：${desc}"
          }

          # ---- 数值型与数量型参数 ----
          check_reject "并发度非数字" "--concurrency 必须是非负整数" \
            ./scripts/sync.sh --src "nginx:1.27" --dest r.example.com/x --concurrency abc
          check_reject "并发度为 0" "--concurrency 至少为 1" \
            ./scripts/sync.sh --src "nginx:1.27" --dest r.example.com/x --concurrency 0
          check_reject "超时为非数字" "--timeout 必须是非负整数" \
            ./scripts/sync.sh --src "nginx:1.27" --dest r.example.com/x --timeout soon
          check_reject "精确目标配多个镜像" "--dest-exact 只能搭配单个源镜像使用" \
            ./scripts/sync.sh --src "nginx:1.27,redis:7.4" --dest-exact h.example.com/a --dry-run

          # ---- 互斥组合 ----
          # 互斥判定排在**文件存在性检查之前**（sync.sh 的启动校验区），所以
          # --audit-lock 给一个不存在的路径就够了，不需要真实锁文件。
          check_reject "--dest-exact 与 --dest 互斥" "--dest-exact 不能与 --dest / --dest-keep-path 同时使用" \
            ./scripts/sync.sh --src "nginx:1.27" --dest-exact r.example.com/a --dest r.example.com/x
          check_reject "--dest-exact 与 --dest-keep-path 互斥" "--dest-exact 不能与 --dest / --dest-keep-path 同时使用" \
            ./scripts/sync.sh --src "nginx:1.27" --dest-exact r.example.com/a --dest-keep-path r.example.com/x
          check_reject "--audit 与 --check-updates 互斥" "--audit 与 --check-updates 不能同时使用" \
            ./scripts/sync.sh --src "nginx:1.27" --audit --check-updates
          check_reject "--audit-lock 与 --check-updates 互斥" "--audit-lock 与 --check-updates 不能同时使用" \
            ./scripts/sync.sh --audit-lock /tmp/no-such.lock --check-updates
          check_reject "--audit-lock 与 --audit 互斥" "--audit-lock 与 --audit 不能同时使用" \
            ./scripts/sync.sh --audit-lock /tmp/no-such.lock --audit

          # --audit-lock 自带条目来源：再混入 --src / --file 会让「校验哪些」变成
          # 两份清单的并集，语义只能靠猜。两个入口都要覆盖。
          file_dir="$(mktemp -d)"
          printf 'nginx:1.27\n' > "${file_dir}/images.txt"
          check_reject "--audit-lock 与 --src 互斥" "--audit-lock 自带校验清单" \
            ./scripts/sync.sh --audit-lock /tmp/no-such.lock --src "nginx:1.27"
          check_reject "--audit-lock 与 --file 互斥" "--audit-lock 自带校验清单" \
            ./scripts/sync.sh --audit-lock /tmp/no-such.lock --file "${file_dir}/images.txt"

          # 剔除 attestation 会重建索引，目标的平台摘要必然与源不同，于是审计只
          # 会给出一排**假的「落后」**——比报错更糟，它让人去排查一个并不存在的问题
          check_reject "--audit 与 --strip-attestation 互斥" "--audit 与 --strip-attestation 不能同时使用" \
            ./scripts/sync.sh --src "nginx:1.27" --dest r.example.com/x --audit --strip-attestation

      - name: 验证只读模式的不生效参数告警
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 三个只读模式（--check-updates / --audit / --audit-lock）都会把「传了
          # 但这次用不上」的参数合并成**一条**告警、一次列全。这类告警是使用者
          # 唯一能察觉「参数被吃掉了」的出口，所以断两件事：出现过，以及**只有
          # 一条**——拆成每项一行同样是静默失效，淹没在输出里就没人看得见。
          fail() { echo "::error::$1"; exit 1; }

          # 断言：该模式的告警恰好一行，且这一行里列全了所有预期参数名。
          #
          # marker 要取到告警的**整句前缀**，不能只用「模式名 + 一句形容」那种短串：
          # 「--check-updates 只查上游」在 usage 正文里也写着（sync.sh 的目标地址
          # 一节），运行中的进度行也提到「只查上游 tag」。撞车不会漏报，但会把
          # lines 撑到 2 而假红——假红和恒真一样不可信。带上「，以下参数本次不生效」
          # 这半句就只可能命中这三条告警本身了。
          assert_merged_ignored() {
            local desc="$1" marker="$2" out="$3"; shift 3
            local lines=0 line="" l tok missing=""
            while IFS= read -r l; do
              [[ "$l" == *"$marker"* ]] || continue
              lines=$((lines + 1))
              line="$l"
            done <<<"$out"
            if [[ "$lines" -eq 0 ]]; then
              printf '%s\n' "$out"
              fail "${desc}：输出里没有「${marker}」这条告警"
            fi
            if [[ "$lines" -gt 1 ]]; then
              printf '%s\n' "$out"
              fail "${desc}：这条告警出现了 ${lines} 行，应合并成一条一次列全"
            fi
            for tok in "$@"; do
              [[ "$line" == *"$tok"* ]] || missing="${missing}「${tok}」"
            done
            if [[ -n "$missing" ]]; then
              printf '%s\n' "$line"
              fail "${desc}：告警里没列全，缺 ${missing}"
            fi
            echo "✓ ${desc}：一条告警列全（${line}）"
          }

          # mock skopeo：三条告警都打印在**任何工具调用之前**（`sync.sh` 的启动
          # 校验区），所以被断的东西本身不依赖网络——mock 不是为了「防时绿时红」，
          # 而是为了不联网，并把 run 时间钉死：真 skopeo 会去查 Docker Hub 与
          # r.example.com，配上 --timeout 900 与失败重试会把 runner 白拖住。
          mock_dir="$(mktemp -d)"
          printf '#!/usr/bin/env bash\nexit 1\n' > "${mock_dir}/skopeo"
          chmod +x "${mock_dir}/skopeo"
          PATH="${mock_dir}:$PATH"
          export PATH

          # ③ 的告警在**文件存在性检查之后**（互斥判定才在它之前，两者的先后
          # 不同，别把结论套过来），所以这个用例必须有真实锁文件
          lock_file="${mock_dir}/lock.txt"
          printf 'nginx@sha256:%064d\n' 0 > "$lock_file"

          # ① --check-updates：并发与超时是**与硬编码默认值直接比较**才进列表的
          #    （源码里写死 `CONCURRENCY != "1"` / `TIMEOUT != "600"`），默认值
          #    一改这两项就静默消失。所以两个都要传非默认值过来钉住。
          set +e
          out="$(./scripts/sync.sh --src 'nginx:1.27' --check-updates --dry-run \
            --write-lock "${mock_dir}/never-written.lock" \
            --concurrency 4 --timeout 900 2>&1)"
          set -e
          assert_merged_ignored "--check-updates" "--check-updates 只查上游，以下参数本次不生效" "$out" \
            "本次不生效" "--dry-run" "--write-lock" "--concurrency" "--timeout"

          # ② --audit
          set +e
          out="$(./scripts/sync.sh --src 'nginx:1.27' --dest r.example.com/x --audit \
            --dry-run --write-lock "${mock_dir}/never-written.lock" \
            --verify --skip-existing 2>&1)"
          set -e
          assert_merged_ignored "--audit" "--audit 是只读检查，以下参数本次不生效" "$out" \
            "本次不生效" "--dry-run" "--write-lock" "--verify" "--skip-existing"

          # ③ --audit-lock：--filter 与目标地址都列在同一条里
          set +e
          out="$(./scripts/sync.sh --audit-lock "$lock_file" --dry-run --filter 'kube-' \
            --dest r.example.com/x 2>&1)"
          set -e
          assert_merged_ignored "--audit-lock" "--audit-lock 只校验锁文件，以下参数本次不生效" "$out" \
            "本次不生效" "--dry-run" "--filter / --exclude" "目标地址（--dest / --dest-keep-path）"

      - name: 准备 stub skopeo 夹具（检查模式用例共用）
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 检查模式的三个用例（--updates-limit 的语义、三种检查的报告落盘、审计报告的
          # summary）共用同一个 stub skopeo：它们要的都是**确定的**上游回答，而真 skopeo
          # 会去查 mock-a.local / mock-b.local（DNS 必然失败）或真 registry，跑成什么样
          # 取决于 runner 的网络。
          #
          # 放在**固定路径**上供后面的步骤按需前置到 PATH（每个 run 是独立 shell，
          # 变量不延续）。不写进 PATH 全局：只有显式前置的步骤才看得到它，
          # 免得别的用例在无意间撞上这个「什么仓库都答得出来」的假工具。
          mkdir -p /tmp/stub-skopeo
          cat > /tmp/stub-skopeo/skopeo <<'STUB'
          #!/usr/bin/env bash
          # stub skopeo：只实现本项目用到的两种调用——`list-tags`（--check-updates）
          # 与 `inspect --raw`（审计家族 / 锁文件校验）。回答按引用里的主机与仓库名给出，
          # 好让检查报告拿到**互不相同**的确定计数（计数全相等时，「两处渲染串位」
          # 这类缺陷是隐形的）。
          #
          # 约定的仓库名（源 / 目标两侧共用同一套）：
          #   .../curN      源与目标内容逐字相同 → 最新
          #   .../staleN    目标内容与源不同     → 落后
          #   .../missN     目标明确回答「不存在」→ 缺失
          #   .../unreachN  源连不上             → 无法判定
          #   .../exclN     由 --exclude 排除
          #
          # 源与目标要分开判：源侧的 missN 必须**正常回答**，否则它会被算成
          # 「源仓库中不存在」（无法判定）而不是「目标缺失」，夹具就自己失准了。
          sub="${1:-}"

          # ref 是最后一个 docker:// 参数（前面可能跟着 --tls-verify=false / --authfile X）
          ref=""
          for a in "$@"; do
            case "$a" in
              docker://*) ref="$a" ;;
            esac
          done
          ref="${ref#docker://}"

          case "$sub" in
            list-tags)
              printf '%s\n' '{"Name":"stub","Tags":["v1","v2","v3","v4","v5","v6","v10"]}'
              exit 0
              ;;
            inspect)
              case "$ref" in
                mock-b.local/*)
                  case "$ref" in
                    *stale*)
                      printf '%s\n' '{"schemaVersion":2,"mediaType":"application/vnd.oci.image.index.v1+json","manifests":[{"mediaType":"application/vnd.oci.image.manifest.v1+json","digest":"sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb","size":1,"platform":{"architecture":"amd64","os":"linux"}}]}'
                      exit 0
                      ;;
                    *miss*)
                      echo "manifest unknown" >&2
                      exit 1
                      ;;
                    *)
                      printf '%s\n' '{"schemaVersion":2,"mediaType":"application/vnd.oci.image.index.v1+json","manifests":[{"mediaType":"application/vnd.oci.image.manifest.v1+json","digest":"sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","size":1,"platform":{"architecture":"amd64","os":"linux"}}]}'
                      exit 0
                      ;;
                  esac
                  ;;
                *unreach*)
                  echo "connection refused" >&2
                  exit 1
                  ;;
                *)
                  printf '%s\n' '{"schemaVersion":2,"mediaType":"application/vnd.oci.image.index.v1+json","manifests":[{"mediaType":"application/vnd.oci.image.manifest.v1+json","digest":"sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","size":1,"platform":{"architecture":"amd64","os":"linux"}}]}'
                  exit 0
                  ;;
              esac
              ;;
            *)
              echo "stub skopeo: 未实现的子命令：${sub}" >&2
              exit 1
              ;;
          esac
          STUB
          chmod +x /tmp/stub-skopeo/skopeo
          /tmp/stub-skopeo/skopeo list-tags docker://anything >/dev/null
          echo "✓ stub skopeo 已就位：/tmp/stub-skopeo/skopeo"

      - name: 验证 --updates-limit 只限制展示条数（stub skopeo）
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # --updates-limit 的语义是「只限制**展示**条数，不改变总数」：源码里 limit 只出现在
          # `sort -Vr | head -n "$limit"` 那一处，总数来自**完整**的 missing 列表
          # （total_missing += missing_count）。
          #
          # 坏掉的方式很隐蔽：哪天 limit 被顺手用在过滤上（missing 先 `head -n "$limit"`），
          # total_missing 跟着变小 —— 使用者看到「上游只差 3 个 tag」而实际差 6 个，
          # 退出码仍是 2、也不会告警，**他不会知道还有三个没显示出来**。
          #
          # 所以一条运行里同时断两侧：总数（6 个）与列出条数（恰好 3 个）。只断一侧拦不住
          # 上面那种改法——总数变小而列出条数不变，只断「列出几条」照样绿。
          fail() { echo "::error::$1"; exit 1; }

          # stub skopeo 由前一步放在固定路径上（见「准备 stub skopeo 夹具」）
          PATH="/tmp/stub-skopeo:$PATH"
          export PATH

          # 上游 7 个 tag、清单里只有 v1 → 缺失 6 个。
          # tag 里特意放了 v10：版本序（sort -Vr）与字典序在这里给出不同的前三名，
          # 于是「列出的是 v10 v6 v5」同时钉住了排序口径。
          set +e
          out="$(./scripts/sync.sh --src mock-a.local/app:v1 --check-updates --updates-limit 3 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$out"
          # 退出码 2 是 --check-updates 的既有约定（查出未收录 / 有查询失败）。先钉住它，
          # 是为了把「检查跑完了」与「脚本半路死在别的校验上」区分开
          [[ "$code" -eq 2 ]] || fail "--updates-limit 3：期望退出码 2，实际 ${code}"
          # 断言取的是带数值的行，不是「共 N 个」这个措辞本身——措辞在跳过/失败路径上
          # 也会出现，只匹配措辞等于断言恒真
          grep -qF '上游共 7 个 tag，其中 6 个不在清单中，版本序最大的 3 个' <<<"$out" \
            || fail "--updates-limit 3：总数被 limit 影响了（应仍是 6 个），或没说明只列了 3 个"
          grep -qxF '    v10 v6 v5' <<<"$out" \
            || fail "--updates-limit 3：应恰好列出 3 个（版本序最大的三个）"
          grep -qF '有未收录的 tag（共 6 个）' <<<"$out" \
            || fail "--updates-limit 3：汇总行里的总数应为 6"
          echo "✓ --updates-limit 3：总数仍是 6，只列出 3 个"

          # 正对照：不传 limit（默认 5）→ 总数**仍然**是 6，列出 5 个。
          # 两次运行合起来才证明 limit 只影响展示：只有总数不动、列出条数随 limit 变，
          # 才能把「限制展示」与「限制统计」区分开
          set +e
          out="$(./scripts/sync.sh --src mock-a.local/app:v1 --check-updates 2>&1)"
          code=$?
          set -e
          [[ "$code" -eq 2 ]] || fail "默认 limit：期望退出码 2，实际 ${code}"
          grep -qF '上游共 7 个 tag，其中 6 个不在清单中，版本序最大的 5 个' <<<"$out" \
            || fail "默认 limit（5）：总数应仍是 6 个、且说明只列了 5 个"
          grep -qxF '    v10 v6 v5 v4 v3' <<<"$out" \
            || fail "默认 limit（5）：应恰好列出 5 个"
          echo "✓ 默认 limit（5）：总数仍是 6，列出 5 个——limit 只影响展示"

      - name: 验证 check-updates / lock-audit 的报告落盘（stub skopeo）
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # write_check_report_files 是三种检查（audit / check-updates / lock-audit）**共用**的
          # 一份实现，三处调用点各传一个 check_name。共用最典型的故障是「改一处、另外两处没跟
          # 上」：check_name 传错时不会报任何错，只是**文件名不对**，按名字去找的消费方于是
          # 永远找不到报告——而报告本身明明写出来了。
          #
          # 已有的「验证检查模式的报告落盘」只覆盖了 audit；后两种模式此前一次都没跑过
          # （lock-audit-report 全文出现 0 次，check-updates-report 只出现在手写夹具里）。
          #
          # 这里对每种模式都断三件事：.md / .json 都落盘且非空；json 顶层形状成立；
          # check 字段等于**模式名本身**（写成固定的 "audit" 是这条最可能出的错，也正是
          # 共用实现最容易漏掉的地方）。
          fail() { echo "::error::$1"; exit 1; }

          # stub skopeo 由前面「准备 stub skopeo 夹具」那一步放在固定路径上
          PATH="/tmp/stub-skopeo:$PATH"
          export PATH

          rep="$(mktemp -d)"
          lock="$(mktemp)"
          printf 'mock-a.local/app:v1@sha256:%064d\nmock-a.local/app:v2\n' 0 > "$lock"

          # 两种模式都以退出码 2 结束（都查出了需要关注的项）。先钉退出码，是为了把
          # 「检查跑完了」与「半路死在别的校验上」区分开
          set +e
          ./scripts/sync.sh --src mock-a.local/app:v1 --check-updates --updates-limit 3 \
            --report-dir "$rep" >/dev/null 2>&1
          upd_code=$?
          ./scripts/sync.sh --audit-lock "$lock" --report-dir "$rep" >/dev/null 2>&1
          lock_code=$?
          set -e
          [[ "$upd_code" -eq 2 ]] || fail "--check-updates 期望退出码 2，实际 ${upd_code}"
          [[ "$lock_code" -eq 2 ]] || fail "--audit-lock 期望退出码 2，实际 ${lock_code}"

          for f in check-updates-report.md check-updates-report.json \
                   lock-audit-report.md lock-audit-report.json; do
            [[ -s "${rep}/${f}" ]] || fail "报告未落盘或为空：${f}（检查报告共用一份实现，文件名取决于 check_name）"
          done

          # 顶层形状 + check 字段 + summary 的键名 + records 条数，一次比完。
          # 比整串而不是逐项 `and`：逐项写会让人以为「字段存在」就算过，而这里要的是
          # **每个字段都是这个模式自己的**。summary 用 keys 而不是值——值属于另一个用例
          # （审计报告的 summary 与正文一致），这里管的是「没把别的模式的 summary 传进来」。
          assert_shape() {
            local file="$1" name="$2" want_keys="$3" want_records="$4" got
            got="$(jq -r '[(.generated_at | type), .check, (.summary | type),
                            (.summary | keys | join(",")), (.records | type),
                            (.records | length | tostring)] | join(" ")' "$file")" \
              || fail "报告 JSON 无法解析：${file}"
            echo "  ${file##*/}: ${got}"
            [[ "$got" == "string ${name} object ${want_keys} array ${want_records}" ]] \
              || fail "${file##*/} 的形状不对：期望 check=${name}、summary keys=${want_keys}、records=${want_records} 条，实际：${got}"
          }

          assert_shape "${rep}/check-updates-report.json" "check-updates" \
            "checked,failed,total_missing,with_updates" 1
          assert_shape "${rep}/lock-audit-report.json" "lock-audit" \
            "drift,marker,match,nodigest,unknown" 2
          echo "✓ check-updates / lock-audit 的报告都落盘，check 字段与模式名一致"

      - name: 验证审计报告 summary 与正文一致（stub skopeo）
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 检查报告是**双面**的：md 是给人看的（正文明写一行「**合计**：最新 1 · 落后 2 · …」），
          # json 的 .summary 是给消费方读的。两者由同一批变量渲染，但走的是两条渲染路径，
          # 一旦某条路径漏改或串了变量，只读 json 的下游就会得到一个**与报告正文矛盾**的结论
          # ——而界面上看不出来：两处分别看都「正常」。
          #
          # 夹具刻意让四个计数**互不相同**（1 / 2 / 3 / 4，排除数是 5）：计数值全相等时，
          # 「正文把 stale 渲染成 missing」这类串位是隐形的，等值断言照样绿——
          # 这条正是本仓库记过的「夹具自己让自己恒真」。
          #
          # 此前 CI 里出现过的 .summary.stale 打的是 history.sh 的趋势产物，**不是**检查报告
          # 自己的 summary；检查报告自己的这一项从未被断言过。
          fail() { echo "::error::$1"; exit 1; }

          # stub skopeo 由前面「准备 stub skopeo 夹具」那一步放在固定路径上
          PATH="/tmp/stub-skopeo:$PATH"
          export PATH

          # 按仓库名造 15 个源：cur 1 个（最新）· stale 2 个（落后）· miss 3 个（缺失）
          # · unreach 4 个（无法判定）· excl 5 个（被排除）
          srcs=""
          add_src() {
            if [[ -z "$srcs" ]]; then srcs="$1"; else srcs="${srcs},$1"; fi
          }
          i=0; while [[ "$i" -lt 1 ]]; do add_src "mock-a.local/cur${i}:v1";     i=$((i + 1)); done
          i=0; while [[ "$i" -lt 2 ]]; do add_src "mock-a.local/stale${i}:v1";   i=$((i + 1)); done
          i=0; while [[ "$i" -lt 3 ]]; do add_src "mock-a.local/miss${i}:v1";    i=$((i + 1)); done
          i=0; while [[ "$i" -lt 4 ]]; do add_src "mock-a.local/unreach${i}:v1"; i=$((i + 1)); done
          i=0; while [[ "$i" -lt 5 ]]; do add_src "mock-a.local/excl${i}:v1";    i=$((i + 1)); done

          rep="$(mktemp -d)"
          set +e
          out="$(./scripts/sync.sh --src "$srcs" --dest mock-b.local/x --exclude 'excl' \
            --audit --report-dir "$rep" 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$out" | tail -6
          # 有落后/缺失项 → 退出码 2（审计的既有约定）
          [[ "$code" -eq 2 ]] || fail "审计有落后/缺失项，期望退出码 2，实际 ${code}"

          json="${rep}/audit-report.json"
          md="${rep}/audit-report.md"
          [[ -s "$json" && -s "$md" ]] || fail "审计报告未落盘或为空"

          # ① json 的 .summary 逐字段等于确定的数值——**等值**断言，不是「字段存在」。
          # `-S` 先按键名排序再比：JSON 对象的键序不是语义（把 summary 的键重排是
          # 行为等价的改动，报告内容一字不差），拿键序当判据会把正确实现判红——
          # 那和恒真断言是同一枚硬币的两面，都让人不再信任绿灯。
          got="$(jq -S -c '.summary' "$json" || true)"
          want='{"current":1,"excluded":5,"missing":3,"stale":2,"unknown":4}'
          [[ "$got" == "$want" ]] || fail "audit-report.json 的 .summary 不符：期望 ${want}，实际 ${got}"

          # ② 报告正文里的合计行等于同一组数字。走 md 文件而不是 stdout：stdout 上是
          # `最新 1 ｜ 落后 2 ｜ …`（全角竖线），与本行不是同一段渲染，断 stdout 等于
          # 绕开了「报告正文」这个被断的对象
          grep -qF '**合计**：最新 1 · 落后 2 · 缺失 3 · 无法判定 4' "$md" \
            || { cat "$md"; fail "审计报告正文的合计行与 .summary 不符"; }
          # 反引号写在双引号里并转义：放单引号里会被 shellcheck 当成命令替换（SC2016），
          # 而这段文本里的反引号是 Markdown 的字面内容
          grep -qF "另有 5 条被 \`--filter\` / \`--exclude\` 排除" "$md" \
            || { cat "$md"; fail "审计报告正文的排除条数与 .summary.excluded 不符"; }

          # ③ records 与 summary 同源：五类状态各出现对应条数。只断 summary 的话，
          # 「summary 对了但 records 漏了几条」仍会绿，而下游常按 records 逐条消费
          got="$(jq -r '[.records[].state] | group_by(.) | map({(.[0]): length}) | add | to_entries | sort_by(.key) | map("\(.key)=\(.value)") | join(" ")' "$json" || true)"
          [[ "$got" == "current=1 excluded=5 missing=3 stale=2 unknown=4" ]] \
            || fail "audit-report.json 的 records 与 summary 不一致：${got}"
          echo "✓ summary、正文合计行、records 三处数字一致（1/2/3/4/5）"
      - name: 验证 -h / --help 的退出码
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # -h/--help 与未知参数**共用同一份 usage 输出**，退出码却必须不同：
          # 0 是「你要的帮助给你了」，1 是「你给的东西不认」。脚本常常嵌在
          # set -e 的流水线里，这条差别就是「打印帮助算不算一次失败」。
          fail() { echo "::error::$1"; exit 1; }

          expect_code() {
            local desc="$1" want="$2" expect="$3"; shift 3
            local out code
            set +e
            out="$("$@" 2>&1)"
            code=$?
            set -e
            if [[ "$code" -ne "$want" ]]; then
              printf '%s\n' "$out"
              fail "${desc}：期望退出码 ${want}，实际 ${code}"
            fi
            if [[ "$out" != *"$expect"* ]]; then
              printf '%s\n' "$out"
              fail "${desc}：输出里没有「${expect}」"
            fi
            echo "✓ ${desc}：退出码 ${want}"
          }

          for s in sync history; do
            expect_code "./scripts/${s}.sh -h" 0 "-h, --help" "./scripts/${s}.sh" -h
            expect_code "./scripts/${s}.sh --help" 0 "-h, --help" "./scripts/${s}.sh" --help
            expect_code "./scripts/${s}.sh --no-such-flag" 1 "未知参数：--no-such-flag" \
              "./scripts/${s}.sh" --no-such-flag
          done

      - name: 验证 history.sh 的常量与体检工作流一致
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # history.sh --check 要下载「Check-Registry 工作流里名为 check-report 的
          # Artifact」——这两个字面量一个在脚本里、一个在工作流 YAML 里。对不上时
          # 不会报参数错，而是走完整条下载流程再 die，诊断信息把人指向 GitHub
          # Actions 配置，真实原因却是本地常量过期。所以这条比对是纯文本的。
          fail() { echo "::error::$1"; exit 1; }

          # 取「紧跟在含 CHECK_MODE 的 if 之后」的那条赋值——它才是 --check 模式下
          # 生效的取值；文件开头另有一份同步模式的默认值，取错就变成恒真断言
          check_mode_const() {
            local var="$1"
            awk -v v="$var" '
              prev ~ /CHECK_MODE/ && $0 ~ ("^[[:space:]]*" v "=\"") {
                s = $0; sub(/^[^"]*"/, "", s); sub(/".*$/, "", s); print s
              }
              { prev = $0 }
            ' scripts/history.sh
          }

          # Artifact 名可能出现在多个上传步骤里，全收进来再逐行比对，
          # 免得将来加一个附件就变成误判。
          #
          # **`want` 必须在步骤边界复位（Issue #141）。** 它一旦置位就悬着，若某个上传步骤省略了
          # `name:`，会一路撞上后面**任意一行** `name:`——可能是完全无关的步骤里的
          # 属性行。最坏的情形是那行恰好等于真值：断言不但失效，还会恰好「通过」
          # （已实测：夹具里把属性行写成 check-report 时，旧写法原样把它当成了 artifact）。
          # YAML 里每个步骤都是一个列表项，所以「新列表项」就是步骤边界。
          # 复位那行放在 uses 之前：`- uses: …` 同时匹配两者，先清零再置位才对。
          artifact_names() {
            awk '
              /^[[:space:]]*-[[:space:]]/ { want = 0 }
              /uses: actions\/upload-artifact/ { want = 1; next }
              want && /^[[:space:]]*name:/ {
                s = $0; sub(/^[[:space:]]*name:[[:space:]]*/, "", s); print s; want = 0
              }
            ' "$1"
          }

          uploaded_artifacts="$(artifact_names .github/workflows/check-registry.yml)"

          hist_report="$(check_mode_const REPORT_NAME)"
          hist_workflow="$(check_mode_const WORKFLOW_FILTER)"
          # 顶层 name 在文件里必须是独一份；`sed | head` 的写法在 set -o pipefail
          # 下有 SIGPIPE 假红的可能——断言误伤正确实现和恒真一样不可信
          wf_name="$(sed -n 's/^name:[[:space:]]*//p' .github/workflows/check-registry.yml)"

          [[ -n "$hist_report" ]] || fail "没能从 history.sh 取到 --check 模式的 REPORT_NAME（常量改名了？）"
          [[ -n "$hist_workflow" ]] || fail "没能从 history.sh 取到 --check 模式的 WORKFLOW_FILTER（常量改名了？）"
          [[ -n "$wf_name" ]] || fail "没能从 check-registry.yml 取到工作流 name"
          if [[ "$hist_workflow" != "$wf_name" ]]; then
            fail "history.sh --check 只看工作流「${hist_workflow}」，而体检工作流的 name 是「${wf_name}」——两边对不上"
          fi
          if ! grep -qxF -- "$hist_report" <<<"$uploaded_artifacts"; then
            printf '%s\n' "$uploaded_artifacts"
            fail "history.sh --check 下载的 Artifact 是「${hist_report}」，体检工作流上传的却是上面这些"
          fi
          echo "✓ history.sh 的常量与 check-registry.yml 一致（工作流「${wf_name}」、Artifact「${hist_report}」）"

          # 上面那条只证明「真文件下取到的值对」，证明不了「不会取到别的东西」——
          # 今天的 check-registry.yml 恰好只有一个上传步骤且带 name，那个隐患够不着。
          # 这里用夹具把它摆出来：一个**带 name 的**上传步骤（正对照，证明取法本身有效）、
          # 一个**省略了 name 的**上传步骤，再紧跟一个带 `name:` 属性行的普通步骤，
          # 而那行的值**恰好等于真值**（最坏情形：旧写法会原样把它当成 artifact 而静默通过）。
          #
          # 断言比的是**等值**，不是「非空」：只断非空的话，夹具被写坏（printf 漏行、
          # mktemp 异常等）导致输出为空时会照样变绿——那又把断言变回了恒真。
          # 正对照同时堵死这一类：输出为空一样不等于期望值，会红。
          artifact_fixture="$(mktemp)"
          trap 'rm -f "$artifact_fixture"' EXIT
          # 逐行 printf 而不是 heredoc：heredoc 的内容必须跟着 block scalar 缩进
          # （否则 YAML 解析坏掉），而缩进后的内容写进文件又会变成顶层缩进。
          # printf 一次绕开这两个坑（见 .trellis/spec/workflows/index.md）。
          printf '%s\n' \
            'jobs:' \
            '  a:' \
            '    steps:' \
            '      - uses: actions/upload-artifact@abc' \
            '        with:' \
            '          name: 夹具名' \
            '          path: x' \
            '      - uses: actions/upload-artifact@def' \
            '        with:' \
            '          path: y' \
            '      - name: 第三步' \
            '        with:' \
            '          name: check-report' \
            > "$artifact_fixture"
          fixture_artifacts="$(artifact_names "$artifact_fixture")"
          if [[ "$fixture_artifacts" != "夹具名" ]]; then
            printf '%s\n' "$fixture_artifacts"
            fail "夹具里只该取到上传步骤自己的「夹具名」，实际取到上面这些（want 未按步骤边界复位，或取法根本没跑起来）"
          fi
          echo "✓ artifact 名只取自上传步骤自己的 name，不捎带无关步骤的属性行"

      - name: 验证 history.sh 的参数取值与可选参数的特例分支
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 这一组断的是 history.sh 四个参数的**取值**，不是「跑通了」。
          # 四者坏了都是静默的：
          #   --limit        决定趋势的**窗口大小**——窗口是 history.sh 的核心语义
          #                  （大量断言围绕「窗口内全绿 → 退出码 0」构建），
          #                  唯独窗口大小的来源从没测过
          #   --top-failures 有一条特例分支（后面跟另一个选项或已到结尾时退回默认值），
          #                  坏掉就是悄悄用默认值
          #   --report-name / --workflow 决定去哪个 Artifact、哪个工作流里找报告，
          #                  坏了的表现是「一份报告都捞不到」——看起来像「历史里没有数据」
          fail() { echo "::error::$1"; exit 1; }

          # mock gh：把每次收到的参数记进日志，之后直接断**参数本身**。
          # run list 默认输出空列表（history.sh 以「没有取到任何运行记录」结束，
          # 不联网、也不 sleep——只有下载失败的重试才 sleep 5）；GH_LIST_OUT=one
          # 时给出一个运行 id，好走到下载那一步。
          mock_dir="$(mktemp -d)"
          call_log="${mock_dir}/gh-calls.log"
          : > "$call_log"
          cat > "${mock_dir}/gh" <<'MOCK'
          #!/usr/bin/env bash
          printf '%s\n' "$*" >> "$GH_CALL_LOG"
          if [[ "$1" == "run" && "$2" == "list" ]]; then
            if [[ "${GH_LIST_OUT:-}" == "one" ]]; then
              printf '111\n'
            fi
            exit 0
          fi
          if [[ "$1" == "run" && "$2" == "download" ]]; then
            # 这条文案会被 classify_download_failure 归到 no-artifact：静默跳过，
            # 不进那轮 sleep 5 的重试
            printf 'no valid artifacts found\n' >&2
            exit 1
          fi
          exit 1
          MOCK
          chmod +x "${mock_dir}/gh"
          PATH="${mock_dir}:$PATH"
          GH_CALL_LOG="$call_log"
          export PATH GH_CALL_LOG

          # 取某个选项在日志里的取值。用 awk 定位而不是 grep 固定子串：参数顺序是
          # 无害的细节，断「--limit 后面跟的是几」才既准确又不会因为一次重排而假红。
          # 只打印**第一个**匹配，末尾不接 `head -1`——pipefail 下那会有 SIGPIPE
          # 假红的可能，而假红和恒真一样不可信。
          arg_value() {
            local subcmd="$1" flag="$2"
            awk -v cmd="$subcmd" -v flag="$flag" '
              found { next }
              index($0, cmd " ") == 1 {
                for (i = 1; i < NF; i++) {
                  if ($i == flag) { print $(i+1); found = 1; break }
                }
              }' "$call_log"
          }

          # 每次跑之前清空日志，让 arg_value 只看到本次收到的参数
          run_history() {
            local out
            : > "$call_log"
            set +e
            out="$("$@" 2>&1)"
            set -e
            printf '%s\n' "$out"
          }

          # ---- 窗口大小：--limit 必须落到 gh run list 的参数上 ----
          # 「跑通了」证明不了窗口大小对：把 --limit 写死成 20 的实现照样跑通。
          out="$(run_history ./scripts/history.sh --limit 3)"
          if [[ "$out" != *'没有取到任何运行记录'* ]]; then
            printf '%s\n' "$out"
            fail "--limit 3 时没有走到运行列表这条路（mock 没生效？）"
          fi
          lim="$(arg_value 'run list' --limit)"
          if [[ "$lim" != "3" ]]; then
            cat "$call_log"
            fail "--limit 3 没传到 gh run list 上，窗口大小成了 ${lim}"
          fi
          echo "✓ --limit 3 落到了 gh run list 的窗口参数上"

          # 正对照：不传时窗口是默认的 20。没有它，上面那条在「窗口被写死成 3」
          # 的实现上也会绿。
          run_history ./scripts/history.sh >/dev/null
          lim="$(arg_value 'run list' --limit)"
          if [[ "$lim" != "20" ]]; then
            cat "$call_log"
            fail "不传 --limit 时窗口应为默认 20，实际 ${lim}"
          fi
          echo "✓ 正对照：不传 --limit 时窗口为默认 20"

          # ---- --workflow ----
          run_history ./scripts/history.sh --workflow Release >/dev/null
          wf="$(arg_value 'run list' --workflow)"
          if [[ "$wf" != "Release" ]]; then
            cat "$call_log"
            fail "--workflow Release 没传到 gh run list 上，实际「${wf}」"
          fi
          echo "✓ --workflow 落到了 gh run list 上"

          # --check 模式下**默认**只看体检工作流（窗口不被 CI 等高频运行挤占）。
          # 写成正向等值断言：取值必须是 Check-Registry，而不只是「有值」。
          run_history ./scripts/history.sh --check audit >/dev/null
          wf="$(arg_value 'run list' --workflow)"
          if [[ "$wf" != "Check-Registry" ]]; then
            cat "$call_log"
            fail "--check 模式下的默认工作流应为 Check-Registry，实际「${wf}」"
          fi
          echo "✓ --check 模式下默认只看 Check-Registry"

          # ---- --report-name ----
          # 走到下载那一步，断两处：报错文案里的附件名、gh 实际收到的 -n。
          GH_LIST_OUT=one
          export GH_LIST_OUT
          out="$(run_history ./scripts/history.sh --report-name my-custom-report)"
          want='这 1 次运行里没有任何「my-custom-report」附件'
          if [[ "$out" != *"$want"* ]]; then
            printf '%s\n' "$out"
            fail "--report-name 没落到取值上（期望文案含「${want}」）"
          fi
          name="$(arg_value 'run download' -n)"
          if [[ "$name" != "my-custom-report" ]]; then
            cat "$call_log"
            fail "--report-name 没传到 gh run download -n 上，实际「${name}」"
          fi
          echo "✓ --report-name 落到了下载参数与报错文案上"

          # 正对照：不传时是默认的 sync-report-aliyuncs
          out="$(run_history ./scripts/history.sh)"
          want='这 1 次运行里没有任何「sync-report-aliyuncs」附件'
          if [[ "$out" != *"$want"* ]]; then
            printf '%s\n' "$out"
            fail "不传 --report-name 时未使用默认值（期望文案含「${want}」）"
          fi
          name="$(arg_value 'run download' -n)"
          if [[ "$name" != "sync-report-aliyuncs" ]]; then
            cat "$call_log"
            fail "不传 --report-name 时下载参数应为默认值，实际「${name}」"
          fi
          GH_LIST_OUT=""
          echo "✓ 正对照：不传 --report-name 时为默认 sync-report-aliyuncs"

          # ---- --top-failures 的特例分支：两条路径都要断 ----
          # 「可选参数」最容易被改坏，而坏掉是静默的（悄悄用默认值）。观察点是
          # --report-dir 落盘报告里的 query 字段——这几个取值唯一的机器可读出口。
          work="$(mktemp -d)"
          cat > "${work}/sync-report.json" <<'JSON'
          {"generated_at": "2026-09-01T01:00:00Z", "dry_run": false,
           "total": 2, "success": 1, "skipped": 0, "failed": 1, "excluded": 0,
           "images": [
            {"source": "nginx:1.27", "dest": "r.example.com/x/nginx:1.27", "status": "success",
             "platforms": "linux/amd64", "source_digest": "sha256:aaa", "dest_digest": "sha256:aaa",
             "seconds": 3, "note": ""},
            {"source": "https://bad.example.com/x:1", "dest": "r.example.com/x/x:1", "status": "failed",
             "platforms": "", "source_digest": "", "dest_digest": "", "seconds": 1,
             "note": "镜像引用格式错误"}
           ]}
          JSON

          # 报告没落盘时给出可诊断的失败，而不是让 jq 报「无法打开文件」——
          # 那读起来像脚本坏了，实际是夹具没被消费。
          #
          # 它只在命令替换里被调用，所以**不能用 fail**：命令替换只吸走 stdout，
          # 「::error::哪条断言」会被吞进变量里，CI 上只剩一句「退出码 1」。
          # 这里直接把注解打到 stderr —— 它不进命令替换，一定会出现在日志里。
          query_field() {
            local out_dir="$1" field="$2" desc="$3"
            if [[ ! -f "${out_dir}/sync-trend-report.json" ]]; then
              printf '::error::%s：--report-dir 没落盘趋势报告（夹具没被读进去？）\n' "$desc" >&2
              exit 1
            fi
            jq -r "$field" "${out_dir}/sync-trend-report.json"
          }

          # 夹具里有一条失败记录，退出码是 2，不是错误
          trend_run() {
            local out_dir="$1"; shift
            set +e
            ./scripts/history.sh --dir "$work" --report-dir "$out_dir" "$@" >/dev/null 2>&1
            set -e
          }

          d1="$(mktemp -d)"
          trend_run "$d1" --top-failures 3
          rows="$(query_field "$d1" '.rows | length' '--top-failures 3')"
          top="$(query_field "$d1" '.query.top_failures' '--top-failures 3')"
          # 正对照：夹具确实被读了（两个源镜像 → 两行）。没有它，「行数为 0」
          # 也能让下面那条 top 断言看起来像是通过了。
          [[ "$rows" == "2" ]] || fail "夹具没被读进去：rows 应为 2，实际 ${rows}"
          [[ "$top" == "3" ]] || fail "--top-failures 3 时取值应为 3，实际 ${top}"
          echo "✓ --top-failures 带值时取该值（3）"

          # 不带值、后面跟另一个选项：退回默认 10，**且不能吃掉后面那个选项**
          d2="$(mktemp -d)"
          trend_run "$d2" --top-failures --limit 5
          top="$(query_field "$d2" '.query.top_failures' '--top-failures 后跟 --limit 5')"
          lim="$(query_field "$d2" '.query.limit' '--top-failures 后跟 --limit 5')"
          [[ "$top" == "10" ]] || fail "「--top-failures 后跟另一个选项」时应退回默认 10，实际 ${top}"
          # 这一条才是特例分支的关键：把 shift 2 写成 shift 1 时，--top-failures
          # 会把 --limit 当成自己的值（那会先撞上正整数校验），而退回默认值时
          # 若顺手多 shift 一次，--limit 就消失了——两条路径都在这里见红
          [[ "$lim" == "5" ]] || fail "特例分支吃掉了后面的 --limit：limit 应为 5，实际 ${lim}"
          echo "✓ --top-failures 后跟选项时退回默认 10，且没吃掉 --limit"

          # 不带值、已在结尾：同样退回默认 10
          d3="$(mktemp -d)"
          trend_run "$d3" --top-failures
          top="$(query_field "$d3" '.query.top_failures' '--top-failures 在结尾')"
          [[ "$top" == "10" ]] || fail "「--top-failures 在结尾」时应退回默认 10，实际 ${top}"
          echo "✓ --top-failures 在结尾时退回默认 10"

          # ---- 切片的**效果**：最多显示 N 条 ----
          # 上面几条断的是「CLI 值 → 变量 → 报告的 query 字段」这条通路，而
          # --top-failures 的**语义**是「最多显示几条」——那是切片那一步的事。
          # 实测：把切片写死成 [:10]（忽略变量、永远显示 10 条），上面几条全都不红。
          #
          # 两条边界都要断，且要**恰好**：夹具 5 条失败记录时，「--top-failures 2」
          # 应恰好 2 行，「10」应 5 行都在。写成「不超过 N」会把「少显示了」放过。
          #
          # 切片只作用于**渲染出的 Markdown**：报告 JSON 里的 .rows 是完整数据
          # （query.top_failures 只是记下「本来要显示几条」）。所以这里数 Markdown。
          #
          # 既有夹具只有 1 条失败记录——[:2] 与 [:10] 的输出长度会相同，断言就恒真了。
          # 所以另造一个 5 条失败的，让它能区分「切了」与「没切」。
          #
          # 里面**另外放 2 条成功记录**，这不是凑数：切片表达式是
          # `select(.fail > 0) | [:N]` 两段，只有全是失败记录时，
          # 把 `select(.fail > 0)` 放宽成 `select(.fail >= 0)` 输出条数不变，
          # 那一段就成了没断言的。有了这 2 条，「--top-failures 10」应 5 行
          # 而不是 7 行——过滤那一段也就被钉住了。
          #
          # 计数放在**顶层**（与 sync.sh 落盘的 sync-report 同构），不是嵌套在
          # summary 里：summary 是 --check 报告的形态。放错层时 history.sh 的
          # 总览段会读到 null、打印「累计 0 次 / 失败 0」，而表格里却有 5 行失败，
          # 夹具自相矛盾。
          work2="$(mktemp -d)"
          cat > "${work2}/many-failures.json" <<'JSON'
          {"generated_at": "2026-09-24T00:00:00Z", "dry_run": false,
           "total": 7, "success": 2, "skipped": 0, "failed": 5, "excluded": 0,
           "images": [
            {"source": "a.example.com/a:1", "dest": "r.example.com/x/a:1", "status": "failed",
             "platforms": "", "source_digest": "", "dest_digest": "", "seconds": 1, "note": "e1"},
            {"source": "b.example.com/b:1", "dest": "r.example.com/x/b:1", "status": "failed",
             "platforms": "", "source_digest": "", "dest_digest": "", "seconds": 1, "note": "e2"},
            {"source": "c.example.com/c:1", "dest": "r.example.com/x/c:1", "status": "failed",
             "platforms": "", "source_digest": "", "dest_digest": "", "seconds": 1, "note": "e3"},
            {"source": "d.example.com/d:1", "dest": "r.example.com/x/d:1", "status": "failed",
             "platforms": "", "source_digest": "", "dest_digest": "", "seconds": 1, "note": "e4"},
            {"source": "e.example.com/e:1", "dest": "r.example.com/x/e:1", "status": "failed",
             "platforms": "", "source_digest": "", "dest_digest": "", "seconds": 1, "note": "e5"},
            {"source": "f.example.com/f:1", "dest": "r.example.com/x/f:1", "status": "success",
             "platforms": "", "source_digest": "", "dest_digest": "", "seconds": 1, "note": ""},
            {"source": "g.example.com/g:1", "dest": "r.example.com/x/g:1", "status": "success",
             "platforms": "", "source_digest": "", "dest_digest": "", "seconds": 1, "note": ""}
           ]}
          JSON

          # 表格的数据行数 = 首格带反引号的行数（镜像名渲染成 `xxx`，只有数据行这样）。
          #
          # **不写成「含 "| " 的行数减 2」**：那个 2 把「表头 + 分隔行」写死在里面，
          # 于是数法绑定了「这份报告里有且只有一张表、且表头恰好两行」。实测：
          # 表头多一行 → 数成 3；报告里多出一张小表 → 数成 6。两种都让**正确的**
          # 实现被判红（虽然方向是响亮报错、不会静默放行，但那是维护陷阱）。
          # 按数据行的形状数，就不关心表头有几行——剩下唯一的失准路径是
          # 「同一份报告里再出现一张首格也带反引号的表」，那要靠断言具体是哪几行
          # 才彻底解决（属于「顺序」的范畴，另开）。
          md_rows() {
            local n
            n="$(grep -cE '^\| `' "$1" || true)"
            printf '%d' "$n"
          }
          trend_run2() {
            local out_dir="$1"; shift
            set +e
            ./scripts/history.sh --dir "$work2" --report-dir "$out_dir" "$@" >/dev/null 2>&1
            set -e
          }

          d4="$(mktemp -d)"
          trend_run2 "$d4" --top-failures 2
          shown="$(md_rows "${d4}/sync-trend-report.md")"
          [[ "$shown" -eq 2 ]] || fail "--top-failures 2 时表格应恰好 2 行（夹具 5 条失败记录），实际 ${shown}"
          echo "✓ --top-failures 2 时表格恰好 2 行（该夹具 5 条失败，切片确实生效）"

          # 另一侧：N 大于失败数时全部都要在——切片不该把不足的量也截掉
          d5="$(mktemp -d)"
          trend_run2 "$d5" --top-failures 10
          shown="$(md_rows "${d5}/sync-trend-report.md")"
          [[ "$shown" -eq 5 ]] || fail "--top-failures 10 时表格应有 5 行（夹具全部失败记录），实际 ${shown}"
          echo "✓ --top-failures 10 时 5 条失败记录都在（切片不会截掉不足的量）"

          # ---- 排序的**顺序**：前 N 行必须是 fail 最高的那 N 个 ----
          # 上面断的是「显示几条」，而 --top-failures 的语义是「失败**最多**的前 N 个」
          # ——「最多」那一半是排序。**行数断不出顺序**：把 sort_by(-.fail) 的负号
          # 去掉（改成升序），显示的行数一模一样，而拿到的变成了「失败最少的几个」。
          # 所以这里**按镜像名断**——除了「几行」，还要看是「哪几行」。
          order_dir="$(mktemp -d)"
          # 第 i 份报告里有 i 条记录（都是失败），记录里的镜像名按下面的字母串取；
          # 于是每个镜像的 fail 就是「它出现过的报告数」＝字母串里的**位置**决定：
          # 第 1 位 5 次、第 2 位 4 次……第 5 位 1 次。
          #
          # 字母串是**乱序**的（caebd 而不是 abcde）——这一条很要紧：写成 abcde 时
          # 「按名字排」与「按失败数排」结果**恰好相同**，于是排序写错也看不出来。
          # 实测（改动前）：把 sort_by(-.fail) 换成 sort_by(.source)，或者把切片
          # 挪到排序之前，整套断言**全绿**，而报告显示的是 fail 只有 4 与 2 的两行。
          # 错开后，fail 最高的两个是 c(5) 与 a(4)，与名字序的 a、b 不同。
          #
          # 取字母用 `cut -c` 而不是数组下标——数组下标在 bash 与 zsh 下**起点不同**
          # （zsh 是 1-based），而断言的本地验证未必跑在 bash 里。
          for i in 1 2 3 4 5; do
            {
              printf '{"generated_at":"2026-09-2%dT00:00:00Z","dry_run":false,' "$i"
              printf '"total":%d,"success":0,"skipped":0,"failed":%d,"excluded":0,"images":[' "$i" "$i"
              sep=""
              k=1
              while [[ "$k" -le "$i" ]]; do
                l="$(printf 'caebd' | cut -c "$k")"
                printf '%s{"source":"%s.example.com/%s:1","dest":"r.example.com/x/%s:1","status":"failed","platforms":"","source_digest":"","dest_digest":"","seconds":1,"note":""}' \
                  "$sep" "$l" "$l" "$l"
                sep=","
                k=$((k + 1))
              done
              printf ']}\n'
            } > "${order_dir}/r${i}.json"
          done

          order_out="$(mktemp -d)"
          set +e
          ./scripts/history.sh --dir "$order_dir" --report-dir "$order_out" --top-failures 2 >/dev/null 2>&1
          set -e

          # 正对照：夹具真被读进去了、fail 聚合也对（5/4/3/2/1）。没有它，
          # 下面那条在「夹具没生效、表格为空」时也会通过。
          #
          # 走本步前面定义的 query_field，而不是直接 jq：报告没落盘时它把
          # 「夹具没被读进去」这条注解打到 stderr，而不是让 jq 抛一句
          # 「Could not open file」——那读起来像脚本坏了，实际是夹具没被消费。
          fails="$(query_field "$order_out" '[.rows[].fail] | sort | reverse | join(",")' '--top-failures 的排序夹具')"
          [[ "$fails" == "5,4,3,2,1" ]] || fail "夹具没被读进去或 fail 聚合不对：应为 5,4,3,2,1，实际 ${fails}"

          # 前 2 行必须是 fail 最高的两个（c 与 a）。无论排序反了、按名字排、
          # 还是先切片后排序，行数都还是 2——所以这一条是**顺序**唯一的捕获者。
          #
          # 反引号写成双引号里的转义（\`）、再拼进变量：直接写进**单引号**会让
          # actionlint 里的 shellcheck 报 SC2016，scripts/lint.sh 因此变红。
          tick="\`"
          top2="$(grep -oE "${tick}[a-e]\.example\.com/[a-e]:1${tick}" "${order_out}/sync-trend-report.md" | head -n 2 | tr '\n' ' ')"
          want="${tick}c.example.com/c:1${tick} ${tick}a.example.com/a:1${tick} "
          if [[ "$top2" != "$want" ]]; then
            printf '实际前两行：%s\n' "$top2"
            fail "--top-failures 2 应显示 fail 最高的两个（c、a），实际不是（排序反了、按名字排了，或切片取错了那一端）"
          fi
          echo "✓ --top-failures 2 显示的是 fail 最高的两个（c、a），不是名字序或失败最少的"

          # `sort_by(-.fail, .source)` 的第二键**有意不断**：夹具里 fail 两两不同，
          # 并列时才有它说话的机会。实测（另造 a=3、b=2、c=2 的并列夹具）：把它改成
          # 降序，表格第二行从 b 变成 c——看着像「没断到」，但去掉它与留着它的输出
          # **一模一样**（group_by(.source) 已按名字排好，而 jq 的 sort_by 是稳定
          # 排序），所以它是在给一个「并列取谁」的口径加确定性，不是正确性不变量。
          # 为一处不影响对不对的细节造并列夹具，成本大于收益。

          # ---- 四个校验错误各一条 ----
          # 校验失败的默认形态是「静默用默认值」或「跑到一半才炸」，所以断的是
          # 退出码 + **报错文案**：只断退出码的话，1 可能来自任何一条 die，
          # 「这条被拒绝」与「别的 die 先炸了」区分不开。
          check_reject() {
            local desc="$1" expect="$2"; shift 2
            local out code
            set +e
            out="$("$@" 2>&1)"
            code=$?
            set -e
            if [[ "$code" -ne 1 ]]; then
              printf '%s\n' "$out"
              fail "${desc}：期望退出码 1，实际 ${code}"
            fi
            if [[ "$out" != *"$expect"* ]]; then
              printf '%s\n' "$out"
              fail "${desc}：报错文案里没有「${expect}」——退出码对，但炸的不是这条"
            fi
            echo "✓ 已拒绝：${desc}"
          }

          check_reject "--check 未知类型" "--check 的类型必须是 audit 或 lock-audit，当前为「bogus」" \
            ./scripts/history.sh --check bogus
          check_reject "--limit 为 0" "--limit 必须是正整数，当前为「0」" \
            ./scripts/history.sh --limit 0
          check_reject "--top-failures 为 0" "--top-failures 必须是正整数，当前为「0」" \
            ./scripts/history.sh --top-failures 0
          check_reject "--slowest 非数字" "--slowest 必须是正整数，当前为「abc」" \
            ./scripts/history.sh --slowest abc

      - name: 验证镜像筛选
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          SRC="registry.k8s.io/kube-apiserver:v1.31.0,registry.k8s.io/pause:3.9,nginx:1.27"

          # --filter 只同步匹配项。同时守住顺序：被排除的项仍占位，
          # 结果表的顺序必须与输入一致（与并发模式下的序号保证是同一件事）。
          output="$(./scripts/sync.sh --src "$SRC" --dest r.example.com/x \
            --filter 'kube-' --dry-run 2>&1)"
          echo "$output"

          order="$(printf '%s\n' "$output" | awk '/^ [✓⊘✗]/ {print $NF}' | paste -sd, -)"
          expected="registry.k8s.io/kube-apiserver:v1.31.0,registry.k8s.io/pause:3.9,nginx:1.27"
          if [[ "$order" != "$expected" ]]; then
            echo "::error::筛选后结果顺序异常：期望 ${expected}，实际 ${order}"
            exit 1
          fi

          if ! grep -q '成功 1 个' <<<"$output"; then
            echo "::error::--filter 未按预期只保留 1 个镜像"
            exit 1
          fi
          echo "✓ --filter 生效，且结果顺序与输入一致"

          # --exclude 跳过匹配项（3 个里排掉 kube-apiserver，剩 2 个应成功）
          output="$(./scripts/sync.sh --src "$SRC" --dest r.example.com/x \
            --exclude 'kube-' --dry-run 2>&1)"
          if ! grep -q '成功 2 个' <<<"$output"; then
            echo "::error::--exclude 未按预期排除 1 个镜像"
            exit 1
          fi
          if ! grep -q 'nginx:1.27' <<<"$output"; then
            echo "::error::--exclude 把不该排除的镜像也排掉了"
            exit 1
          fi
          echo "✓ --exclude 生效"

      - name: 验证筛选的边界情况
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 非法正则必须在同步开始前就被拒绝，而不是跑到一半才炸
          for bad in '[' '(' 'a{2,1}'; do
            set +e
            ./scripts/sync.sh --src "nginx:1.27" --dest r.example.com/x \
              --filter "$bad" --dry-run >/dev/null 2>&1
            code=$?
            set -e
            if [[ "$code" -ne 1 ]]; then
              echo "::error::非法正则「${bad}」应以退出码 1 拒绝，实际 ${code}"
              exit 1
            fi
          done
          echo "✓ 非法正则被立即拒绝"

          # 全部被筛掉时必须明确失败。静默地「不同步任何镜像却报成功」
          # 是最危险的结果——使用者会以为同步完成了。
          set +e
          ./scripts/sync.sh --src "nginx:1.27,redis:7.4" --dest r.example.com/x \
            --filter 'nomatch-any' --dry-run >/dev/null 2>&1
          code=$?
          set -e
          if [[ "$code" -ne 1 ]]; then
            echo "::error::全部镜像被筛掉时应以退出码 1 结束，实际 ${code}"
            exit 1
          fi
          echo "✓ 全部被筛掉时明确失败"

          # 有排除项但仍有镜像可同步时，属于正常成功——排除是使用者的意图，
          # 不是失败。这里防的是把 excluded 误算成 fail 导致退出码变成 2。
          set +e
          ./scripts/sync.sh --src "nginx:1.27,redis:7.4" --dest r.example.com/x \
            --exclude 'redis' --dry-run >/dev/null 2>&1
          code=$?
          set -e
          if [[ "$code" -ne 0 ]]; then
            echo "::error::筛选后仍有镜像可同步时应以退出码 0 结束，实际 ${code}"
            exit 1
          fi
          echo "✓ 排除项不会被误判为失败"

      - name: 验证 regctl 路径的平台列表解析
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 这组断言守的是一个曾经长期存在的缺陷：平台列表用
          #   printf '%s' "$platforms" | tr ',' '\n'
          # 逐行读取，而 printf 不输出结尾换行，read 读到没有换行收尾的最后一段时
          # 会返回非零、循环体不执行。结果：单平台一个都读不到而直接失败，
          # 多平台则**静默丢掉最后一个**——arm64 没同步，却没有任何报错。
          #
          # 之所以能守住，是因为 dry-run 现在打印的是真正会执行的 platform_args，
          # 而不是拿输入去复述一遍。dry-run 一旦与实际行为脱节就失去意义。

          # 单平台：曾经完全无法使用
          output="$(./scripts/sync.sh --src nginx:1.27 --dest r.example.com/x \
            --strip-attestation --platforms linux/amd64 --dry-run 2>&1)"
          echo "$output"
          if ! grep -q -- '--platform linux/amd64' <<<"$output"; then
            echo "::error::单平台未能解析出任何平台"
            exit 1
          fi
          echo "✓ 单平台解析正确"

          # 多平台：曾经丢掉最后一个
          output="$(./scripts/sync.sh --src nginx:1.27 --dest r.example.com/x \
            --strip-attestation --platforms linux/amd64,linux/arm64,linux/arm/v7 --dry-run 2>&1)"
          echo "$output"

          count="$(grep -o -- '--platform ' <<<"$output" | wc -l | tr -d ' ')"
          if [[ "$count" -ne 3 ]]; then
            echo "::error::期望传递 3 个平台，实际 ${count} 个——最后一个平台很可能被丢弃了"
            exit 1
          fi

          # 只数个数还不够：三个位置都对才算真的没丢
          for p in linux/amd64 linux/arm64 linux/arm/v7; do
            if ! grep -q -- "--platform ${p}" <<<"$output"; then
              echo "::error::平台 ${p} 未被传递"
              exit 1
            fi
          done
          echo "✓ 多平台全部传递，未丢弃最后一个"

          # 空段全部过滤后没有可用平台；dry-run 计划可以如实标注会失败，
          # 但后续执行仍必须走既有 die 语义，退出码保持 1。
          set +e
          output="$(./scripts/sync.sh --src nginx:1.27 --dest r.example.com/x \
            --strip-attestation --platforms ',' --dry-run 2>&1)"
          code=$?
          set -e
          if [[ "$code" -ne 1 ]] \
            || ! grep -q '平台策略：实际执行会失败：平台列表解析结果为空' <<<"$output" \
            || ! grep -q '平台列表解析结果为空：,' <<<"$output"; then
            echo "::error::空平台列表应先给出计划告警，再按既有语义失败"
            echo "$output"
            exit 1
          fi
          echo "✓ 空平台列表不会触发 unbound variable"

      - name: 验证失效参数的告警方向（--platforms / --skip-existing / --tls-verify）
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 三条「参数被接受却不起作用」的告警，门禁**各不相同**，必须各按各的环境
          # 跑一遍。曾有 issue 把这组统称为「需要 regctl 的组」，而 --platforms 的门禁
          # 恰好相反（`STRIP_ATTESTATION != "true"`，即 **skopeo** 路径）——把它塞进
          # --strip-attestation 的调用里，告警永远不会出现，断言就写成了恒真：
          # 一段永远匹配不上的检查，读起来却像在防着静默失效。
          #
          # 三个门禁（都在 sync.sh 的启动校验区）：
          #   --platforms         STRIP_ATTESTATION != true   → 管的却是 skopeo 路径
          #   --skip-existing     STRIP_ATTESTATION == true   → regctl 路径
          #   --tls-verify false  regctl_path_active == true  → regctl 路径
          fail() { echo "::error::$1"; exit 1; }

          # 带 --platforms 但**不带** --strip-attestation：skopeo 用 --all 推全部平台，
          # 显式指定的平台列表被吃掉。静默失效的后果是推送量与体积远超预期，
          # 却没有报错、退出码也是 0。
          out="$(./scripts/sync.sh --src nginx:1.27 --dest r.example.com/x \
            --platforms linux/amd64 --dry-run 2>&1)"
          if [[ "$out" != *"--platforms 仅在 --strip-attestation 模式下生效，本次将忽略"* ]]; then
            printf '%s\n' "$out"
            fail "skopeo 路径下显式传入 --platforms 时应告警（含参数名与「本次将忽略」）"
          fi
          # 与告警配对的正面证据：计划里确实写着 skopeo --all —— 告警说的「会忽略」
          # 不是空话，而是这条路径的真实行为
          if [[ "$out" != *"执行路径：skopeo copy --all"* ]]; then
            printf '%s\n' "$out"
            fail "skopeo 路径的计划未如实说明走 --all（告警与实际行为必须一致）"
          fi
          echo "✓ skopeo 路径下 --platforms 有告警，且计划确实是 --all"

          # 负面（与上面成对）：开了 --strip-attestation 后 --platforms **真的生效**，
          # 不该再出现那条告警。只断「没有某句」是恒真的，所以同时断平台确实进了
          # 命令——两句合起来才说明「不告警」是因为参数生效，而不是调用根本没跑起来。
          out="$(./scripts/sync.sh --src nginx:1.27 --dest r.example.com/x \
            --strip-attestation --platforms linux/amd64 --dry-run 2>&1)"
          if [[ "$out" == *"--platforms 仅在 --strip-attestation 模式下生效"* ]]; then
            printf '%s\n' "$out"
            fail "regctl 路径下 --platforms 真的生效，不该再告警"
          fi
          if [[ "$out" != *"平台 linux/amd64"* ]]; then
            printf '%s\n' "$out"
            fail "regctl 路径下 --platforms 未进入命令（无法证明「不告警」是因为参数生效）"
          fi
          echo "✓ regctl 路径下 --platforms 无告警且确实生效"

          # --skip-existing 的门禁与 --platforms 相反：索引会被 regctl 重建，digest
          # 必然不同，拿 digest 做的增量跳过在这条路径上没有意义
          out="$(./scripts/sync.sh --src nginx:1.27 --dest r.example.com/x \
            --strip-attestation --skip-existing --dry-run 2>&1)"
          if [[ "$out" != *"--skip-existing 在 --strip-attestation 模式下不可用（索引会被重建，digest 必然不同），本次将忽略"* ]]; then
            printf '%s\n' "$out"
            fail "regctl 路径下 --skip-existing 应告警（含参数名与「本次将忽略」）"
          fi
          echo "✓ regctl 路径下 --skip-existing 有告警"

          # --tls-verify false 在 regctl 路径下映射为明文 HTTP。自签 HTTPS 仓库走这条
          # 路时的**唯一指路线索**：丢了它，使用者会去反复检查证书，而真正要改的是
          # ~/.regctl/config.json 里的 cacert。
          out="$(./scripts/sync.sh --src nginx:1.27 --dest r.example.com/x \
            --strip-attestation --tls-verify false --dry-run 2>&1)"
          if [[ "$out" != *"regctl 路径下 --tls-verify false 映射为明文 HTTP"* ]] \
            || [[ "$out" != *"~/.regctl/config.json 里为它配 cacert"* ]]; then
            printf '%s\n' "$out"
            fail "regctl 路径下 --tls-verify false 应告警并指向 cacert 配置"
          fi
          echo "✓ regctl 路径下 --tls-verify false 有告警且指向 cacert"

      - name: 验证重试参数的作用范围
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # regctl 路径下 --retries 到不了 regclient，必须告警而不是静默忽略。
          # 静默失效比直接报错更危险：使用者会以为自己控制住了重试次数，
          # 而这个错误认知要等到真正需要重试时才暴露。
          output="$(./scripts/sync.sh --src nginx:1.27 --dest r.example.com/x \
            --strip-attestation --platforms linux/amd64 \
            --retries 10 --retry-delay 5s --dry-run 2>&1)"

          if ! grep -q 'retries 10 在 regctl 路径下不生效' <<<"$output"; then
            echo "::error::regctl 路径下显式传入 --retries 时应给出告警"
            echo "$output"
            exit 1
          fi
          if ! grep -q 'retry-delay 5s 仅对 skopeo 生效' <<<"$output"; then
            echo "::error::regctl 路径下显式传入 --retry-delay 时应给出告警"
            echo "$output"
            exit 1
          fi
          echo "✓ regctl 路径下失效的参数有明确告警"

          # 未显式指定时不该打扰使用者——默认值不生效是预期内的，不值得每次都刷屏
          output="$(./scripts/sync.sh --src nginx:1.27 --dest r.example.com/x \
            --strip-attestation --platforms linux/amd64 --dry-run 2>&1)"
          if grep -q '不生效' <<<"$output"; then
            echo "::error::未显式传入 --retries / --retry-delay 时不应产生告警"
            echo "$output"
            exit 1
          fi
          echo "✓ 默认情况下不产生多余告警"

          # skopeo 路径下 --retry-delay 必须真的进入命令
          output="$(./scripts/sync.sh --src nginx:1.27 --dest r.example.com/x \
            --retry-delay 10s --dry-run 2>&1)"
          if ! grep -q -- '--retry-delay 10s' <<<"$output"; then
            echo "::error::--retry-delay 未传递给 skopeo"
            echo "$output"
            exit 1
          fi
          echo "✓ --retry-delay 正确传递给 skopeo"

      - name: 验证 history.sh 能从报告中聚合趋势
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 夹具是**手写**的 JSON，不是 sync.sh --dry-run 的产物。
          # 本步要断言的是「history.sh 能聚合多份报告」——与报告是不是干跑产出的
          # 无关；继续拿 dry-run 报告当夹具，会让这条测试的成立与否取决于
          # dry-run 的语义（它是会变的，v1.16.0 就改过一次），而不是聚合本身。
          # 与「--check 聚合检查报告趋势」那几条测试同法。
          work="$(mktemp -d)"
          mkdir -p "${work}/run1" "${work}/run2"

          cat > "${work}/run1/sync-report.json" <<'JSON'
          {"generated_at": "2026-09-01T01:00:00Z", "dry_run": false,
           "dest_registry": "r.example.com/x", "strip_attestation": false,
           "total": 2, "success": 2, "skipped": 0, "failed": 0, "excluded": 0,
           "filter": "", "exclude": "",
           "rerun": {"images": [], "filter": "", "not_rerunnable": 0},
           "images": [
            {"source": "nginx:1.27", "dest": "r.example.com/x/nginx:1.27", "status": "success",
             "platforms": "linux/amd64", "source_digest": "sha256:aaa", "dest_digest": "sha256:aaa",
             "seconds": 3, "note": ""},
            {"source": "redis:7.4", "dest": "r.example.com/x/redis:7.4", "status": "success",
             "platforms": "linux/amd64", "source_digest": "sha256:bbb", "dest_digest": "sha256:bbb",
             "seconds": 5, "note": ""}
           ]}
          JSON

          cat > "${work}/run2/sync-report.json" <<'JSON'
          {"generated_at": "2026-09-02T01:00:00Z", "dry_run": false,
           "dest_registry": "r.example.com/x", "strip_attestation": false,
           "total": 2, "success": 1, "skipped": 0, "failed": 1, "excluded": 0,
           "filter": "", "exclude": "",
           "rerun": {"images": ["https://bad.example.com/x:1"], "filter": "", "not_rerunnable": 0},
           "images": [
            {"source": "nginx:1.27", "dest": "r.example.com/x/nginx:1.27", "status": "success",
             "platforms": "linux/amd64", "source_digest": "sha256:aaa", "dest_digest": "sha256:aaa",
             "seconds": 2, "note": ""},
            {"source": "https://bad.example.com/x:1", "dest": "r.example.com/x/x:1", "status": "failed",
             "platforms": "", "source_digest": "", "dest_digest": "",
             "seconds": 1, "note": "镜像引用格式错误"}
           ]}
          JSON

          set +e
          out="$(./scripts/history.sh --dir "$work" 2>/dev/null)"
          code=$?
          set -e

          echo "$out"

          # 两份报告都进了聚合——「能从多份报告中聚合」是本步的原目的
          if ! grep -qF '共 **2** 次运行' <<<"$out"; then
            echo "::error::history.sh 未把两份报告都纳入聚合"
            exit 1
          fi

          # 累计应为 4 个镜像次（2 + 2），且成功/失败的拆分正确
          if ! grep -qF '累计同步 **4** 个镜像次：成功 3 ｜ 跳过 0 ｜ 失败 1' <<<"$out"; then
            echo "::error::history.sh 的累计统计不正确"
            exit 1
          fi

          # 失败过的镜像必须出现在表里——聚合的意义正在于此
          if ! grep -qF 'bad.example.com' <<<"$out"; then
            echo "::error::history.sh 未列出失败过的镜像"
            exit 1
          fi

          # 历史中有失败即以退出码 2 结束，便于在脚本或 CI 里据此判断
          if [[ "$code" -ne 2 ]]; then
            echo "::error::历史中有失败时应以退出码 2 结束，实际 ${code}"
            exit 1
          fi
          echo "✓ 汇总与退出码正确"

          # 单镜像查询
          out="$(./scripts/history.sh --dir "$work" --image nginx:1.27 2>/dev/null || true)"
          if ! grep -q 'nginx:1.27' <<<"$out"; then
            echo "::error::--image 查询未返回结果"
            exit 1
          fi

          # 查询一个不存在的镜像应给出提示，而不是空表
          out="$(./scripts/history.sh --dir "$work" --image no-such:1.0 2>/dev/null || true)"
          if ! grep -q '没有找到镜像' <<<"$out"; then
            echo "::error::--image 查不到时应给出明确提示"
            exit 1
          fi
          echo "✓ 查询模式正确"

      - name: 验证 history.sh --check 聚合检查报告趋势
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          work="$(mktemp -d)"

          # 伪造检查报告 fixture：聚合逻辑是纯函数（jq + bash），给它合法输入
          # 断言输出即可；报告本身的落盘真实性由上面的「检查模式的报告落盘」
          # 步骤负责。混放 sync / check-updates 报告，验证按顶层 .check 字段过滤。
          cat > "${work}/audit-1.json" <<'JSON'
          {"generated_at": "2026-09-01T02:00:00Z", "check": "audit", "summary": {}, "records": [
            {"source": "docker.io/library/nginx:1.27", "dest": "r.example.com/nginx:1.27", "state": "stale", "note": ""},
            {"source": "registry.k8s.io/pause:3.9", "dest": "r.example.com/pause:3.9", "state": "current", "note": ""},
            {"source": "quay.io/flux/source-controller", "dest": "r.example.com/flux:1.0", "state": "missing", "note": ""}
          ]}
          JSON
          cat > "${work}/audit-2.json" <<'JSON'
          {"generated_at": "2026-09-05T02:00:00Z", "check": "audit", "summary": {}, "records": [
            {"source": "docker.io/library/nginx:1.27", "dest": "r.example.com/nginx:1.27", "state": "stale", "note": ""},
            {"source": "registry.k8s.io/pause:3.9", "dest": "r.example.com/pause:3.9", "state": "current", "note": ""},
            {"source": "quay.io/flux/source-controller", "dest": "r.example.com/flux:1.0", "state": "missing", "note": ""}
          ]}
          JSON
          cat > "${work}/lock-1.json" <<'JSON'
          {"generated_at": "2026-09-02T02:00:00Z", "check": "lock-audit", "summary": {}, "records": [
            {"entry": "registry.k8s.io/pause:3.9@sha256:013b", "state": "match", "note": ""},
            {"entry": "docker.io/library/nginx:1.27@sha256:dddd", "state": "drift", "note": "上游已变更"},
            {"entry": "docker.io/library/redis:7", "state": "nodigest", "note": "未锁定 digest"}
          ]}
          JSON
          # 干扰文件：同步报告（无 check 字段）与 check-updates 报告（不参与趋势）
          cat > "${work}/sync-report.json" <<'JSON'
          {"generated_at": "2026-09-03T02:00:00Z", "total": 1, "success": 1, "skipped": 0, "failed": 0, "excluded": 0,
           "images": [{"source": "docker.io/library/nginx:1.27", "dest": "r.example.com/nginx:1.27", "status": "success", "seconds": 3}]}
          JSON
          cat > "${work}/check-updates-report.json" <<'JSON'
          {"generated_at": "2026-09-04T02:00:00Z", "check": "check-updates", "summary": {}, "records": [
            {"repo": "docker.io/library/nginx:1.27", "in_manifest": "1", "state": "covered", "latest_tags": "", "note": ""}
          ]}
          JSON

          echo "=== audit 趋势 ==="
          set +e
          out="$(./scripts/history.sh --check audit --dir "$work" 2>/dev/null)"
          code=$?
          set -e
          echo "$out"

          # 累计应为 6 条（2 份报告 × 3 条）——同步与 check-updates 的干扰文件被过滤
          if ! grep -q '累计 \*\*6\*\* 条记录' <<<"$out"; then
            echo "::error::--check audit 的累计统计不正确（混放过滤可能失效）"
            exit 1
          fi

          # 一直落后的镜像在表中，且「最近一次」图标正确
          if ! grep -q 'docker.io/library/nginx:1.27.*⚠️' <<<"$out"; then
            echo "::error::--check audit 未列出一直落后的镜像"
            exit 1
          fi
          # 一直缺失的镜像在表中（✗ 图标行，而非只匹配表头文字）
          if ! grep -q 'quay.io/flux/source-controller.*✗' <<<"$out"; then
            echo "::error::--check audit 未列出一直缺失的镜像"
            exit 1
          fi
          # 全最新的镜像不该占榜单
          if grep -q '^| .*registry.k8s.io/pause' <<<"$out"; then
            echo "::error::--check audit 的榜单不应包含全最新的镜像"
            exit 1
          fi

          # 历史中有确定异常（落后/缺失）即退出码 2
          if [[ "$code" -ne 2 ]]; then
            echo "::error::存在落后/缺失时应以退出码 2 结束，实际 ${code}"
            exit 1
          fi

          echo "=== lock-audit 趋势 ==="
          set +e
          out="$(./scripts/history.sh --check lock-audit --dir "$work" 2>/dev/null)"
          code=$?
          set -e
          echo "$out"

          if ! grep -q 'docker.io/library/nginx:1.27@sha256:dddd.*⚠️' <<<"$out"; then
            echo "::error::--check lock-audit 未列出一直在漂移的条目"
            exit 1
          fi
          # 未锁定 digest 的条目不进表但要有统计行——悄悄吞掉等于假装锁文件很干净
          if grep -q '^| .*docker.io/library/redis:7' <<<"$out"; then
            echo "::error::未锁定 digest 的条目不应出现在趋势表中"
            exit 1
          fi
          if ! grep -q '不参与趋势' <<<"$out"; then
            echo "::error::--check lock-audit 缺少不参与校验条目的统计行"
            exit 1
          fi
          if [[ "$code" -ne 2 ]]; then
            echo "::error::存在漂移时应以退出码 2 结束，实际 ${code}"
            exit 1
          fi

          echo "=== 空态与参数校验 ==="
          # 全最新的窗口：退出码 0
          clean="$(mktemp -d)"
          cat > "${clean}/audit-1.json" <<'JSON'
          {"generated_at": "2026-09-01T02:00:00Z", "check": "audit", "summary": {}, "records": [
            {"source": "docker.io/library/nginx:1.27", "dest": "r.example.com/nginx:1.27", "state": "current", "note": ""}
          ]}
          JSON
          set +e
          ./scripts/history.sh --check audit --dir "$clean" >/dev/null 2>&1
          code=$?
          set -e
          if [[ "$code" -ne 0 ]]; then
            echo "::error::窗口内全最新时应以退出码 0 结束，实际 ${code}"
            exit 1
          fi

          # 无法判定不触发退出码 2（查不成不等于出问题）
          unk="$(mktemp -d)"
          cat > "${unk}/audit-1.json" <<'JSON'
          {"generated_at": "2026-09-01T02:00:00Z", "check": "audit", "summary": {}, "records": [
            {"source": "quay.io/private/app:1.0", "dest": "r.example.com/app:1.0", "state": "unknown", "note": "上游无法访问"}
          ]}
          JSON
          set +e
          ./scripts/history.sh --check audit --dir "$unk" >/dev/null 2>&1
          code=$?
          set -e
          if [[ "$code" -ne 0 ]]; then
            echo "::error::仅存在无法判定时不应触发退出码 2，实际 ${code}"
            exit 1
          fi

          # check-updates 明确不支持
          set +e
          msg="$(./scripts/history.sh --check check-updates --dir "$work" 2>&1)"
          code=$?
          set -e
          if [[ "$code" -ne 1 ]] || ! grep -q '不支持 check-updates' <<<"$msg"; then
            echo "::error::--check check-updates 应报参数错误退出 1"
            exit 1
          fi

          # 无匹配报告
          set +e
          ./scripts/history.sh --check audit --dir "$unk/no-such-sub" >/dev/null 2>&1
          code=$?
          set -e
          if [[ "$code" -ne 1 ]]; then
            echo "::error::目录不存在时应报错退出 1，实际 ${code}"
            exit 1
          fi

          # --image 查不到时给出明确提示
          out="$(./scripts/history.sh --check audit --dir "$work" --image no-such:1.0 2>/dev/null || true)"
          if ! grep -q '没有找到源镜像' <<<"$out"; then
            echo "::error::--check 模式 --image 查不到时应给出明确提示"
            exit 1
          fi
          echo "✓ 检查报告趋势正确"

      - name: 验证 history.sh --report-dir 落盘趋势结果
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          work="$(mktemp -d)"

          cat > "${work}/audit-1.json" <<'JSON'
          {"generated_at": "2026-09-01T02:00:00Z", "check": "audit", "summary": {}, "records": [
            {"source": "docker.io/library/nginx:1.27", "dest": "r.example.com/nginx:1.27", "state": "stale", "note": ""},
            {"source": "registry.k8s.io/pause:3.9", "dest": "r.example.com/pause:3.9", "state": "current", "note": ""}
          ]}
          JSON

          out_dir="${work}/out"
          # history.sh 退出码 2 = 窗口内有需要处理的记录，是预期结果——
          # 不关掉 errexit 会在这一步中断、吞掉全部输出
          set +e
          ./scripts/history.sh --check audit --dir "$work" --report-dir "$out_dir" \
            > "${work}/stdout.md" 2>/dev/null
          set -e

          # md 与 stdout 同源——两处各自漂移就失去了「同一份结果」的意义。
          # 用文件对比而不是命令替换：后者会剥掉结尾换行，空行差异是假阳性
          if ! diff "${work}/stdout.md" "${out_dir}/audit-trend-report.md" >/dev/null; then
            echo "::error::趋势 md 与 stdout 不同源"
            exit 1
          fi

          # json 顶层四字段 + 数据一致性（summary/rows 来自与渲染相同的聚合函数）
          jq -e '
            .generated_at != null and
            .query.mode == "audit" and
            (.summary.stale == 1) and (.summary.current == 1) and
            (.rows | length == 2)
          ' "${out_dir}/audit-trend-report.json" >/dev/null
          echo "✓ 趋势落盘正确（md 同源、json 字段与数据一致）"

      - name: 验证坏掉的历史报告被可见地跳过
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # artifact 保留期（默认 30 天）内仍躺着 v1.15.0 之前产出的坏 JSON。
          # 两条消费路径原来各自「整体崩掉」或「静默丢弃」——一份坏文件既不该
          # 让全部趋势失效，也不该让连续失败次数悄悄少算（该响的告警不响）。
          work="$(mktemp -d)"
          mkdir -p "${work}/good" "${work}/bad"

          cat > "${work}/good/sync-report.json" <<'JSON'
          {"generated_at": "2026-09-01T00:00:00Z", "total": 2, "success": 2, "skipped": 0, "failed": 0,
           "images": [
            {"source": "a.example.com/x:1", "dest": "d/x", "status": "success", "seconds": 1},
            {"source": "b.example.com/y:1", "dest": "d/y", "status": "success", "seconds": 2}
           ]}
          JSON
          # 坏报告：模拟 v1.15.0 之前产出的那种（镜像名含引号，裸 printf 拼接的产物）
          printf '{\n "generated_at": "2026-09-02T00:00:00Z",\n "total": 1, "success": 0, "skipped": 0, "failed": 1,\n "images": [\n  {"source": "a"b:1", "dest": "d", "status": "failed", "seconds": 1}\n ]\n}\n' \
            > "${work}/bad/sync-report.json"
          # 合法 JSON 但不是对象（误放进 --dir 的其它 JSON）：既不是报告，也不该
          # 让聚合在渲染时炸掉——它此前能过「是不是合法 JSON」这一关
          printf '[1, 2]\n' > "${work}/stray.json"
          # 这两个是同一类里最阴的两种，各有一条 jq 语义在背后：
          #   `null`  —— `null.foo` 在 jq 里是 **null 而不是错误**，所以判据若只写
          #              `.dry_run`，它会走到 else 被当成真实报告，把运行次数算多一次
          #  空文件   —— jq 对它**不产出任何值、退出码为 0**，没有 `-e` 时同样被误收
          # 两者都是「不报错但也不是报告」，靠断言「运行次数只算真正的那一份」抓住
          printf 'null\n' > "${work}/null.json"
          : > "${work}/empty.json"

          echo "=== 一份好 + 一份坏 ==="
          set +e
          out="$(./scripts/history.sh --dir "$work" 2>&1)"
          code=$?
          set -e
          echo "$out"

          # 结果数字只来自好的那份——坏文件既不整体作废，也不凑合算
          if ! grep -qF '累计同步 **2** 个镜像次' <<<"$out"; then
            echo "::error::坏报告影响了正常报告的分析结果"
            exit 1
          fi
          # 跳过必须可见，且能定位到具体文件
          if ! grep -qF "${work}/bad/sync-report.json" <<<"$out"; then
            echo "::error::坏报告被跳过却没有指明是哪个文件"
            exit 1
          fi
          # 合法 JSON 但不是对象的文件同样被跳过并指明（它此前会一路走到聚合里，
          # 让 jq 报错并把它的退出码泄漏成脚本的退出码）
          if ! grep -qF "${work}/stray.json" <<<"$out"; then
            echo "::error::非对象的 JSON 文件未被可见地跳过"
            exit 1
          fi
          for stray in "${work}/null.json" "${work}/empty.json"; do
            if ! grep -qF "$stray" <<<"$out"; then
              echo "::error::${stray} 未被可见地跳过"
              exit 1
            fi
          done
          # 运行次数只算真正的那一份。这一条是上面那几个「不是报告」的文件的
          # **后果**断言：它们不只该被告知跳过，更不该被算进趋势——`null` 曾
          # 让这里显示 `共 2 次运行`，时间范围里还多一个 `—`
          if ! grep -qF '共 **1** 次运行' <<<"$out"; then
            echo "::error::非对象 / 空 JSON 文件被算成了运行次数（趋势虚高）"
            exit 1
          fi
          if grep -qF 'jq:' <<<"$out"; then
            echo "::error::不应把 jq 自己的报错抛给使用者"
            exit 1
          fi
          # 坏文件属「无法判定」，不触发退出码 2——网络抖动和匿名访问不该让
          # 退出码失去「需要处理」的含义（见 history.sh 里趋势退出码处的注释）
          if [[ "$code" -ne 0 ]]; then
            echo "::error::坏报告不应触发非 0 退出码，实际 ${code}"
            exit 1
          fi
          echo "✓ 坏报告被可见地跳过，退出码语义不变"

          echo "=== 全部坏 ==="
          set +e
          out="$(./scripts/history.sh --dir "${work}/bad" 2>&1)"
          set -e
          echo "$out"

          if ! grep -qF '没有一份能解析' <<<"$out"; then
            echo "::error::全部坏时应说明「没有一份能解析」"
            exit 1
          fi
          if ! grep -qF "${work}/bad/sync-report.json" <<<"$out"; then
            echo "::error::全部坏时应指出首个无法解析的文件"
            exit 1
          fi
          # 裸的 jq parse error 不再直接抛给使用者
          if grep -qF 'jq: parse error' <<<"$out"; then
            echo "::error::不应把 jq 的 parse error 直接抛给使用者"
            exit 1
          fi
          echo "✓ 全部坏时给出可定位的明确报错"

          echo "=== --check：两种跳过原因可分 ==="
          check_dir="$(mktemp -d)"
          cat > "${check_dir}/audit-1.json" <<'JSON'
          {"generated_at": "2026-09-01T02:00:00Z", "check": "audit", "summary": {}, "records": [
            {"source": "docker.io/library/nginx:1.27", "dest": "r.example.com/nginx:1.27", "state": "current", "note": ""}
          ]}
          JSON
          cat > "${check_dir}/sync-report.json" <<'JSON'
          {"generated_at": "2026-09-03T02:00:00Z", "total": 0, "success": 0, "skipped": 0, "failed": 0, "images": []}
          JSON
          cp "${work}/bad/sync-report.json" "${check_dir}/broken.json"

          set +e
          out="$(./scripts/history.sh --check audit --dir "$check_dir" 2>&1)"
          set -e
          echo "$out"

          # 「无法解析」与「类型不匹配」必须各有各的说法——否则使用者不知道
          # 该删文件还是该换 --check
          if ! grep -qF '跳过 1 份无法解析的报告' <<<"$out"; then
            echo "::error::--check 下坏报告未被明确告警（预检必须先于 filter）"
            exit 1
          fi
          if ! grep -qF '跳过非 audit 的报告' <<<"$out"; then
            echo "::error::类型不匹配的跳过原因未区分"
            exit 1
          fi
          if ! grep -qF 'broken.json' <<<"$out"; then
            echo "::error::--check 下的告警未指出坏文件"
            exit 1
          fi
          echo "✓ 两种跳过原因可分"

          echo "=== fetch_sync_history：坏报告不再静默 ==="
          # 与「报告下载失败的分类判定」同思路：坏文件的组合只能 mock。
          # 生产函数整段抽出，只补它引用的全局与日志函数——它必须自包含
          {
            sed -n '/^readonly FIELD_SEP=/p' scripts/sync.sh
            sed -n '/^fetch_sync_history()/,/^}/p' scripts/sync.sh
            sed -n '/^count_consecutive_failures()/,/^}/p' scripts/sync.sh
          } > /tmp/fetch-sync-history-fn.sh

          cat > /tmp/test-fetch-history.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          source /tmp/fetch-sync-history-fn.sh

          HISTORY_ARTIFACT="sync-report"
          log_warn() { printf 'WARN: %s\n' "$*" >&2; }

          fix="$(mktemp -d)"
          cat > "${fix}/good.json" <<'JSON'
          {"generated_at": "2026-09-01T00:00:00Z", "total": 1, "success": 0, "skipped": 0, "failed": 1,
           "images": [{"source": "a.example.com/x:1", "dest": "d", "status": "failed", "seconds": 1}]}
          JSON
          # 合法但没有 images 字段（检查报告混放同一 artifact）：最容易误判的一种
          cat > "${fix}/check.json" <<'JSON'
          {"generated_at": "2026-09-02T00:00:00Z", "check": "audit", "records": []}
          JSON
          printf '{\n "generated_at": "2026-09-03T00:00:00Z",\n "total": 1, "success": 0, "skipped": 0, "failed": 1,\n "images": [\n  {"source": "a"b:1", "dest": "d", "status": "failed", "seconds": 1}\n ]\n}\n' \
            > "${fix}/broken.json"
          # 干跑的报告：镜像都在，但一条命令都没真的执行，status 却是 success
          cat > "${fix}/dry.json" <<'JSON'
          {"generated_at": "2026-09-04T00:00:00Z", "dry_run": true, "total": 1, "success": 1, "skipped": 0, "failed": 0,
           "images": [{"source": "dryonly.example.com/z:1", "dest": "d/z:1", "status": "success", "seconds": 0}]}
          JSON

          # mock 从 $src_dir 取文件，好让下面换个目录再跑一次（不用改 mock 本身）
          src_dir="$fix"
          gh() {
            if [[ "$1" == "run" && "$2" == "list" ]]; then
              printf '111\n'
              return 0
            fi
            if [[ "$1" == "run" && "$2" == "download" ]]; then
              local dir=""
              while [[ $# -gt 0 ]]; do
                [[ "$1" == "-D" ]] && dir="$2"
                shift
              done
              mkdir -p "$dir"
              cp "${src_dir}"/*.json "$dir/"
              return 0
            fi
            return 127
          }

          out_file="$(mktemp)"
          warn_file="$(mktemp)"
          fetch_sync_history "$out_file" 2> "$warn_file"

          cat "$warn_file" >&2
          # 好报告的记录照常展开，且只有它产出了记录
          grep -qF 'a.example.com/x:1' "$out_file" || { echo "FAIL: 好报告的记录未被提取"; exit 1; }
          [[ "$(wc -l < "$out_file" | tr -d ' ')" == "1" ]] || { echo "FAIL: 记录数不正确"; exit 1; }
          # 坏报告必须告警、能定位、并说清后果（「跳过 1 份」是事实，
          # 「判断可能偏小」才是使用者需要据此调整的信息）
          grep -qF '无法解析' "$warn_file" || { echo "FAIL: 坏报告无告警（仍是静默丢弃）"; exit 1; }
          grep -qF 'broken.json' "$warn_file" || { echo "FAIL: 告警未指出文件"; exit 1; }
          grep -qF '连续失败次数的判断可能偏小' "$warn_file" || { echo "FAIL: 告警未说清后果"; exit 1; }
          # 合法但无 images 的报告是正常的，不该被计为坏
          if grep -qF 'check.json' "$warn_file"; then
            echo "FAIL: 合法但无 images 的报告被误判为坏"
            exit 1
          fi
          # 干跑的报告不进历史：它是「计划」不是「已发生的事」，混进来会把
          # 连续失败计数清零（那正是这条提取路径存在的意义）。
          # 只断言「没提取到」不够——它还必须**不被当成坏报告**，否则使用者会
          # 收到一句误导的告警，以为该去删文件
          if grep -qF 'dryonly.example.com' "$out_file"; then
            echo "FAIL: 干跑的报告被提取进了历史（连续失败计数会被它清零）"
            exit 1
          fi
          if grep -qF 'dry.json' "$warn_file"; then
            echo "FAIL: 干跑的报告被误判为坏报告"
            exit 1
          fi
          # 坏报告与干跑报告都不产出记录，而缺 dry_run 字段的旧报告照常产出
          # （good.json 里没有该字段：升级不该让历史数据失效）
          [[ "$(wc -l < "$out_file" | tr -d ' ')" == "1" ]] || { echo "FAIL: 记录数不正确"; exit 1; }

          # ---- 后果：连续失败计数不被一次干跑清零 ----
          # count_consecutive_failures 从最新往回数，遇到任何非 failed 记录即清零，
          # 所以干跑那份 success 足够压掉一个真实存在了 3 次的失败序列本该触发的
          # 告警。这里断言的是**后果**本身，而不是「记录里没有它」——后者只是手段。
          fix2="$(mktemp -d)"
          for i in 1 2 3; do
            cat > "${fix2}/fail${i}.json" <<JSON
          {"generated_at": "2026-09-0${i}T00:00:00Z", "total": 1, "success": 0, "skipped": 0, "failed": 1,
           "images": [{"source": "a.example.com/x:1", "dest": "d", "status": "failed", "seconds": 1}]}
          JSON
          done
          cat > "${fix2}/dry.json" <<'JSON'
          {"generated_at": "2026-09-04T00:00:00Z", "dry_run": true, "total": 1, "success": 1, "skipped": 0, "failed": 0,
           "images": [{"source": "a.example.com/x:1", "dest": "d", "status": "success", "seconds": 0}]}
          JSON

          src_dir="$fix2"
          out2="$(mktemp)"
          fetch_sync_history "$out2" 2>/dev/null
          consecutive="$(count_consecutive_failures 'a.example.com/x:1' "$out2")"
          if [[ "$consecutive" != "3" ]]; then
            echo "FAIL: 连续失败次数应为 3（一次干跑不该清零真实存在过的失败序列），实际 ${consecutive}"
            exit 1
          fi
          echo "MOCK-OK"
          SCRIPT
          bash /tmp/test-fetch-history.sh | grep -qF 'MOCK-OK' || {
            echo "::error::fetch_sync_history 的坏报告处理不符合预期"
            exit 1
          }
          echo "✓ fetch_sync_history 坏报告可见地跳过并说明后果"

      - name: 验证耗时排行
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          work="$(mktemp -d)"

          # 构造两份报告：c 镜像一次很快、一次超时（600s），a 镜像稳定地慢。
          # 期望 --slowest 按**平均**排序把 c 排第一，同时波动范围能暴露出
          # 它是「偶尔慢」而不是「一直慢」——这正是排行存在的意义。
          for d in r1 r2; do mkdir -p "${work}/${d}"; done
          cat > "${work}/r1/sync-report.json" <<'JSON'
          {"generated_at": "2026-09-11T01:00:00Z", "total": 3, "success": 3, "skipped": 0, "failed": 0,
           "images": [
            {"source": "big.example.com/a:1", "dest": "d/a", "status": "success", "seconds": 100},
            {"source": "mid.example.com/b:1", "dest": "d/b", "status": "success", "seconds": 30},
            {"source": "flaky.example.com/c:1", "dest": "d/c", "status": "success", "seconds": 5}
           ]}
          JSON
          cat > "${work}/r2/sync-report.json" <<'JSON'
          {"generated_at": "2026-09-11T02:00:00Z", "total": 3, "success": 2, "skipped": 0, "failed": 1,
           "images": [
            {"source": "big.example.com/a:1", "dest": "d/a", "status": "success", "seconds": 200},
            {"source": "mid.example.com/b:1", "dest": "d/b", "status": "success", "seconds": 26},
            {"source": "flaky.example.com/c:1", "dest": "d/c", "status": "failed", "seconds": 600}
           ]}
          JSON

          out="$(./scripts/history.sh --dir "$work" --slowest 5 2>/dev/null || true)"
          echo "$out"

          # c 的平均 (5+600)/2=302.5 应排在 a 的平均 150 之前
          if [[ "$(grep -n 'flaky.example.com' <<<"$out" | head -1 | cut -d: -f1)" -gt \
                "$(grep -n 'big.example.com' <<<"$out" | head -1 | cut -d: -f1)" ]]; then
            echo "::error::--slowest 未按平均耗时降序排列"
            exit 1
          fi
          grep -q '302.5s' <<<"$out" || { echo "::error::平均耗时计算不正确"; exit 1; }
          grep -q '5s ~ 600s' <<<"$out" || { echo "::error::波动范围不正确"; exit 1; }
          echo "✓ --slowest 按平均排序，波动范围正确"

          # sync.sh 一侧：dry-run 下秒数全为 0，排行应自觉隐去——
          # 全是 0s 的榜单没有信息量，只会占地方
          #
          # 注意：这一条本身**证明不了** dry-run 的耗时为 0——不带 mock date 时
          # 打印一行只要微秒，秒数本来就会是 0。确定性的那条在「验证 dry-run
          # 不留做过的痕迹」步骤里（用 mock date 强制跨秒）。
          rm -rf /tmp/rank && mkdir -p /tmp/rank
          ./scripts/sync.sh --src "nginx:1.27,redis:7.4,alpine:3.20" --dest r.example.com/x \
            --dry-run --report-dir /tmp/rank >/dev/null 2>&1
          if grep -q '最慢的同步记录' /tmp/rank/sync-report.md; then
            echo "::error::耗时全为 0 时不应输出排行"
            exit 1
          fi
          echo "✓ 无有效耗时数据时排行自动隐去"

      - name: 验证 dry-run 不留做过的痕迹
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # dry-run 没有真的搬过任何东西，所以任何描述「搬了什么、花了多久、
          # 搬完了」的输出都必须是空或零：耗时为 0、不写锁文件、不发通知、
          # 不记录目标 digest。判据是「有没有真的搬过」，不是「这段代码跑了多久」。
          #
          # 四个落点都在这里用 mock 造出**确定性**：不带 mock 的话，其中三个
          # （耗时、目标 digest、通知）在「改动前」也几乎总是绿的，断言就只是摆设。
          fail() { echo "::error::$1"; exit 1; }

          # ---- ① 耗时如实为 0 ----
          # 计时区包住的是 sync_to_dest，而 dry-run 下它只打印一行命令就返回——
          # 测到的是「打印一行花了多久」。微秒级够快，只有在负载高的 runner 上
          # 才会跨过 1 秒边界，表现为偶发 flaky（2026-09-19 在 #103 的 PR 上
          # 把整个 smoke-test job 带崩过一次，重跑即绿）。mock date 让跨秒必然
          # 发生，这条断言才有确定性。
          mock_bin="$(mktemp -d)"
          cat > "${mock_bin}/date" <<'MOCK'
          #!/usr/bin/env bash
          if [[ "$1" == "+%s" ]]; then
            n="$(cat /tmp/dry-mock-counter 2>/dev/null || echo 100)"
            n=$((n + 1)); printf '%s\n' "$n" > /tmp/dry-mock-counter; printf '%s\n' "$n"
          else
            exec /bin/date "$@"
          fi
          MOCK
          chmod +x "${mock_bin}/date"
          rm -f /tmp/dry-mock-counter

          dry_dir="$(mktemp -d)"
          # 三个镜像是必要的：duration_ranking_rows 要求 >= 3 条记录才输出榜单
          PATH="${mock_bin}:$PATH" ./scripts/sync.sh \
            --src 'nginx:1.27,redis:7.2,alpine:3.20' --dest r.example.com/x \
            --dry-run --report-dir "$dry_dir" >/dev/null 2>&1

          # 用 all(...) 逐个判：`jq -e '.images[].seconds == 0'` 的退出码只看
          # **最后一个**输出值，末条为 0 时首条非 0 也照样返回 0
          if ! jq -e 'all(.images[]; .seconds == 0)' "${dry_dir}/sync-report.json" >/dev/null; then
            jq -r '.images[].seconds' "${dry_dir}/sync-report.json"
            fail "dry-run 的 seconds 应恒为 0（非 0 说明仍在按「这段代码跑了多久」计时）"
          fi
          if grep -qF '最慢的同步记录' "${dry_dir}/sync-report.md"; then
            fail "dry-run 秒数全为 0，不应输出耗时排行"
          fi
          echo "✓ dry-run 耗时如实为 0，排行随之隐去"

          # ---- ② 通知：先证明假 webhook 是活的，再证明 dry-run 不碰它 ----
          # 不做正向对照的话，「捕获文件不存在」也可能只是因为服务没起来——
          # 断言会变成恒真。
          cat > /tmp/dry-hook.py <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer


          class H(BaseHTTPRequestHandler):
              def do_POST(self):
                  n = int(self.headers.get('Content-Length', 0))
                  with open('/tmp/dry-hook-payload.json', 'wb') as f:
                      f.write(self.rfile.read(n))
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b'ok')

              def log_message(self, *a):
                  pass


          HTTPServer(('127.0.0.1', 8899), H).serve_forever()
          PY
          rm -f /tmp/dry-hook-payload.json
          python3 /tmp/dry-hook.py &
          hook_pid=$!
          trap 'kill "$hook_pid" 2>/dev/null || true' EXIT
          sleep 2

          set +e
          # 非法引用（缺 tag）必定失败，不需要 registry 与网络；不带 --dry-run
          # 才会发通知，这正是要证明的对照面
          ./scripts/sync.sh --src 'nginx' --dest registry.example.com/smoke \
            --notify-webhook http://127.0.0.1:8899/hook --notify-type generic >/dev/null 2>&1
          set -e
          if [[ ! -s /tmp/dry-hook-payload.json ]]; then
            fail "正向对照失败：真实运行（无 --dry-run）都没有发出通知，假 webhook 没起来"
          fi
          rm -f /tmp/dry-hook-payload.json

          # ---- ③ 锁文件与通知：dry-run 下都不该发生，且要有告警 ----
          # 锁文件头部写着「可直接用 --file 读取本文件实现精确复现」，通知正文
          # 写着「镜像同步完成……失败 N 个」——两者都在描述一次**没有发生**的同步。
          # 通知尤其严重：它是唯一主动推送给其他人的出口。
          lock_file="${dry_dir}/dry.lock"
          set +e
          dry_out="$(./scripts/sync.sh --src 'nginx:1.27' --dest r.example.com/x \
            --dry-run --write-lock "$lock_file" \
            --notify-webhook http://127.0.0.1:8899/hook --notify-type generic 2>&1)"
          set -e

          if [[ -f "$lock_file" ]]; then
            fail "dry-run 不应写出锁文件（它记录的是「这次推上去的是哪一份」）"
          fi
          if [[ -s /tmp/dry-hook-payload.json ]]; then
            fail "dry-run 不应发送通知（它通报的是「这次搬得怎么样」）"
          fi

          # 两个参数合并成**一条**告警、一次列全——与 --audit-lock 的处理方式一致，
          # 所以这里断言的是「同一行里同时出现两个参数名」，不是分别出现过
          grep -qF -- '本次不生效' <<<"$dry_out" || fail "dry-run 忽略 --write-lock / --notify-webhook 时未告警"
          merged=""
          while IFS= read -r line; do
            if [[ "$line" == *"--write-lock"* && "$line" == *"--notify-webhook"* ]]; then
              merged="$line"
            fi
          done <<<"$dry_out"
          if [[ -z "$merged" ]]; then
            printf '%s\n' "$dry_out"
            fail "两个不生效的参数应出现在同一条告警里（一次列全）"
          fi
          grep -qF -- '去掉 --dry-run' <<<"$merged" || fail "告警未说明怎么办（去掉 --dry-run）"
          echo "✓ dry-run 不写锁文件、不发通知，且一条告警列全两个参数"

          # ---- ④ 目标 digest 留空，源 digest 保留 ----
          # dry-run 查目标 digest 时，那个 tag 上若已有镜像（上一次真实同步留下的），
          # 查到的会是它，写进「目标 Digest」列会被读成本次同步的产物。
          # mock skopeo 让 inspect 必定成功——否则「为空」只是因为查不动，断言恒绿。
          mock_skopeo_bin="$(mktemp -d)"
          cat > "${mock_skopeo_bin}/skopeo" <<'MOCK'
          #!/usr/bin/env bash
          cmd="$1"; shift
          case "$cmd" in
            inspect)
              printf '%s' '{"schemaVersion":2,"mediaType":"application/vnd.oci.image.manifest.v1+json"}'
              exit 0 ;;
            *)
              exit 0 ;;
          esac
          MOCK
          chmod +x "${mock_skopeo_bin}/skopeo"

          digest_dir="$(mktemp -d)"
          PATH="${mock_skopeo_bin}:$PATH" ./scripts/sync.sh \
            --src 'nginx:1.27' --dest r.example.com/x \
            --dry-run --report-dir "$digest_dir" >/dev/null 2>&1

          # source_digest 是源镜像自身的属性，与本次是否推送无关，必须照常记录
          if [[ "$(jq -r '.images[0].source_digest' "${digest_dir}/sync-report.json")" != sha256:* ]]; then
            fail "dry-run 下 source_digest 应照常记录（它描述的是源镜像，不是本次产物）"
          fi
          if [[ -n "$(jq -r '.images[0].dest_digest' "${digest_dir}/sync-report.json")" ]]; then
            fail "dry-run 不应记录目标 digest（那是上一次同步留在该 tag 上的镜像）"
          fi
          echo "✓ dry-run 不记录目标 digest，源 digest 不受影响"

          # ---- ⑤ 干跑的报告不进历史聚合 ----
          # 报告里每条镜像都是 success（sync_to_dest 直接返回），但它描述的是
          # 「计划」而不是「已发生的事」。判据同样不是「这段代码跑了多久」，而是
          # 「有没有真的搬过」。混进趋势会让「累计同步 N 个镜像次」虚高；更严重的
          # 是清零连续失败计数——一次没搬过任何东西的干跑足以压掉一个真实存在过
          # 的失败序列本该触发的告警（另一条消费路径见 sync.sh 的 fetch_sync_history，
          # 由「验证坏掉的历史报告被可见地跳过」那一步的 mock 覆盖）。
          hist_work="$(mktemp -d)"
          # 用上面 ④ 造的干跑报告（3 个镜像），它是真的由 --dry-run 产出的
          mkdir -p "${hist_work}/dry"
          cp "${dry_dir}/sync-report.json" "${hist_work}/dry/"
          if [[ "$(jq -r '.dry_run' "${hist_work}/dry/sync-report.json")" != "true" ]]; then
            fail "报告里没有 dry_run=true，后面的断言会变成恒真"
          fi

          set +e
          only_dry="$(./scripts/history.sh --dir "${hist_work}/dry" 2>&1)"
          only_dry_code=$?
          set -e
          echo "$only_dry"

          # 没有可聚合的报告 → 退出码 1，与「目录里没有 JSON 报告」同口径
          if [[ "$only_dry_code" -ne 1 ]]; then
            fail "只有干跑报告时应以 1 退出（没有可聚合的报告），实际 ${only_dry_code}"
          fi
          # 跳过必须可见，且说清是哪种「空」
          grep -qF '跳过 1 份 --dry-run 产出的报告' <<<"$only_dry" \
            || fail "干跑报告被跳过却没有告知"
          grep -qF '1 份是 --dry-run 产出的' <<<"$only_dry" \
            || fail "「没有可聚合的报告」未说明原因是干跑"
          # 一次都没搬过，绝不能聚合出「成功 3 个镜像次」
          if grep -qF '累计同步' <<<"$only_dry"; then
            fail "干跑的报告被当成真实运行聚合了（它描述的是计划）"
          fi
          echo "✓ 只有干跑报告时不被聚合，且明确告知"

          # 兼容性回归 + 混放：旧报告（**没有** dry_run 字段）必须照常参与聚合。
          # 升级不该让历史数据失效，所以缺字段视为真实运行——两处都手写夹具，
          # 不依赖 sync.sh 当前的产出（将来的 dry-run 语义变化不该破这条测试）
          cat > "${hist_work}/legacy.json" <<'JSON'
          {"generated_at": "2026-09-01T00:00:00Z", "total": 2, "success": 2, "skipped": 0, "failed": 0,
           "images": [
            {"source": "legacy.example.com/a:1", "dest": "d/a:1", "status": "success", "seconds": 1},
            {"source": "legacy.example.com/b:1", "dest": "d/b:1", "status": "success", "seconds": 2}
           ]}
          JSON
          mkdir -p "${hist_work}/legacy-only" "${hist_work}/mixed"
          cp "${hist_work}/legacy.json" "${hist_work}/legacy-only/"
          cp "${hist_work}/legacy.json" "${hist_work}/mixed/"
          cp "${dry_dir}/sync-report.json" "${hist_work}/mixed/dry-run.json"

          set +e
          legacy_out="$(./scripts/history.sh --dir "${hist_work}/legacy-only" 2>&1)"
          legacy_code=$?
          mixed_out="$(./scripts/history.sh --dir "${hist_work}/mixed" 2>&1)"
          mixed_code=$?
          set -e
          echo "--- 只有旧报告 ---"; echo "$legacy_out"
          echo "--- 旧报告 + 干跑报告 ---"; echo "$mixed_out"

          if [[ "$legacy_code" -ne 0 ]]; then
            fail "旧报告（无 dry_run 字段）应照常聚合，实际退出码 ${legacy_code}"
          fi
          # 用 grep -qF 匹配固定字符串（裸 grep 按 BRE 解释，正则字面量会恒假）
          grep -qF '累计同步 **2** 个镜像次：成功 2 ｜ 跳过 0 ｜ 失败 0' <<<"$legacy_out" \
            || fail "旧报告（无 dry_run 字段）未被正常聚合——升级让历史数据失效了"
          if grep -qF -- '--dry-run' <<<"$legacy_out"; then
            fail "没有干跑报告时不该出现跳过干跑的提示"
          fi

          # 混放：只有真实的那份被聚合，结果与单独存放时**逐字一致**——把多出来的
          # 那句跳过提示去掉后，两份输出必须分毫不差（只看某一个数字的话，别的行
          # 悄悄变了也照样绿）
          if [[ "$mixed_code" -ne 0 ]]; then
            fail "混放时真实报告应照常聚合，实际退出码 ${mixed_code}"
          fi
          grep -qF '跳过 1 份 --dry-run 产出的报告' <<<"$mixed_out" \
            || fail "混放时未告知跳过了几份干跑报告"
          grep -qF '共 **1** 次运行' <<<"$mixed_out" \
            || fail "混放时干跑报告仍被算成一次运行"
          if ! diff <(printf '%s\n' "$legacy_out") \
                    <(printf '%s\n' "$mixed_out" | grep -v -- '--dry-run 产出的报告') >/dev/null; then
            fail "混放时的聚合结果与只有真实报告时不一致（干跑的影响没有完全排除）"
          fi
          echo "✓ 混放时只聚合真实报告，旧报告（无 dry_run 字段）兼容不变"

          echo "DRY-HONESTY-OK"

      - name: 验证重跑指引
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 重跑指引用「提取生产函数 + 伪造 R_* 输入」验证：稳定的同步失败
          # 需要网络与凭证，构造不出可重复的场景。
          # md_cell 是 write_report / emit_summary 渲染「说明」列的依赖，必须与
          # 它们一起抽取：漏掉时它未定义，note 会被静默填成 —（调用点的
          # `|| true` 抑制了 errexit，不会有任何报错）。
          for fn in ere_escape rerun_style collect_rerun_items render_rerun_section \
                    short_digest duration_ranking_rows md_cell write_report emit_summary; do
            sed -n "/^${fn}()/,/^}/p" scripts/sync.sh
          done > /tmp/rerun-fns.sh
          grep -q 'collect_rerun_items()' /tmp/rerun-fns.sh || { echo "::error::函数提取失败"; exit 1; }

          cat > /tmp/test-rerun-ci.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          source /tmp/rerun-fns.sh

          # mock 掉外部依赖，只留被测逻辑
          log_info() { :; }
          log_dim() { :; }
          log_warn() { :; }
          write_lockfile() { :; }
          send_notification() { :; }
          C_GREEN=""; C_RESET=""; C_DIM=""; C_RED=""; C_YELLOW=""

          fail() { echo "FAIL: $1"; exit 1; }

          setup() {
            DRY_RUN=false
            REPORT_DIR="$(mktemp -d)"
            REPORT_NAME="sync-report"
            DEST_EXACT="r.example.com/x"
            DEST_REGISTRIES=()
            STRIP_ATTESTATION=false
            FILTER_REGEX=""; EXCLUDE_REGEX=""; WRITE_LOCK=""; NOTIFY_WEBHOOK=""
            GITHUB_STEP_SUMMARY="$(mktemp)"
            R_SRC=('nginx:1.27' 'redis:7.2' 'bad::ref')
            R_DEST=('r/x/nginx:1.27' 'r/x/redis:7.2' '—')
            R_STATUS=('failed' 'success' 'failed')
            R_PLATFORM=('linux/amd64' 'linux/amd64' '—')
            R_SECONDS=('3' '2' '0')
            R_SRC_DIGEST=('sha256:aa' 'sha256:bb' '')
            R_DEST_DIGEST=('' 'sha256:bb' '')
            R_NOTE=('同步失败，详见上方日志' '' '镜像引用格式错误：仓库名不合法')
          }

          # --- 1. 转义与锚定的精确性（走真实 grep -E，与 --filter 同一条路径）---
          esc="$(ere_escape 'nginx:1.27')"
          [[ "$esc" == 'nginx:1\.27' ]] || fail "转义结果不对：$esc"
          re="^(docker://)?(${esc})$"
          printf '%s\n' 'nginx:1.27'           | grep -Eq -- "$re" || fail "应匹配原串"
          printf '%s\n' 'docker://nginx:1.27'  | grep -Eq -- "$re" || fail "应容忍 docker:// 前缀"
          if printf '%s\n' 'nginx:1.27-alpine' | grep -Eq -- "$re"; then
            fail "锚定失效：误命中了 nginx:1.27-alpine"
          fi

          # --- 2. Aliyuncs 形态：给清单 + 指引 images_src ---
          setup
          GITHUB_WORKFLOW_REF='o/r/.github/workflows/sync-images-aliyuncs.yml@refs/heads/main'
          emit_summary >/dev/null 2>&1 || true
          grep -q '重跑失败项' "$GITHUB_STEP_SUMMARY" || fail "Summary 缺少重跑节"
          grep -q 'images_src' "$GITHUB_STEP_SUMMARY" || fail "未指引 images_src"
          grep -q '另有 1 个因镜像引用格式错误' "$GITHUB_STEP_SUMMARY" || fail "缺少不可重跑计数句"

          # 重跑节里只能有失败项——断言只针对这一节：主表格本来就列全部镜像
          awk '/重跑失败项/{f=1} f' "$GITHUB_STEP_SUMMARY" > "${REPORT_DIR}/block.txt"
          grep -q 'nginx:1.27' "${REPORT_DIR}/block.txt" || fail "重跑节缺失败镜像"
          if grep -q 'redis:7.2' "${REPORT_DIR}/block.txt"; then fail "重跑节混入了成功项"; fi

          grep -q '重跑失败项' "${REPORT_DIR}/sync-report.md" || fail "md 报告缺少重跑节"

          # 说明列：失败项带出真实原因。这条同时守住 md_cell 的抽取依赖——
          # 它没被抽出来时函数调用失败，而调用点上方的 `|| true` 抑制了 errexit，
          # note 会被静默填成 —，报告看起来「正常」，原因却丢了。
          grep -qF '同步失败，详见上方日志' "${REPORT_DIR}/sync-report.md" \
            || fail "md 说明列未带出失败原因（md_cell 是否未被抽取？）"
          grep -qF '镜像引用格式错误：仓库名不合法' "${REPORT_DIR}/sync-report.md" \
            || fail "md 说明列未带出第二条失败原因"
          grep -qF '同步失败，详见上方日志' "$GITHUB_STEP_SUMMARY" \
            || fail "Summary 说明列未带出失败原因"

          # --- 3. json 字段与往返一致性 ---
          jq -e '.rerun' "${REPORT_DIR}/sync-report.json" >/dev/null || fail "json 缺 rerun 字段"
          [[ "$(jq -r '.rerun.images | join(",")' "${REPORT_DIR}/sync-report.json")" == "nginx:1.27" ]] \
            || fail "json images 不对"
          [[ "$(jq -r '.rerun.not_rerunnable' "${REPORT_DIR}/sync-report.json")" == "1" ]] \
            || fail "json not_rerunnable 不对"
          [[ "$(jq -r '.rerun.filter' "${REPORT_DIR}/sync-report.json")" == '^(docker://)?(nginx:1\.27)$' ]] \
            || fail "json filter 往返不一致（反斜杠转义有问题）"

          # --- 4. Batch 形态：给锚定正则 + 指引 filter ---
          setup
          GITHUB_WORKFLOW_REF='o/r/.github/workflows/sync-images-batch.yml@refs/heads/main'
          emit_summary >/dev/null 2>&1 || true
          # 用 -F：待断言的是正则字面量，裸 grep 会按 BRE 解释，永远匹配不上
          grep -qF '^(docker://)?(nginx:1\.27)$' "$GITHUB_STEP_SUMMARY" || fail "Batch 未给出锚定正则"

          # --- 5. 全绿时整节不出现 ---
          setup
          R_SRC=('nginx:1.27'); R_STATUS=('success'); R_NOTE=('')
          emit_summary >/dev/null 2>&1 || true
          if grep -q '重跑失败项' "$GITHUB_STEP_SUMMARY"; then fail "全绿时不应出现重跑节"; fi
          if grep -q '重跑失败项' "${REPORT_DIR}/sync-report.md"; then fail "全绿时 md 不应出现重跑节"; fi
          [[ "$(jq -r '.rerun.images | length' "${REPORT_DIR}/sync-report.json")" == "0" ]] \
            || fail "全绿时 json 应为零值"

          # --- 6. dry-run 不出现（没有真正推送过，谈不上重跑）---
          setup
          DRY_RUN=true
          R_SRC=('nginx:1.27'); R_STATUS=('failed'); R_NOTE=('同步失败')
          emit_summary >/dev/null 2>&1 || true
          if grep -q '重跑失败项' "$GITHUB_STEP_SUMMARY"; then fail "dry-run 不应出现重跑节"; fi

          echo "RERUN-OK"
          SCRIPT

          output="$(bash /tmp/test-rerun-ci.sh 2>&1)" || { echo "$output"; echo "::error::重跑指引不符合预期"; exit 1; }
          grep -q 'RERUN-OK' <<<"$output" || { echo "$output"; echo "::error::重跑指引未通过"; exit 1; }
          echo "✓ 重跑指引的形态选择、可重跑判定与三个落点都正确"

      - name: 验证完整性校验的差异判定
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # verify_integrity 的核心逻辑用 mock 验证：真实环境里「目标与源不一致」
          # 这个状态没法稳定端到端构造——校验紧跟同步执行，而同步本身会覆盖掉
          # 不一致的目标。mock 的对象是 skopeo_inspect_raw（inspect 的唯一入口），
          # 平台摘要提取走的仍是生产代码里的 platform_digest_map。
          sed -n '/^platform_digest_map()/,/^}/p' scripts/sync.sh > /tmp/verify-fns.sh
          sed -n '/^verify_integrity()/,/^}/p' scripts/sync.sh >> /tmp/verify-fns.sh

          cat > /tmp/test-verify.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          source /tmp/verify-fns.sh
          skopeo_inspect_raw() {
            case "$1" in
              *good*)    printf '{"manifests":[{"platform":{"os":"linux","architecture":"amd64"},"digest":"sha256:aaa"},{"platform":{"os":"linux","architecture":"arm64"},"digest":"sha256:bbb"}]}' ;;
              *missing*) printf '{"manifests":[{"platform":{"os":"linux","architecture":"amd64"},"digest":"sha256:aaa"}]}' ;;
              *empty*)   printf '' ;;
              *)         printf '{"manifests":[]}' ;;
            esac
          }
          run() { set +e; detail="$(verify_integrity "$1" "$2" 2>/dev/null)"; rc=$?; set -e; }

          run good-src good-dest
          [[ $rc -eq 0 ]] || { echo "FAIL: 一致场景应为 rc=0，实际 $rc"; exit 1; }

          run good-src missing-dest
          [[ $rc -eq 1 ]] || { echo "FAIL: 缺平台场景应为 rc=1，实际 $rc"; exit 1; }
          grep -q 'linux/arm64' <<<"$detail" || { echo "FAIL: 未指出缺失的平台"; exit 1; }

          run empty-src good-dest
          [[ $rc -eq 2 ]] || { echo "FAIL: 源不可读应为 rc=2，实际 $rc"; exit 1; }

          run good-src empty-dest
          [[ $rc -eq 2 ]] || { echo "FAIL: 目标不可读应为 rc=2，实际 $rc"; exit 1; }

          run plain-src plain-dest
          [[ $rc -eq 0 ]] || { echo "FAIL: 单平台一致应为 rc=0，实际 $rc"; exit 1; }

          echo "MOCK-OK"
          SCRIPT
          bash /tmp/test-verify.sh | grep -q 'MOCK-OK' || {
            echo "::error::完整性校验的差异判定不符合预期"
            exit 1
          }
          echo "✓ 校验的差异判定正确（一致 / 缺平台 / 不可校验 / 单平台）"

          # --verify 未开启时行为完全不变：输出里不应出现校验相关字样
          output="$(./scripts/sync.sh --src "nginx:1.27,redis:7.4,alpine:3.20" --dest r.example.com/x \
            --dry-run 2>&1)"
          if grep -q '校验' <<<"$output"; then
            echo "::error::未开启 --verify 时不应出现校验行为"
            exit 1
          fi
          echo "✓ 默认行为不变"

      - name: 验证连续失败计数与失败原因渲染的判定逻辑
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 跨运行状态无法在单次运行中端到端产生（需要多次真实失败的运行），
          # 所以与校验一样用「提取生产函数 + 伪造输入」的方式测判定逻辑本身。
          {
            sed -n '/^readonly FIELD_SEP=/p' scripts/sync.sh
            sed -n '/^count_consecutive_failures()/,/^}/p' scripts/sync.sh
            sed -n '/^gather_alert_images()/,/^}/p' scripts/sync.sh
            sed -n '/^format_alert_line()/,/^}/p' scripts/sync.sh
          } > /tmp/notify-fns.sh

          cat > /tmp/test-notify.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          source /tmp/notify-fns.sh
          log_info() { printf '[信息] %s\n' "$*" >&2; }

          FS="$(printf '\x1f')"
          NOTIFY_AFTER_FAILURES=3

          # 历史：a 连续失败 2 次；b 上次成功（清零）；c 从未出现
          hist="$(mktemp)"
          {
            printf '2026-09-09T01:00:00Z%sa.example.com/x:1%sfailed\n' "$FS" "$FS"
            printf '2026-09-09T01:00:00Z%sb.example.com/y:1%sfailed\n' "$FS" "$FS"
            printf '2026-09-10T01:00:00Z%sa.example.com/x:1%sfailed\n' "$FS" "$FS"
            printf '2026-09-10T01:00:00Z%sb.example.com/y:1%ssuccess\n' "$FS" "$FS"
          } > "$hist"

          # R_NOTE 与 R_SRC / R_STATUS 一样是运行期的输入，夹具必须一起伪造。
          R_SRC=(a.example.com/x:1 b.example.com/y:1 c.example.com/z:1)
          R_STATUS=(failed failed failed)
          R_NOTE=('镜像引用格式错误：缺少 tag' '同步失败，详见上方日志' '')

          out="$(gather_alert_images "$hist")"

          grep -q "$(printf 'a.example.com/x:1\x1f3')" <<<"$out" \
            || { echo "FAIL: a 应为连续 3 次（2 历史 + 1 本次）"; exit 1; }
          # 失败原因字段：追加在末段之后，既有的子串断言仍然命中
          grep -qF "$(printf 'a.example.com/x:1\x1f3\x1f镜像引用格式错误：缺少 tag')" <<<"$out" \
            || { echo "FAIL: 失败原因未随通知输出"; exit 1; }
          grep -q 'b.example.com' <<<"$out" \
            && { echo "FAIL: b 上次成功应清零，未达阈值"; exit 1; }
          grep -q 'c.example.com' <<<"$out" \
            && { echo "FAIL: c 无历史应按首次处理"; exit 1; }

          # 阈值 1 = 历史行为：全部失败都通知
          NOTIFY_AFTER_FAILURES=1
          out="$(gather_alert_images "$hist")"
          [[ "$(grep -c 'example.com' <<<"$out")" -eq 3 ]] \
            || { echo "FAIL: 阈值 1 应通知全部 3 个失败"; exit 1; }

          # 失败详情的渲染。段序读错时 cnt 会拿到原因文本，次数标记随之丢失——
          # 这条断言就是为那个静默错账准备的。
          rendered="$(format_alert_line "$(printf 'b.example.com/y:1\x1f3\x1f同步失败，详见上方日志')")"
          [[ "$rendered" == '- b.example.com/y:1（**连续第 3 次失败**）：同步失败，详见上方日志' ]] \
            || { echo "FAIL: 连续次数段序读错：[$rendered]"; exit 1; }

          rendered="$(format_alert_line "$(printf 'a.example.com/x:1\x1f1\x1f镜像引用格式错误：缺少 tag')")"
          [[ "$rendered" == '- a.example.com/x:1：镜像引用格式错误：缺少 tag' ]] \
            || { echo "FAIL: 失败原因未带出：[$rendered]"; exit 1; }

          # 原因为空时不追加尾巴——否则会留下一个孤零零的冒号
          rendered="$(format_alert_line "$(printf 'a.example.com/x:1\x1f1\x1f')")"
          [[ "$rendered" == '- a.example.com/x:1' ]] \
            || { echo "FAIL: 原因为空时拖了尾巴：[$rendered]"; exit 1; }

          rendered="$(format_alert_line "$(printf 'a.example.com/x:1\x1f3\x1f')")"
          [[ "$rendered" == '- a.example.com/x:1（**连续第 3 次失败**）' ]] \
            || { echo "FAIL: 原因为空时连续次数丢失：[$rendered]"; exit 1; }

          echo "MOCK-OK"
          SCRIPT

          # 不用管道接 grep 判成败：管道只看最后一个命令的退出码，
          # 测试脚本的失败与它的 stderr 都可能被吞掉。分段捕获再判。
          if ! out="$(bash /tmp/test-notify.sh 2>&1)"; then
            printf '%s\n' "$out"
            echo "::error::连续失败计数与失败原因渲染不符合预期"
            exit 1
          fi
          grep -qF 'MOCK-OK' <<<"$out" || {
            printf '%s\n' "$out"
            echo "::error::连续失败计数与失败原因渲染不符合预期"
            exit 1
          }

          # 参数校验。这一条与失败原因无关，但它原本就在这个步骤里——本任务重构
          # 步骤尾部时一并删掉了，等于把一条既有断言无声抹掉。恢复在这里。
          set +e
          ./scripts/sync.sh --src nginx:1.27 --dest r.example.com/x \
            --notify-after-failures 0 --dry-run >/dev/null 2>&1
          code=$?
          set -e
          [[ "$code" -eq 1 ]] || { echo "::error::--notify-after-failures 0 应被拒绝（退出码 1），实际 ${code}"; exit 1; }
          echo "✓ 非法阈值被拒绝"

          echo "NOTIFY-STEP-OK"

      - name: 验证报告下载失败的分类判定
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # download_reports 的核心分类逻辑用 mock 验证：真实环境里「带附件
          # 但下载失败」依赖网络抖动，没法稳定构造——Issue #87 的起因正是它。
          # mock 的对象是 gh api（附件存在性确认）；stderr 分类走生产代码。
          sed -n '/^classify_download_failure()/,/^}/p' scripts/history.sh > /tmp/download-fns.sh
          sed -n '/^confirm_artifact_exists()/,/^}/p' scripts/history.sh >> /tmp/download-fns.sh

          cat > /tmp/test-download.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          source /tmp/download-fns.sh

          # gh mock：api 按 GH_MOCK_FIXTURE 返回对应 fixture，其余子命令一律失败
          gh() {
            if [[ "$1" == "api" ]]; then
              case "${GH_MOCK_FIXTURE:-}" in
                yes)     printf '{"artifacts":[{"name":"check-report","expired":false}]}' ;;
                expired) printf '{"artifacts":[{"name":"check-report","expired":true}]}' ;;
                absent)  printf '{"artifacts":[{"name":"other-report","expired":false}]}' ;;
                empty)   printf '{"artifacts":[]}' ;;
                *)       printf 'Get "https://objects.githubusercontent.com/...": EOF' >&2; return 1 ;;
              esac
            else
              return 127
            fi
          }

          classify() { classify_download_failure "$1"; }
          confirm() { GH_MOCK_FIXTURE="$1" confirm_artifact_exists 123 check-report; }

          # 分类：gh 的两条「无附件」文案归正常；其余（EOF、空输出）一律
          # 保守归可疑，交给 API 确认——文案分错也不会把无附件误报成下载失败
          [[ "$(classify 'no valid artifacts found to download')" == "no-artifact" ]] \
            || { echo "FAIL: 完全无附件应归 no-artifact"; exit 1; }
          [[ "$(classify 'no artifact matches any of the names or patterns provided')" == "no-artifact" ]] \
            || { echo "FAIL: 名字不匹配应归 no-artifact"; exit 1; }
          [[ "$(classify 'Get "https://objects.githubusercontent.com/...": EOF')" == "suspicious" ]] \
            || { echo "FAIL: 网络 EOF 应归 suspicious"; exit 1; }
          [[ "$(classify '')" == "suspicious" ]] \
            || { echo "FAIL: 空输出应保守归 suspicious"; exit 1; }

          # 确认：同名附件 → yes；过期 → expired；无同名 → absent；
          # API 查不动（网络抖动）→ unknown，由调用方如实计入下载失败
          [[ "$(confirm yes)" == "yes" ]] || { echo "FAIL: 有附件应为 yes"; exit 1; }
          [[ "$(confirm expired)" == "expired" ]] || { echo "FAIL: 过期附件应为 expired"; exit 1; }
          [[ "$(confirm absent)" == "absent" ]] || { echo "FAIL: 名字不匹配应为 absent"; exit 1; }
          [[ "$(confirm empty)" == "absent" ]] || { echo "FAIL: 无附件应为 absent"; exit 1; }
          [[ "$(confirm boom)" == "unknown" ]] || { echo "FAIL: API 失效应为 unknown"; exit 1; }

          echo "MOCK-OK"
          SCRIPT
          bash /tmp/test-download.sh | grep -q 'MOCK-OK' || {
            echo "::error::报告下载失败的分类判定不符合预期"
            exit 1
          }
          echo "✓ 下载失败分类正确（无附件 / 名字不匹配 / 网络 EOF / 过期 / unknown）"

          # 重试逻辑（Issue #97）同样只能 mock：「带附件但下载失败」依赖网络
          # 抖动，真实环境构造不出来。download_reports 整体跑在 mock gh 上，
          # 三个用例覆盖「重试成功 / 重试仍失败 / 不重试的类别」
          sed -n '/^download_reports()/,/^}/p' scripts/history.sh >> /tmp/download-fns.sh

          cat > /tmp/test-retry.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          source /tmp/download-fns.sh

          # 生产文件的日志函数（mock：直接写 stderr，文本即断言对象）
          log_info()  { printf '%s\n' "$*" >&2; }
          log_warn()  { printf '%s\n' "$*" >&2; }
          log_error() { printf '%s\n' "$*" >&2; }
          die() { log_error "$*"; exit 1; }

          WORK_BASE="$(mktemp -d)"
          trap 'rm -rf "$WORK_BASE"' EXIT

          # 间隔的值不在断言范围（PRD 明确不做参数化），mock 掉让 CI 不白等。
          # 计数走文件而不是变量：download_reports 在命令替换的子 shell 里
          # 执行，子 shell 里对全局变量的赋值传不回父进程
          sleep() { echo x >> "${WORK_BASE}/sleeps"; }

          # gh mock：run list 按 GH_LIST_BEHAVIOR 表现（Issue #98：请求失败与
          # 「确实没有运行记录」在旧代码里是同一种结果，正是要区分的东西），
          # 调用次数计数走文件；download 按 GH_BEHAVIOR_<id> 表现
          # （fail-first=首败后成功 / always-fail=一直网络错误 / no-artifact=无附件）；
          # api 按 GH_API_FIXTURE 返回。download 计数用文件（bash 3.2 没有关联数组）
          gh() {
            if [[ "$1" == "run" && "$2" == "list" ]]; then
              local cnt
              cnt="$(cat "${WORK_BASE}/list-calls" 2>/dev/null || echo 0)"
              cnt=$((cnt + 1))
              echo "$cnt" > "${WORK_BASE}/list-calls"
              case "${GH_LIST_BEHAVIOR:-ok}" in
                ok)           printf '%s\n' "${GH_RUN_IDS[@]}"; return 0 ;;
                empty)        return 0 ;;
                fail-then-ok) if [[ "$cnt" -eq 1 ]]; then printf 'Get "https://api.github.com/x": EOF' >&2; return 1; fi
                              printf '%s\n' "${GH_RUN_IDS[@]}"; return 0 ;;
                # 真实 gh 的报错常是多行：第二行用来验证 die 只取首行
                # （整段塞进去会把单行错误信息撑成一段，看不清重点）
                always-fail)  printf 'Get "https://api.github.com/x": EOF\nTry again later\n' >&2; return 1 ;;
              esac
            fi
            if [[ "$1" == "run" && "$2" == "download" ]]; then
              local id="$3" cnt behavior
              cnt="$(cat "${WORK_BASE}/dl-${id}" 2>/dev/null || echo 0)"
              cnt=$((cnt + 1))
              echo "$cnt" > "${WORK_BASE}/dl-${id}"
              behavior="GH_BEHAVIOR_${id}"
              case "${!behavior:-}" in
                fail-first)  if [[ "$cnt" -eq 1 ]]; then printf 'Get "https://objects.githubusercontent.com/x": EOF' >&2; return 1; fi; return 0 ;;
                always-fail) printf 'Get "https://objects.githubusercontent.com/x": EOF' >&2; return 1 ;;
                no-artifact) printf 'no valid artifacts found to download' >&2; return 1 ;;
                *) return 0 ;;
              esac
            fi
            if [[ "$1" == "api" ]]; then
              if [[ "${GH_API_FIXTURE:-}" == "yes" ]]; then
                printf '{"artifacts":[{"name":"rep","expired":false}]}'
              else
                printf '{"artifacts":[]}'
              fi
              return 0
            fi
            return 127
          }

          # 公共环境
          LIMIT=5
          REPORT_NAME="rep"
          WORKFLOW_FILTER=""
          CHECK_MODE=""
          WORK_DIR=""

          # --- 用例 A：重试成功（100 首败后成功，200 无附件不重试）---
          GH_RUN_IDS=(100 200)
          GH_BEHAVIOR_100="fail-first"
          GH_BEHAVIOR_200="no-artifact"
          GH_API_FIXTURE="yes"
          rm -f "${WORK_BASE}/sleeps"
          out="$(download_reports 2>&1)"
          grep -q '对 1 次失败的下载重试' <<<"$out" || { echo "FAIL: 应对 1 次失败重试"; echo "$out"; exit 1; }
          grep -q '重试挽回 1 次下载' <<<"$out" || { echo "FAIL: 应挽回 1 次下载"; echo "$out"; exit 1; }
          grep -q '有 1 次带同步报告' <<<"$out" || { echo "FAIL: got 应为 1"; echo "$out"; exit 1; }
          grep -q '应下载却失败' <<<"$out" && { echo "FAIL: 重试成功后不应再报失败"; echo "$out"; exit 1; }
          [[ "$(cat "${WORK_BASE}/dl-200")" == "1" ]] || { echo "FAIL: 无附件运行不应被重试（只下载 1 次）"; exit 1; }
          sleeps="$(grep -c . "${WORK_BASE}/sleeps" 2>/dev/null)" || sleeps=0
          [[ "$sleeps" -eq 1 ]] || { echo "FAIL: 应只在重试前等待 1 次，实际 ${sleeps}"; exit 1; }
          echo "✓ 重试成功：计入 got、无附件不重试"

          # --- 用例 B：重试仍失败（100 一直失败，确认有附件）---
          GH_RUN_IDS=(100)
          GH_BEHAVIOR_100="always-fail"
          GH_API_FIXTURE="yes"
          rm -f "${WORK_BASE}/sleeps"
          set +e
          out="$(download_reports 2>&1)"
          code=$?
          set -e
          [[ "$code" -eq 1 ]] || { echo "FAIL: 全部失败应 die（退出码 1），实际 ${code}"; exit 1; }
          grep -q '对 1 次失败的下载重试' <<<"$out" || { echo "FAIL: 应有重试动作"; echo "$out"; exit 1; }
          grep -q '重试挽回' <<<"$out" && { echo "FAIL: 不应谎报挽回"; exit 1; }
          grep -q '1 次应下载却失败' <<<"$out" || { echo "FAIL: 报错文案应如实报告失败"; echo "$out"; exit 1; }
          sleeps="$(grep -c . "${WORK_BASE}/sleeps" 2>/dev/null)" || sleeps=0
          [[ "$sleeps" -eq 1 ]] || { echo "FAIL: 仍失败也应等待后重试 1 次，实际 ${sleeps}"; exit 1; }
          echo "✓ 重试仍失败：退出码与文案与 v1.11 一致"

          # --- 用例 C：无附件不触发重试 ---
          GH_RUN_IDS=(100)
          GH_BEHAVIOR_100="no-artifact"
          GH_API_FIXTURE="empty"
          rm -f "${WORK_BASE}/sleeps"
          set +e
          out="$(download_reports 2>&1)"
          code=$?
          set -e
          [[ "$code" -eq 1 ]] || { echo "FAIL: 无附件应 die（退出码 1），实际 ${code}"; exit 1; }
          grep -q '重试' <<<"$out" && { echo "FAIL: 无附件不应触发重试"; echo "$out"; exit 1; }
          grep -q '没有任何' <<<"$out" || { echo "FAIL: 应报现有文案"; echo "$out"; exit 1; }
          sleeps="$(grep -c . "${WORK_BASE}/sleeps" 2>/dev/null)" || sleeps=0
          [[ "$sleeps" -eq 0 ]] || { echo "FAIL: 不重试就不应等待，实际 ${sleeps}"; exit 1; }
          echo "✓ 无附件：不重试，文案不变"

          # --- Issue #98：gh run list 的请求失败与「确实没有运行记录」必须区分 ---
          # 失败仍重试一轮（与下载重试同口径），空列表保留原文案
          GH_BEHAVIOR_100=""
          GH_API_FIXTURE="yes"
          GH_RUN_IDS=(100)

          # 用例 D：首次即成功 → 不重试
          GH_LIST_BEHAVIOR="ok"
          rm -f "${WORK_BASE}/sleeps" "${WORK_BASE}/list-calls"
          set +e
          out="$(download_reports 2>&1)"
          code=$?
          set -e
          [[ "$code" -eq 0 ]] || { echo "FAIL: 首次成功应正常结束（退出码 0），实际 ${code}"; echo "$out"; exit 1; }
          grep -qF '没有取到任何运行记录' <<<"$out" && { echo "FAIL: 首次成功不应报空列表"; echo "$out"; exit 1; }
          list_calls="$(cat "${WORK_BASE}/list-calls" 2>/dev/null || echo 0)"
          [[ "$list_calls" -eq 1 ]] || { echo "FAIL: 首次成功应只调一次 run list，实际 ${list_calls}"; exit 1; }
          sleeps="$(grep -c . "${WORK_BASE}/sleeps" 2>/dev/null)" || sleeps=0
          [[ "$sleeps" -eq 0 ]] || { echo "FAIL: 首次成功不应等待，实际 ${sleeps}"; exit 1; }
          echo "✓ run list 首次成功：不重试"

          # 用例 A：首次失败后成功 → 重试一轮，流程继续（使用者能看出重试过）
          GH_LIST_BEHAVIOR="fail-then-ok"
          rm -f "${WORK_BASE}/sleeps" "${WORK_BASE}/list-calls"
          set +e
          out="$(download_reports 2>&1)"
          code=$?
          set -e
          [[ "$code" -eq 0 ]] || { echo "FAIL: 重试成功应继续（退出码 0），实际 ${code}"; echo "$out"; exit 1; }
          grep -qF '重试成功' <<<"$out" || { echo "FAIL: 重试成功应能看出重试过"; echo "$out"; exit 1; }
          grep -qF '没有取到任何运行记录' <<<"$out" && { echo "FAIL: 重试成功不应报空列表"; echo "$out"; exit 1; }
          list_calls="$(cat "${WORK_BASE}/list-calls" 2>/dev/null || echo 0)"
          [[ "$list_calls" -eq 2 ]] || { echo "FAIL: 应调两次 run list，实际 ${list_calls}"; exit 1; }
          sleeps="$(grep -c . "${WORK_BASE}/sleeps" 2>/dev/null)" || sleeps=0
          [[ "$sleeps" -eq 1 ]] || { echo "FAIL: 应等待 1 次后重试，实际 ${sleeps}"; exit 1; }
          echo "✓ run list 首次失败后成功：重试一轮，流程继续"

          # 用例 B：两次都失败 → die，文案指向网络与重试，带出 gh 的真实错误
          GH_LIST_BEHAVIOR="always-fail"
          rm -f "${WORK_BASE}/sleeps" "${WORK_BASE}/list-calls"
          set +e
          out="$(download_reports 2>&1)"
          code=$?
          set -e
          [[ "$code" -eq 1 ]] || { echo "FAIL: run list 全败应 die（退出码 1），实际 ${code}"; exit 1; }
          # 「获取运行列表失败」这几个字在重试前的告警里也出现，单查它会被那句
          # 日志顺带满足——所以查的是 die 的定名（「（已重试一次）：」只在 die 里），
          # 以及「指向网络」这句（PRD R2 的措辞此前没有任何断言钉住）
          grep -qF '获取运行列表失败（已重试一次）：' <<<"$out" \
            || { echo "FAIL: 文案应指出已重试一次仍失败"; echo "$out"; exit 1; }
          grep -qF '多为网络原因，稍后重跑即可' <<<"$out" \
            || { echo "FAIL: 文案应指向网络原因与重跑"; echo "$out"; exit 1; }
          grep -qF 'EOF' <<<"$out" || { echo "FAIL: 应带出 gh 的真实错误文本"; echo "$out"; exit 1; }
          # mock 的报错是两行：只应带出第一行（gh 的多行报错整段塞进 die 会
          # 把单行信息撑成一段）
          grep -qF 'Try again later' <<<"$out" && { echo "FAIL: die 只应取 stderr 的首行"; echo "$out"; exit 1; }
          grep -qF 'run-list.err' <<<"$out" && { echo "FAIL: 不应把临时文件路径当成错误原因"; echo "$out"; exit 1; }
          grep -qF '没有取到任何运行记录' <<<"$out" && { echo "FAIL: 网络失败不应落到空列表文案"; echo "$out"; exit 1; }
          list_calls="$(cat "${WORK_BASE}/list-calls" 2>/dev/null || echo 0)"
          [[ "$list_calls" -eq 2 ]] || { echo "FAIL: 应调两次 run list，实际 ${list_calls}"; exit 1; }
          sleeps="$(grep -c . "${WORK_BASE}/sleeps" 2>/dev/null)" || sleeps=0
          [[ "$sleeps" -eq 1 ]] || { echo "FAIL: 应等待 1 次后重试，实际 ${sleeps}"; exit 1; }
          echo "✓ run list 两次都失败：退出码 1，文案指向网络与重试"

          # 用例 C：空列表（退出码 0、无输出）→ 原文案逐字不变，且不重试
          # （重试条件若写成「run_ids 为空就重试」，这里的 sleeps 会变成 1）
          GH_LIST_BEHAVIOR="empty"
          rm -f "${WORK_BASE}/sleeps" "${WORK_BASE}/list-calls"
          set +e
          out="$(download_reports 2>&1)"
          code=$?
          set -e
          [[ "$code" -eq 1 ]] || { echo "FAIL: 空列表应 die（退出码 1），实际 ${code}"; exit 1; }
          grep -qF '没有取到任何运行记录。请确认当前目录在一个 GitHub 仓库中，gh 已登录，且工作流「」至少跑过一次（--check 模式下这是体检工作流；也可用 --dir 指定本地报告目录）' <<<"$out" \
            || { echo "FAIL: 空列表文案应与改动前逐字相同"; echo "$out"; exit 1; }
          grep -qF '重试' <<<"$out" && { echo "FAIL: 空列表不应触发重试"; echo "$out"; exit 1; }
          sleeps="$(grep -c . "${WORK_BASE}/sleeps" 2>/dev/null)" || sleeps=0
          [[ "$sleeps" -eq 0 ]] || { echo "FAIL: 空列表不应等待，实际 ${sleeps}"; exit 1; }
          list_calls="$(cat "${WORK_BASE}/list-calls" 2>/dev/null || echo 0)"
          [[ "$list_calls" -eq 1 ]] || { echo "FAIL: 空列表应只调一次 run list，实际 ${list_calls}"; exit 1; }
          echo "✓ run list 空列表：原文案逐字不变，不重试"

          echo "MOCK-OK"
          SCRIPT
          # 不用管道接 grep 判成败：内层断言的 FAIL 信息与退出码都会被管道吞掉，
          # 失败时只剩一句笼统的「不符合预期」，得本地复现才知道红在哪条用例
          # （与「验证连续失败计数与失败原因渲染」步骤同一理由）。分段捕获再判。
          if ! out="$(bash /tmp/test-retry.sh 2>&1)"; then
            printf '%s\n' "$out"
            echo "::error::报告下载的重试逻辑不符合预期"
            exit 1
          fi
          grep -qF 'MOCK-OK' <<<"$out" || {
            printf '%s\n' "$out"
            echo "::error::报告下载的重试逻辑不符合预期（未跑到 MOCK-OK 标记）"
            exit 1
          }
          echo "✓ 下载重试正确（挽回计入 got / 全败如实报错 / 无附件与过期不重试）"
          echo "✓ 运行列表获取正确（失败重试一轮 / 全败报网络错 / 空列表原文案不重试）"

      - name: 验证 regctl 下载的重试（mock curl）
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # #122 加的是「下载失败重试一轮」，而它的**成功路径** CI 每次运行都会
          # 真实走到（runner 环境干净，command -v regctl 必然不命中）——被覆盖的
          # 恰恰是新增的那条重试路径：它只在失败时触发，而抖动造不出来。
          # 所以整体 mock 掉 curl，与上面 #97 的重试用例同一手法。
          #
          # 生产函数按惯例用 sed 抽取、跑在只有 stub 的上下文里。
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT

          sed -n '/^ensure_regctl()/,/^}/p' scripts/sync.sh > "${WORK}/fn.sh"
          if [[ ! -s "${WORK}/fn.sh" ]]; then
            echo "::error::未能从 sync.sh 抽出 ensure_regctl"
            exit 1
          fi

          cat > "${WORK}/run.sh" <<'TESTCASE'
          #!/usr/bin/env bash
          set -euo pipefail

          source "${WORK}/fn.sh"

          # 生产文件的日志函数（mock：写 stderr，文本即断言对象）
          log_info() { printf '[信息] %s\n' "$*" >&2; }
          log_warn() { printf '[警告] %s\n' "$*" >&2; }
          log_ok()   { printf '[成功] %s\n' "$*" >&2; }
          log_dim()  { printf '%s\n' "$*" >&2; }
          die()      { printf '[错误] %s\n' "$*" >&2; exit 1; }

          # 间隔的值不在断言范围（PRD 明确不做参数化），mock 掉让 CI 不白等 5 秒。
          # 计数走文件而不是变量：ensure_regctl 在命令替换的子 shell 里执行，
          # 子 shell 里对全局变量的赋值传不回父进程（bash 3.2 也没有关联数组）
          sleep() {
            local n
            n="$(cat "${CALLS_DIR}/sleeps" 2>/dev/null || echo 0)"
            echo $((n + 1)) > "${CALLS_DIR}/sleeps"
          }

          # mock curl：前 MOCK_FAIL_TIMES 次失败，并像真 curl -o 那样把**残缺内容**
          # 写进目标文件——修复前的那条缺陷正是「失败后残缺文件躺在 ${bindir}/regctl
          # 上」，断言要能抓住它
          curl() {
            local cnt out=""
            cnt="$(cat "${CALLS_DIR}/calls" 2>/dev/null || echo 0)"
            cnt=$((cnt + 1)); echo "$cnt" > "${CALLS_DIR}/calls"
            while [[ $# -gt 0 ]]; do
              case "$1" in -o) out="$2"; shift 2 ;; *) shift ;; esac
            done
            if [[ "$cnt" -le "${MOCK_FAIL_TIMES:-0}" ]]; then
              [[ -n "$out" ]] && printf 'PARTIAL-GARBAGE-NOT-A-BINARY' > "$out"
              return 22
            fi
            [[ -n "$out" ]] && printf '#!/bin/sh\necho v0.11.6-MOCK\n' > "$out"
            return 0
          }

          # 版本从生产文件抽，不在夹具里写死。写死会在升级 REGCTL_VERSION 时
          # 静默漂移（不红也不报，断言照过），而这里本来就要顺带钉住下载 URL 的形状
          REGCTL_VERSION="$(sed -n 's/^REGCTL_VERSION="\(.*\)"$/\1/p' scripts/sync.sh | head -n1)"
          if [[ -z "$REGCTL_VERSION" ]]; then
            echo "::error::未能从 scripts/sync.sh 抽出 REGCTL_VERSION"
            exit 1
          fi
          # 限定 PATH 确保 command -v regctl 不命中——否则整条下载路径被跳过，
          # 三条用例会「全绿」地什么都没测
          export PATH="/usr/bin:/bin"

          case_name="$1"
          export CALLS_DIR="${WORK}/calls-${case_name}"
          mkdir -p "$CALLS_DIR"
          export HOME="${WORK}/home-${case_name}"
          mkdir -p "$HOME"

          case "$case_name" in
            fail-then-ok) MOCK_FAIL_TIMES=1 ;;
            always-fail)  MOCK_FAIL_TIMES=2 ;;
            ok-first)     MOCK_FAIL_TIMES=0 ;;
            *) echo "未知用例：$case_name" >&2; exit 1 ;;
          esac
          export MOCK_FAIL_TIMES

          rc=0
          out="$(ensure_regctl 2>&1)" || rc=$?
          echo "$out"

          calls="$(cat "${CALLS_DIR}/calls" 2>/dev/null || echo 0)"
          sleeps="$(cat "${CALLS_DIR}/sleeps" 2>/dev/null || echo 0)"
          target="${HOME}/.regclient/bin/regctl"
          leftovers="$(find "${HOME}/.regclient/bin" -name '.regctl-dl.*' 2>/dev/null | wc -l | tr -d ' ')"
          garbage="no"
          [[ -e "$target" ]] && grep -q 'PARTIAL-GARBAGE' "$target" 2>/dev/null && garbage="yes"

          fail() { echo "::error::$1"; exit 1; }

          case "$case_name" in
            fail-then-ok)
              [[ "$rc" -eq 0 ]]        || fail "首败次成应成功（rc=${rc}）"
              [[ "$calls" -eq 2 ]]     || fail "应调用 curl 两次（实际 ${calls}）"
              [[ "$sleeps" -eq 1 ]]    || fail "应等待一次（实际 ${sleeps}）"
              grep -q '重试成功' <<<"$out" || fail "应打印「重试成功」——重试过这件事必须可见"
              [[ -x "$target" ]]       || fail "目标应可执行"
              [[ "$garbage" == "no" ]] || fail "目标含残留的残缺内容"
              # 成功路径也要查临时文件：只查 -x 会放过「mv 写成 cp」这类
              # （成功、但把临时文件留在目录里），而那正是这个用例该守的东西
              [[ "$leftovers" -eq 0 ]] || fail "成功路径不该留下临时文件（${leftovers} 个）"
              ;;
            always-fail)
              [[ "$rc" -ne 0 ]]       || fail "两次都失败应以非零退出"
              [[ "$calls" -eq 2 ]]    || fail "应重试一次、共两次（实际 ${calls}）"
              grep -q '已重试一次' <<<"$out" || fail "报错应含「已重试一次」"
              # 断言的是**指向所固定版本**的那个 URL，不只是「有个 https 链接」——
              # 后者在 URL 拼错、版本占位符没替换时同样会通过
              grep -q "releases/download/${REGCTL_VERSION}/regctl-" <<<"$out" \
                || fail "报错应含指向 ${REGCTL_VERSION} 的下载 URL"
              [[ ! -e "$target" ]]    || fail "失败后目标不该存在（残缺文件会被后续运行误用）"
              [[ "$leftovers" -eq 0 ]] || fail "不该有临时文件残留（${leftovers} 个）"
              ;;
            ok-first)
              [[ "$rc" -eq 0 ]]     || fail "一次成功应 rc=0"
              [[ "$calls" -eq 1 ]]  || fail "应只调用一次（实际 ${calls}）"
              # 这条是对照：没有重试就不该打印「重试成功」——否则上面那条断言
              # 在「无论重试与否都打印」的实现下同样会通过，等于没测
              if grep -q '重试成功' <<<"$out"; then
                fail "没有发生重试却打印了「重试成功」"
              fi
              [[ -x "$target" ]]    || fail "目标应可执行"
              ;;
          esac
          echo "✓ ${case_name} 通过（calls=${calls} sleeps=${sleeps}）"
          TESTCASE

          export WORK
          for c in fail-then-ok always-fail ok-first; do
            echo "--- 用例：${c} ---"
            bash "${WORK}/run.sh" "$c"
          done
          echo "✓ regctl 下载重试正确（首败次成 / 两次全败如实报错且不留残缺 / 一次成功不误报重试）"

      - name: 验证凭证映射、环境变量通路与多仓库告警
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          cred="$(mktemp)"
          chmod 600 "$cred"
          { echo "# 注释行"
            echo "harbor.internal.example.com  alice   token-a"
            echo ""
            echo "ghcr.io bob ghp_xxx"
          } > "$cred"

          # 多 host 映射：装载列表只含文件中的 host，
          # 未匹配的镜像走匿名——这是按仓库映射存在的意义
          output="$(./scripts/sync.sh \
            --src "harbor.internal.example.com/lib/a:1,ghcr.io/b/b:2,nginx:1.27" \
            --dest r.example.com/x --src-credentials "$cred" --dry-run 2>&1)"
          echo "$output"

          grep -q '凭证已装载（2 个仓库）' <<<"$output" \
            || { echo "::error::凭证映射未正确装载两个 host"; exit 1; }
          echo "✓ 多 host 映射正确，公开镜像走匿名"

          # 与 --src-username 互斥：混用的语义只能靠猜，直接拒绝
          set +e
          ./scripts/sync.sh --src nginx:1.27 --dest r.example.com/x \
            --src-credentials "$cred" --src-username alice --dry-run >/dev/null 2>&1
          code=$?
          set -e
          [[ "$code" -eq 1 ]] || { echo "::error::混用应退出码 1，实际 ${code}"; exit 1; }
          echo "✓ 与单值凭证互斥"

          # 格式错误的行：指明行号、中止同步，且不回显行内容（行里有密码）
          bad="$(mktemp)"
          chmod 600 "$bad"
          { echo "host1 u1 p1"; echo "host2 只有俩"; } > "$bad"
          set +e
          output="$(./scripts/sync.sh --src nginx:1.27 --dest r.example.com/x \
            --src-credentials "$bad" --dry-run 2>&1)"
          code=$?
          set -e
          [[ "$code" -eq 1 ]] || { echo "::error::格式错误应退出码 1，实际 ${code}"; exit 1; }
          grep -q '第 2 行格式错误' <<<"$output" \
            || { echo "::error::未指明出错的行号"; exit 1; }
          if grep -q '只有俩' <<<"$output"; then
            echo "::error::错误信息回显了行内容（含密码）"
            exit 1
          fi
          echo "✓ 格式错误报行号且不回显行内容"

          # 环境变量方式（CI 的 Secret 注入路径）：值为内容而非路径。
          # cred 内容有两条有效条目，无论 --src 用到哪条，装载的都是全部
          output="$(SYNC_SRC_CREDENTIALS="$(cat "$cred")" \
            ./scripts/sync.sh --src "ghcr.io/b/b:2" --dest r.example.com/x --dry-run 2>&1)"
          grep -q '凭证已装载（2 个仓库）' <<<"$output" \
            || { echo "::error::SYNC_SRC_CREDENTIALS 未生效"; exit 1; }
          echo "✓ 环境变量注入（Secret 场景）可用"

          # ---- 源凭证的环境变量兜底与多仓库告警（Issue #136）----
          # usage 要求 CI 等自动化场景走环境变量：命令行参数既对同机进程可见（ps aux），
          # 又会被调用方的日志原样打印（工作流里就有一句「执行：./scripts/sync.sh ...」）。
          # 这条通路此前零覆盖，其中最要紧的是 SYNC_SRC_REGISTRY——它丢失时脚本会自动
          # 从镜像列表推导 host，于是凭证被发往使用者未指定的仓库。
          # 判据是「凭证发给了谁与预期一致」，不是「有没有装载」：只断「有装载日志」
          # 在 host 推导错时照样通过。
          assert_no_leak() {
            if grep -qF 'alice' <<<"$1" || grep -qF 's3cret' <<<"$1"; then
              echo "::error::凭证（用户名或密码）出现在输出里"
              exit 1
            fi
          }

          # 1) SYNC_SRC_USERNAME / SYNC_SRC_PASSWORD：host 由镜像列表推导
          #    下面每处 $(...) 都接一个 || 兜底：sync.sh 自己非 0 退出时，set -e 会在
          #    任何 grep 之前终止本步，而 2>&1 已把原因收进了 $output——不打出来就
          #    只剩「exit code 1」，看不到为什么
          output="$(SYNC_SRC_USERNAME=alice SYNC_SRC_PASSWORD=s3cret \
            ./scripts/sync.sh --src harbor.internal.example.com/lib/nginx:1.27 \
            --dest r.example.com/x --dry-run 2>&1)" \
            || { echo "$output"; echo "::error::环境变量通路用例：sync.sh 本身未以 0 退出"; exit 1; }
          echo "$output"
          grep -qF '源仓库凭证已装载（1 个仓库）：harbor.internal.example.com' <<<"$output" \
            || { echo "::error::环境变量用户名/密码未生效，或推导出的 host 不是镜像所在的仓库"; exit 1; }
          assert_no_leak "$output"
          echo "✓ 环境变量用户名/密码生效，host 由镜像推导"

          # 2) 同一通路的另一个 host：host 若被写死，上一条照样绿——这条堵住它
          output="$(SYNC_SRC_USERNAME=alice SYNC_SRC_PASSWORD=s3cret \
            ./scripts/sync.sh --src quay.io/foo/bar:1 --dest r.example.com/x --dry-run 2>&1)" \
            || { echo "$output"; echo "::error::环境变量通路第二个 host 用例：sync.sh 本身未以 0 退出"; exit 1; }
          grep -qF '源仓库凭证已装载（1 个仓库）：quay.io' <<<"$output" \
            || { echo "::error::环境变量通路推导出的 host 不是 quay.io"; exit 1; }
          assert_no_leak "$output"
          echo "✓ 环境变量通路对第二个 host 同样推导正确"

          # 3) SYNC_SRC_REGISTRY 未设 + 多个源仓库：凭证会被发往推导出的每一个 host。
          #    告警是「凭证发了出去但发错了地方」的唯一提示
          output="$(./scripts/sync.sh --src 'nginx:1.27,quay.io/foo/bar:1' \
            --dest r.example.com/x --src-username alice --src-password s3cret --dry-run 2>&1)" \
            || { echo "$output"; echo "::error::多源仓库用例：sync.sh 本身未以 0 退出"; exit 1; }
          echo "$output"
          grep -qF '源仓库凭证已装载（2 个仓库）：docker.io quay.io' <<<"$output" \
            || { echo "::error::未指定 --src-registry 时应装载全部推导出的 host"; exit 1; }
          grep -qF '凭证被应用到多个源仓库。若不希望如此，请用 --src-registry 指定其中之一，或改用 --src-credentials 按仓库映射' <<<"$output" \
            || { echo "::error::多源仓库且未指定 --src-registry 时应出现「凭证被应用到多个源仓库」告警"; exit 1; }
          assert_no_leak "$output"
          echo "✓ 未设 SYNC_SRC_REGISTRY 时凭证装载到全部推导 host，并告警"

          # 4) SYNC_SRC_REGISTRY 设了：只发给它指定的那一个，告警随之消失。
          #    与上一条互为对照——只测一侧无法区分「生效」与「恰好只有一个源」
          output="$(SYNC_SRC_REGISTRY=docker.io ./scripts/sync.sh \
            --src 'nginx:1.27,quay.io/foo/bar:1' --dest r.example.com/x \
            --src-username alice --src-password s3cret --dry-run 2>&1)" \
            || { echo "$output"; echo "::error::SYNC_SRC_REGISTRY 用例：sync.sh 本身未以 0 退出"; exit 1; }
          echo "$output"
          if grep -qF '凭证被应用到多个源仓库' <<<"$output"; then
            echo "::error::设了 SYNC_SRC_REGISTRY 却仍告警「凭证被应用到多个源仓库」"
            exit 1
          fi
          grep -qF '源仓库凭证已装载（1 个仓库）：docker.io' <<<"$output" \
            || { echo "::error::SYNC_SRC_REGISTRY 未生效：装载的不是且仅是它指定的 host"; exit 1; }
          assert_no_leak "$output"
          echo "✓ 设了 SYNC_SRC_REGISTRY 后只装载该 host，多仓库告警消失"

          # 4b) 上一条用的 docker.io 恰好能从 nginx:1.27 推导出来——若实现改成
          #     「忽略 SYNC_SRC_REGISTRY、恒用 docker.io」，它照样绿。换一个**推导不出**
          #     的 host 才是「设了它就真的只发那一个」的决定性证据
          output="$(SYNC_SRC_REGISTRY=harbor.internal.example.com ./scripts/sync.sh \
            --src 'nginx:1.27,quay.io/foo/bar:1' --dest r.example.com/x \
            --src-username alice --src-password s3cret --dry-run 2>&1)" \
            || { echo "$output"; echo "::error::4b 用例：sync.sh 本身未以 0 退出"; exit 1; }
          echo "$output"
          grep -qF '源仓库凭证已装载（1 个仓库）：harbor.internal.example.com' <<<"$output" \
            || { echo "::error::SYNC_SRC_REGISTRY 未生效：装载的不是它指定的、镜像列表里也没有的 host"; exit 1; }
          assert_no_leak "$output"
          echo "✓ SYNC_SRC_REGISTRY 指定的 host 逐字生效（该 host 推导不出来）"

          # 5) 两条参数校验。断文案而非只断退出码——退出码 1 可能来自任何一条 die
          set +e
          output="$(./scripts/sync.sh --src nginx:1.27 --dest r.example.com/x \
            --src-username alice --dry-run 2>&1)"
          code=$?
          set -e
          [[ "$code" -eq 1 ]] || { echo "::error::只给 --src-username 应退出码 1，实际 ${code}"; exit 1; }
          grep -qF -- '--src-username 与 --src-password 必须同时提供（当前只给了一个）' <<<"$output" \
            || { echo "::error::未点明「必须同时提供」"; echo "$output"; exit 1; }
          assert_no_leak "$output"
          echo "✓ 只给 --src-username 被拒，文案点明必须同时提供"

          set +e
          output="$(./scripts/sync.sh --src nginx:1.27 --dest r.example.com/x \
            --src-registry foo.example.com --dry-run 2>&1)"
          code=$?
          set -e
          [[ "$code" -eq 1 ]] || { echo "::error::只给 --src-registry 应退出码 1，实际 ${code}"; exit 1; }
          grep -qF -- '--src-registry 需要与 --src-username / --src-password 一起使用' <<<"$output" \
            || { echo "::error::未点明 --src-registry 需与凭证一起使用"; echo "$output"; exit 1; }
          # 这一条不查「凭证不落输出」：它的命令行上根本没有凭证，
          # 查了也是恒真——恒真的断言比没有断言更糟
          echo "✓ 只给 --src-registry 被拒，文案点明需与凭证一起使用"

      - name: 验证提交信息的区间校验区分「区间无效」与「区间为空」
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # --range 把 git log 的 stderr 丢掉时，「区间无效」与「区间里没有提交」
          # 混成同一种「读到 0 条」，双双打印「全部合规（共检查 0 条）」并 exit 0。
          # header 推荐的 origin/main..HEAD 在没 fetch 过时正是这个形态——静默放行。
          # 判据是「0 条检查结果不能冒充「全部合规」」，不是「0 条就是错」。
          fail() { echo "::error::$1"; exit 1; }

          # 夹具用临时仓库：三种情形一次摆好，且不依赖本仓库历史（提交信息会变）。
          # 提交身份显式给出——runner 上不一定配了全局 user.name/user.email。
          script="$(pwd)/scripts/check-commit-msg.sh"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          git -C "$work" init -q
          for msg in "chore: 初始提交" "坏消息 没有类型" "feat: 合规的提交"; do
            git -C "$work" -c user.name=ci -c user.email=ci@example.com \
              commit -q --allow-empty -m "$msg"
          done
          check() { ( cd "$work" && "$script" "$@" ); }

          # 1) 区间无效（ref 不存在）：报错退出，如实转述 git 的话，并带上使用者给的区间
          set +e
          out="$(check --range nonsense..HEAD 2>&1)"
          code=$?
          set -e
          echo "$out"
          [[ "$code" -eq 1 ]] || fail "无效区间应退出码 1，实际 ${code}"
          grep -qF "ambiguous argument 'nonsense..HEAD'" <<<"$out" \
            || fail "未转述 git 的报错原文"
          # 这句断的是**自己那条**文案带了区间。不能只断 git 那行里有区间——
          # 那是上一句的必然推论（恒真），断不出「自造文案把区间丢了」
          grep -qF '无法解析提交区间「nonsense..HEAD」' <<<"$out" \
            || fail "自己的报错文案未带上使用者给的区间"
          if grep -qF '全部合规' <<<"$out"; then
            fail "无效区间被报成了「全部合规」"
          fi
          echo "✓ 无效区间报错退出，且不含「全部合规」"

          # 2) 区间有效但为空：退出码保持 0（CI 里 BASE..HEAD 为空是合法情形，
          #    例如只有 merge 的 PR，判失败会制造假红），但措辞不能说「全部合规」——
          #    「有没有提交可验」与「提交信息合不合规」是两回事
          set +e
          out="$(check --range HEAD..HEAD 2>&1)"
          code=$?
          set -e
          echo "$out"
          [[ "$code" -eq 0 ]] || fail "空区间是合法情形，应退出码 0，实际 ${code}"
          grep -qF '没有提交，没有可校验的内容' <<<"$out" \
            || fail "空区间未说明「没有可校验的内容」"
          if grep -qF '全部合规' <<<"$out"; then
            fail "0 条检查结果冒充了「全部合规」"
          fi
          echo "✓ 空区间如实说明「没有可校验的内容」，退出码仍为 0"

          # 3) 有效非空区间：合规 → 0，不合规 → 1。这段语义本次不改，
          #    钉住它是防止重写区间逻辑时把它一起带走。
          #    计数串只能断「共检查 N 条」「N 条不合规」两截：颜色转义码夹在中间，
          #    整句串（含「全部合规（共检查 1 条）」）匹配不上。
          set +e
          out="$(check --range HEAD~1..HEAD 2>&1)"
          code=$?
          set -e
          [[ "$code" -eq 0 ]] || fail "合规区间应退出码 0，实际 ${code}"
          grep -qF '全部合规' <<<"$out" || fail "合规区间未报「全部合规」"
          grep -qF '共检查 1 条' <<<"$out" || fail "合规区间未给出 1 条检查结果"

          set +e
          out="$(check --range HEAD~2..HEAD~1 2>&1)"
          code=$?
          set -e
          [[ "$code" -eq 1 ]] || fail "不合规区间应退出码 1，实际 ${code}"
          grep -qF '条不合规' <<<"$out" || fail "不合规区间未报「条不合规」"
          grep -qF '共检查 1 条' <<<"$out" || fail "不合规区间未给出 1 条检查结果"
          echo "✓ 有效区间行为不变（合规 0 / 不合规 1）"

          # 4) --message / --file 的退出码语义本次不动，但 CI 的 commit-messages job
          #    正是靠它们校验 PR 标题，一并钉住
          set +e
          out="$(check --message "feat: ok" 2>&1)"
          code=$?
          set -e
          [[ "$code" -eq 0 ]] || fail "--message 合规应退出码 0，实际 ${code}"
          set +e
          out="$(check --message "坏消息 没有类型" 2>&1)"
          code=$?
          set -e
          [[ "$code" -eq 1 ]] || fail "--message 不合规应退出码 1，实际 ${code}"
          printf '坏消息 没有类型\n' > "${work}/msg.txt"
          set +e
          out="$(check --file "${work}/msg.txt" 2>&1)"
          code=$?
          set -e
          [[ "$code" -eq 1 ]] || fail "--file 不合规应退出码 1，实际 ${code}"
          echo "✓ --message / --file 模式不受影响"

  # ---------------------------------------------------------------------------
  # 工作流安全扫描
  # zizmor 专查 GitHub Actions 的已知反模式：凭证持久化、危险触发器、
  # 依赖未锁定等。豁免项集中放在 .github/zizmor.yml，每条写明理由。
  # 容器按版本 pin（与 action 同一个思路：工具本身也是供应链的一环）。
  # ---------------------------------------------------------------------------
  zizmor:
    name: 工作流安全扫描
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 运行 zizmor
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          # 挂载只读（:ro）：扫描器没有理由改动被扫描的文件
          docker run --rm -v "$PWD":/repo:ro \
            ghcr.io/zizmorcore/zizmor:1.30.1 /repo --no-online-audits

  # ---------------------------------------------------------------------------
  # lint.sh 自测
  #
  # `scripts/lint.sh` 是 CI 里**被调用为零**的脚本——CI 自己跑 actionlint /
  # yamllint / shellcheck / zizmor 各有独立 job，lint.sh 只是给贡献者在本地用的
  # 入口。而它的职责恰恰是「**本地过 = CI 过**」：这条保证的上游一直没有保障。
  # 近两轮修的 #138（本地根本跑不起来）与 #133（本地太宽松）都出在它身上。
  #
  # 两条断言的方向**相反**，正对应那两个缺口：
  #   1. 非 git 目录下 actionlint 项不失败 —— 防「本地太严」
  #   2. 引入真实告警时会红      —— 防「本地太松」
  #
  # **不并入 smoke-test**：lint.sh 的 zizmor 那一项要 docker（与 CI 同一条命令），
  # 而 smoke-test 的设计前提是**不启容器**——那是那个 job 的性质，不该为一组新
  # 断言破坏它。
  # ---------------------------------------------------------------------------
  lint-selftest:
    name: lint.sh 自测
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 只读检查用不到 git 凭证，不持久化
          persist-credentials: false

      - name: 安装 actionlint
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          # 版本取 workflow 级的 ACTIONLINT_VERSION——与 actionlint job 同源，
          # 不另写一份（写死会漂移）
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL "$url" | tar -xz actionlint
          mkdir -p "$HOME/.local/bin"
          mv actionlint "$HOME/.local/bin/"
          # 后续步骤靠 PATH 找它。当前步骤看不到这个改动，所以先验证再放行
          "$HOME/.local/bin/actionlint" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: 非 git 目录下 lint.sh 仍能跑（#138 回归）
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 不含 .git 的副本 == GitHub 的 source tarball 解压出来的样子。
          # 此前 actionlint 裸跑要靠 .git 定位项目根，在这里必然报
          # 「no project was found」——使用者什么都没改，第一项就红。
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          tar -cf - --exclude=.git . | (cd "$work" && tar -xf -)
          [[ ! -d "$work/.git" ]] || { echo "::error::副本里还有 .git，用例无效"; exit 1; }

          set +e
          out="$(cd "$work" && ./scripts/lint.sh 2>&1)"
          set -e
          printf '%s\n' "$out"

          # **只断 actionlint 那一项，不断 lint.sh 的整体退出码。** 本 job 里
          # yamllint 未装、zizmor 要拉镜像，整体 rc 会随环境波动——拿它当判据
          # 会变成「对正确实现假报错」，与恒真断言一样不可信。
          if grep -qF 'no project was found' <<<"$out"; then
            echo "::error::非 git 目录下 actionlint 又去依赖 .git 了（#138 回归）"
            exit 1
          fi
          # 以**下一个 `▶ ` 行**为界，不以空行为界：`▶ ` 是 lint.sh 自己的分隔符，
          # 而空行取决于 actionlint 的输出格式——它今天不在错误块之间夹空行，但那是
          # 第三方行为，改以空行为界会在它变化时把 section 截断、误报成「失败的不是
          # actionlint 那一项」
          section="$(sed -n '/▶ actionlint（工作流静态检查）/,/^▶ /p' <<<"$out")"
          if [[ -z "$section" ]]; then
            echo "::error::输出里没有 actionlint 那一项，这条断言无从判断"
            exit 1
          fi
          # 正向要求「通过」，不是「没有失败」：这一项被跳过时打的是「⚠ 已跳过」，
          # 否定式判据会把「actionlint 根本没跑成」也算过——接口断了却显示绿的。
          if ! grep -qF '✓ 通过' <<<"$section"; then
            printf '%s\n' "$section"
            echo "::error::非 git 目录下 actionlint 项没有通过（#138 回归，或该项被跳过没跑成）"
            exit 1
          fi
          echo "✓ 非 git 目录下 actionlint 项通过（不再依赖 .git）"

      - name: 引入真实告警时 lint.sh 会红（#133 回归）
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 在**副本**里精确引入一个真实告警，不动工作区。
          # 用 actionlint 原生的表达式检查（而不是 SC2086）——后者要过 shellcheck，
          # 那是另一个工具的版本行为；前者是这个 job 里 actionlint 自己的判断。
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          tar -cf - --exclude=.git . | (cd "$work" && tar -xf -)

          target="$work/.github/workflows/history-trend.yml"
          # 用 -i.bak 而不是裸 -i：GNU sed 与 BSD sed 对裸 -i 的后续参数理解不同
          sed -i.bak 's/github\.actor/github.actr/' "$target"
          if ! grep -qF 'github.actr' "$target"; then
            echo "::error::变异没有生效，这条用例什么也没测"
            exit 1
          fi

          set +e
          out="$(cd "$work" && ./scripts/lint.sh 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out"

          if [[ "$rc" -eq 0 ]]; then
            echo "::error::工作流里有真实告警，lint.sh 却绿了（#133 回归）"
            exit 1
          fi
          # 红了还不够——要确认**红的原因就是 actionlint 那一项**，
          # 否则这条断言可能在「别的项恰好也失败」时通过
          # 以**下一个 `▶ ` 行**为界，不以空行为界：`▶ ` 是 lint.sh 自己的分隔符，
          # 而空行取决于 actionlint 的输出格式——它今天不在错误块之间夹空行，但那是
          # 第三方行为，改以空行为界会在它变化时把 section 截断、误报成「失败的不是
          # actionlint 那一项」
          section="$(sed -n '/▶ actionlint（工作流静态检查）/,/^▶ /p' <<<"$out")"
          if ! grep -qF '✗ 失败' <<<"$section"; then
            printf '%s\n' "$section"
            echo "::error::lint.sh 红了，但失败的不是 actionlint 那一项——断言指向了别的东西"
            exit 1
          fi
          echo "✓ 引入真实告警后 actionlint 项确实失败"

  # ---------------------------------------------------------------------------
  # 真实同步集成测试
  #
  # 与冒烟测试的关键区别：这里**真的会推送镜像**。
  #
  # v1.1.0 期间暴露的三个缺陷——跳过判定失效、目标地址携带 digest、结果文件
  # 字段错位——全部发生在真实推送路径上，而 dry-run 刻意绕开了那条路径，
  # 因此一个都抓不到。这个 job 用本地 registry 容器补上这段验证，
  # 不需要任何外部凭证。
  # ---------------------------------------------------------------------------
  integration-test:
    name: 真实同步集成测试
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # CI 用不到 git 凭证（推送走 docker 凭证），不持久化，
          # 让 checkout 之后的任何脚本都拿不到 GITHUB_TOKEN
          persist-credentials: false

      - name: 启动本地 registry
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          docker run -d -p 5000:5000 --name registry registry:2

          # 等 registry 就绪，最多 30 秒
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:5000/v2/ >/dev/null 2>&1; then
              echo "✓ 本地 registry 已就绪"
              exit 0
            fi
            sleep 1
          done

          echo "::error::本地 registry 启动超时"
          docker logs registry
          exit 1

      - name: 准备源镜像
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          # hello-world 极小，适合作为测试素材
          skopeo copy --dest-tls-verify=false \
            docker://docker.io/library/hello-world:latest \
            docker://localhost:5000/source/hello:latest

      - name: 首次同步（真实推送）
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          # 顺带走一遍 --verify 的真实路径：mock 只能证明判定逻辑正确，
          # 这里证明 inspect + 比对在真实 registry 上也能跑通
          output="$(./scripts/sync.sh \
            --src localhost:5000/source/hello:latest \
            --dest localhost:5000/dest \
            --tls-verify false --concurrency 1 --verify 2>&1)"
          echo "$output"

          if ! grep -q '校验通过' <<<"$output"; then
            echo "::error::开启 --verify 后未看到校验通过"
            exit 1
          fi
          echo "✓ 真实同步 + 校验通过"

          # 单目标没有中转的收益，必须保持常规路径
          if grep -q '本地中转' <<<"$output"; then
            echo "::error::单目标同步不应走本地中转"
            exit 1
          fi
          echo "✓ 单目标保持常规路径"

      - name: regctl 路径（--strip-attestation）的真实推送
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 这条路径此前只在 dry-run 与参数层面被测过。它与默认的 skopeo 路径是
          # 完全不同的实现（regctl index create 重建索引、逐平台复制），而项目自己
          # 记过：dry-run 覆盖不到真实推送，v1.1.0 的三个缺陷全部发生在那里。
          #
          # 源必须是**多平台索引**，否则「只保留指定平台」这条语义无从体现：
          # 上面那个 localhost:5000/source/hello:latest 由 `skopeo copy` 准备，
          # 而它的默认是 --multi-arch system——落到 registry 里是**单平台 manifest**，
          # 拿它测等于什么都没测。所以这里另备一份 --all 的索引。
          skopeo copy --all --dest-tls-verify=false \
            docker://docker.io/library/hello-world:latest \
            docker://localhost:5000/source/hello-multi:latest

          src_index="$(skopeo inspect --raw --tls-verify=false docker://localhost:5000/source/hello-multi:latest)"
          # 前置断言：源确实多平台。少了它，一旦源准备退化成单平台，下面两条断言
          # 会变成恒真——「验证过了」比「没验证」更容易让人放心地犯错。
          # 源若不是索引（单平台 manifest），这里数出来就是 0 个条目。
          src_platform_count="$(jq -r '[.manifests[]?.platform | "\(.os)/\(.architecture)"] | unique | length' <<<"$src_index")"
          if [[ "$src_platform_count" -lt 2 ]]; then
            echo "::error::源不是多平台索引（只识别到 ${src_platform_count} 个平台条目），本用例无法区分「过滤平台」与「原样搬运」"
            exit 1
          fi
          echo "✓ 源是多平台索引（${src_platform_count} 个平台）"

          # 不预装 regctl：脚本的 ensure_regctl 会自己从 GitHub release 下载到
          # $HOME/.regclient/bin——那本身也是被测代码，预装反而绕开了它。
          #
          # 这台本地 registry 是纯 HTTP，而 regctl 默认走 HTTPS（与 skopeo 不同，
          # 它不会「TLS 失败就退回 HTTP」）。此处原先要手工写一份
          # `~/.regctl/config.json` 把 host 标成 `tls: disabled`——**那一步之所以
          # 存在，正是 Issue #120 的证据**：sync.sh 当时没把 --tls-verify 传给 regctl。
          # 现在由脚本自己注入 `--host reg=…,tls=disabled`，所以这里不再需要它。
          #
          # 反过来断言它不存在：一旦有人（或某段遗留代码）又放一份这样的配置，
          # 它就会替脚本兜底，让本用例即使把 --tls-verify 传丢了也照样通过。
          # 缺了这条断言，「测试通过」反而会掩盖缺陷——比没有测试更糟。
          if [[ -f "${HOME}/.regctl/config.json" ]]; then
            echo "::error::存在 ~/.regctl/config.json，它会替脚本兜底，使本用例无法证明 --tls-verify 真的传到了 regctl"
            exit 1
          fi

          # 失败时必须把 sync.sh 的输出打出来。它被 $() 捕获，若只靠 set -e 退出，
          # CI 日志里只会剩一个退出码——连失败在「regctl 下载」「自签 TLS」
          # 还是「平台不符」上都看不出来，而这条路径恰恰是最容易出环境问题的一条。
          if ! output="$(./scripts/sync.sh \
            --src localhost:5000/source/hello-multi:latest \
            --dest localhost:5000/dest-regctl \
            --strip-attestation --platforms linux/amd64 \
            --tls-verify false --concurrency 1 2>&1)"; then
            echo "$output"
            echo "::error::regctl 路径同步失败，详见上方输出"
            exit 1
          fi
          echo "$output"

          dest="localhost:5000/dest-regctl/localhost_5000_source_hello-multi:latest"
          raw="$(skopeo inspect --raw --tls-verify=false "docker://${dest}")" || {
            echo "::error::regctl 路径的目标镜像不存在：${dest}"; exit 1; }

          # 断言一：产物是**索引**，且平台集合**恰好**是指定的那个。
          # 这是 regctl 路径区别于 skopeo 路径的核心语义——同一个多平台的源，
          # skopeo 会原样搬运整个索引，regctl 只保留列出的平台。
          platforms="$(jq -r '.manifests[]?.platform | "\(.os)/\(.architecture)"' <<<"$raw" | sort | tr '\n' ' ')"
          if [[ "$platforms" != "linux/amd64 " ]]; then
            echo "::error::regctl 路径的平台集合应为「linux/amd64」，实际为「${platforms}」"
            exit 1
          fi

          # 断言二：产物与源**必然不同**。重建索引意味着 digest 不会与源相同——
          # 若相同，说明它其实走的是原样搬运（skopeo）那条路。
          # 只断言「推送成功」是不够的：skopeo 路径同样会成功。
          src_sum="$(openssl dgst -sha256 <<<"$src_index" | awk '{print $NF}')"
          dest_sum="$(openssl dgst -sha256 <<<"$raw" | awk '{print $NF}')"
          if [[ "$src_sum" == "$dest_sum" ]]; then
            echo "::error::目标与源摘要相同——说明没有重建索引，走的不是 regctl 路径"
            exit 1
          fi

          echo "✓ regctl 路径真实推送成功：索引只含指定的平台，且与源摘要不同"

      - name: 断言目标存在且内容与源一致
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          dest="localhost:5000/dest/localhost_5000_source_hello:latest"

          if ! skopeo inspect --tls-verify=false "docker://${dest}" >/dev/null 2>&1; then
            echo "::error::目标镜像不存在：${dest}"
            exit 1
          fi

          src_sum="$(skopeo inspect --raw --tls-verify=false docker://localhost:5000/source/hello:latest | openssl dgst -sha256 | awk '{print $NF}')"
          dest_sum="$(skopeo inspect --raw --tls-verify=false "docker://${dest}" | openssl dgst -sha256 | awk '{print $NF}')"

          if [[ "$src_sum" != "$dest_sum" ]]; then
            echo "::error::源与目标内容不一致（${src_sum} != ${dest_sum}）"
            exit 1
          fi
          echo "✓ 目标存在，且内容与源完全一致"

      - name: 锁文件校验应识别「一致」与「上游已删除」
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 用与 --write-lock 完全相同的口径（compute_digest = 顶层 manifest
          # digest）为当前源镜像生成一条锁定记录
          src_digest="sha256:$(skopeo inspect --raw --tls-verify=false docker://localhost:5000/source/hello:latest | openssl dgst -sha256 | awk '{print $NF}')"
          # 固定路径：同 job 的后续步骤要复用这份锁文件（shell 变量跨 run: 不延续）
          lockfile="/tmp/audit-lock-match.lock"
          {
            echo "localhost:5000/source/hello:latest@${src_digest}"
            echo "localhost:5000/never-existed:v1@sha256:$(printf 'na'| openssl dgst -sha256 | awk '{print $NF}')"
          } > "$lockfile"

          # 两条都在 → 第一条一致、第二条上游已删除 → 漂移，退出码 2
          set +e
          out="$(./scripts/sync.sh --audit-lock "$lockfile" --tls-verify false 2>&1)"
          code=$?
          set -e
          echo "$out"
          if [[ "$code" -ne 2 ]]; then
            echo "::error::锁文件含上游已删除的条目，应以退出码 2 结束（实际 ${code}）"
            exit 1
          fi
          if ! grep -q '✓ 一致' <<<"$out"; then
            echo "::error::与源一致的条目未被报为「一致」"
            exit 1
          fi
          if ! grep -q '上游已删除该 tag' <<<"$out"; then
            echo "::error::上游不存在的条目未被报为「漂移（上游已删除）」"
            exit 1
          fi
          echo "✓ 一致与上游已删除均正确分类"

          # 只留一致的那条 → 退出码 0。这条同时证明「一致」来自真实比对，
          # 不是无脑放行
          grep 'hello:latest@' "$lockfile" > /tmp/audit-lock-match-only.lock
          set +e
          out="$(./scripts/sync.sh --audit-lock /tmp/audit-lock-match-only.lock --tls-verify false 2>&1)"
          code=$?
          set -e
          echo "$out"
          if [[ "$code" -ne 0 ]] || ! grep -q '条与锁定的一致' <<<"$out"; then
            echo "::error::锁定的 digest 仍与上游一致时，应以退出码 0 结束（实际 ${code}）"
            exit 1
          fi
          echo "✓ 锁定仍有效时报一致、退出码 0"


      - name: 再次同步应被跳过
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          output="$(./scripts/sync.sh \
            --src localhost:5000/source/hello:latest \
            --dest localhost:5000/dest \
            --tls-verify false --skip-existing 2>&1)"
          echo "$output"

          # 这正是 #13 要防住的回归：跳过判定曾因多层原因完全失效
          if ! grep -q '跳过 1 个' <<<"$output"; then
            echo "::error::第二次同步未被跳过，增量同步已失效"
            exit 1
          fi
          echo "✓ 增量跳过生效"

      - name: 审计应区分「最新」「缺失」「无法判定」
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 1) 目标已同步且与源一致 → 最新，退出码 0
          set +e
          out="$(./scripts/sync.sh \
            --src localhost:5000/source/hello:latest \
            --dest localhost:5000/dest \
            --tls-verify false --audit 2>&1)"
          code=$?
          set -e
          echo "$out"
          if [[ "$code" -ne 0 ]]; then
            echo "::error::目标与源一致，审计却以退出码 ${code} 结束"
            exit 1
          fi
          # 断言一律匹配报告正文行（带状态图标），不要只 grep 状态词本身——
          # 汇总行「最新 0 ｜ 落后 0 ｜ 缺失 0」里这几个词永远都在，
          # 拿关键词直接匹配等于断言恒真，第一版就是这么写错的
          if ! grep -q '条全部最新' <<<"$out" || ! grep -q '✓ 最新' <<<"$out"; then
            echo "::error::审计未报出「全部最新」"
            exit 1
          fi
          echo "✓ 一致时报最新、退出码 0"

          # 2) 目标仓库里没有这个镜像 → 缺失，退出码 2
          set +e
          out="$(./scripts/sync.sh \
            --src localhost:5000/source/hello:latest \
            --dest localhost:5000/never-synced \
            --tls-verify false --audit 2>&1)"
          code=$?
          set -e
          echo "$out"
          if [[ "$code" -ne 2 ]] || ! grep -q '✗ 缺失' <<<"$out"; then
            echo "::error::目标不存在时，审计应报「缺失」并以退出码 2 结束（实际 ${code}）"
            exit 1
          fi
          echo "✓ 目标不存在时报缺失、退出码 2"

          # 3) 源本身就取不到 → 无法判定，**不能**报成「缺失」。
          # 这是 --audit 最要紧的一条分类原则：把「查不到」说成「缺失」，
          # 会让人跑去同步一个根本同步不下来的镜像。
          set +e
          out="$(./scripts/sync.sh \
            --src localhost:5000/nope/nothing:latest \
            --dest localhost:5000/dest \
            --tls-verify false --audit 2>&1)"
          set -e
          echo "$out"
          if ! grep -q '? 无法判定' <<<"$out"; then
            echo "::error::源不可达时，审计未报出「无法判定」"
            exit 1
          fi
          if grep -q '✗ 缺失' <<<"$out"; then
            echo "::error::源不可达被误报成「缺失」——「无法判定」的分类原则被破坏"
            exit 1
          fi
          echo "✓ 源不可达时报无法判定，未误报为缺失"

      - name: 上游版本检查（--check-updates）
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 往源仓库多推一个 tag，制造「上游有、清单没有」的真实现场
          skopeo copy --dest-tls-verify=false \
            docker://docker.io/library/hello-world:latest \
            docker://localhost:5000/source/hello:v2

          set +e
          out="$(./scripts/sync.sh \
            --src localhost:5000/source/hello:latest \
            --check-updates --tls-verify false 2>&1)"
          code=$?
          set -e
          echo "$out"

          if [[ "$code" -ne 2 ]]; then
            echo "::error::上游存在未收录的 tag，退出码应为 2，实际为 ${code}"
            exit 1
          fi
          if ! grep -q 'v2' <<<"$out"; then
            echo "::error::未报出清单之外的上游 tag v2"
            exit 1
          fi
          echo "✓ 报出了上游未收录的 tag"

          # 清单补上 v2 后应报「已覆盖」并以 0 结束——这条才是关键：
          # 它证明「未收录」来自与清单的真实差异，而不是无脑列出上游所有 tag
          set +e
          out="$(./scripts/sync.sh \
            --src localhost:5000/source/hello:latest,localhost:5000/source/hello:v2 \
            --check-updates --tls-verify false 2>&1)"
          code=$?
          set -e
          echo "$out"

          if [[ "$code" -ne 0 ]] || ! grep -q '已覆盖' <<<"$out"; then
            echo "::error::清单已包含全部上游 tag，应报「已覆盖」并以 0 结束（实际 ${code}）"
            exit 1
          fi
          echo "✓ 清单覆盖后报「已覆盖」、退出码 0"

      - name: 源内容变化后应重新同步
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 用另一个镜像覆盖同一个 tag，内容随之改变
          skopeo copy --dest-tls-verify=false \
            docker://docker.io/library/alpine:latest \
            docker://localhost:5000/source/hello:latest

          # 趁这个真实的不一致现场验证 --audit 能把它认出来：
          # mock 只能证明判定逻辑正确，这里证明它在真实 registry 上跑得通
          set +e
          audit_out="$(./scripts/sync.sh \
            --src localhost:5000/source/hello:latest \
            --dest localhost:5000/dest \
            --tls-verify false --audit 2>&1)"
          audit_code=$?
          set -e
          echo "$audit_out"

          if [[ "$audit_code" -ne 2 ]] || ! grep -q '⚠ 落后' <<<"$audit_out"; then
            echo "::error::源内容已变化，审计应报「落后」并以退出码 2 结束（实际 ${audit_code}）"
            exit 1
          fi
          echo "✓ 审计发现目标落后"

          output="$(./scripts/sync.sh \
            --src localhost:5000/source/hello:latest \
            --dest localhost:5000/dest \
            --tls-verify false --skip-existing 2>&1)"
          echo "$output"

          if ! grep -q '成功 1 个' <<<"$output"; then
            echo "::error::源内容已变化却仍被跳过，跳过判定过于宽松"
            exit 1
          fi
          echo "✓ 内容变化后正确重新同步"

          # 同一份锁文件，上游 tag 被重新构建覆盖后应转为「漂移」——
          # 这正是 --audit-lock 要抓的现场：锁文件没变，上游变了
          set +e
          out="$(./scripts/sync.sh --audit-lock /tmp/audit-lock-match-only.lock --tls-verify false 2>&1)"
          code=$?
          set -e
          echo "$out"
          if [[ "$code" -ne 2 ]] || ! grep -q '⚠ 漂移' <<<"$out"; then
            echo "::error::上游覆盖 tag 后，锁文件校验应报「漂移」并以退出码 2 结束（实际 ${code}）"
            exit 1
          fi
          echo "✓ 上游覆盖 tag 后锁文件校验报漂移"

      - name: 多目标同步
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 同一个源同时推送到两个目标。两个目标都需要推送，
          # 会走本地 OCI 中转——源只拉取一次，这是多目标的默认行为。
          # 注意 set +e 包裹：sync.sh 有失败时退出码非 0，而 output="$(…)"
          # 的退出码就是它的退出码，errexit 会在这里直接中断步骤、
          # 吞掉全部输出——排查时只剩一句 exit code 1。
          set +e
          output="$(./scripts/sync.sh \
            --src localhost:5000/source/hello:latest \
            --dest localhost:5000/mirror-a \
            --dest localhost:5000/mirror-b \
            --tls-verify false --concurrency 1 2>&1)"
          sync_code=$?
          set -e
          echo "$output"

          if [[ "$sync_code" -ne 0 ]]; then
            echo "::error::多目标中转同步失败（退出码 ${sync_code}），输出见上"
            exit 1
          fi

          if ! grep -q '源已拉取到本地中转' <<<"$output"; then
            echo "::error::多目标同步未走本地中转（源被多次拉取）"
            exit 1
          fi
          echo "✓ 多目标走了本地中转（源只拉取一次）"

          # 两个目标都应存在——多目标最容易出的问题是「只推了第一个」。
          # 中转改写了推送路径，更要确认每个目标的内容都完整。
          for repo in mirror-a mirror-b; do
            dest="localhost:5000/${repo}/localhost_5000_source_hello:latest"
            if ! skopeo inspect --tls-verify=false "docker://${dest}" >/dev/null 2>&1; then
              echo "::error::多目标同步后 ${repo} 中缺少镜像：${dest}"
              exit 1
            fi
            echo "✓ ${repo} 中存在目标镜像"
          done

          # 中转推送的内容必须与源一致（逐目标比对平台摘要）
          output="$(./scripts/sync.sh \
            --src localhost:5000/source/hello:latest \
            --dest localhost:5000/mirror-a \
            --tls-verify false --skip-existing 2>&1)"
          if ! grep -q '目标已是最新' <<<"$output"; then
            echo "::error::中转推送的内容与源不一致（增量跳过未生效）"
            exit 1
          fi
          echo "✓ 中转推送内容与源一致"

      - name: 每个目标各用各的命名规则
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 一次运行推往两个目标：一个压平、一个保留路径。这正是
          # 「阿里云给国内集群（个人版不支持多级路径）+ Harbor 做归档」的组合。
          set +e
          out="$(./scripts/sync.sh \
            --src localhost:5000/source/hello:latest \
            --dest localhost:5000/flat-dest \
            --dest-keep-path localhost:5000/keep-dest \
            --tls-verify false --concurrency 1 2>&1)"
          code=$?
          set -e
          echo "$out"

          if [[ "$code" -ne 0 ]]; then
            echo "::error::混合命名规则的多目标同步失败（退出码 ${code}），输出见上"
            exit 1
          fi

          flat="localhost:5000/flat-dest/localhost_5000_source_hello:latest"
          # 保留路径目标：层级结构还在，只有端口那一段压成了下划线
          keep="localhost:5000/keep-dest/localhost_5000/source/hello:latest"

          for dest in "$flat" "$keep"; do
            if ! skopeo inspect --tls-verify=false "docker://${dest}" >/dev/null 2>&1; then
              echo "::error::目标镜像不存在：${dest}"
              exit 1
            fi
            echo "✓ 已推送：${dest}"
          done

          # 两个目标的地址必须真的不同——规则接错时它们会撞到同一个地址，
          # 表面上「同步成功」，实际只推了一份
          if [[ "$flat" == "$keep" ]]; then
            echo "::error::压平与保留路径生成了相同的目标地址"
            exit 1
          fi
          echo "✓ 两套命名规则各自生效"

      - name: 体检结果的通知真的发得出去
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 起一个只收 POST 的假 webhook。通知这条路径此前只有「提取函数 + mock」
          # 的单元测试，端到端从没跑过——类型识别、jq 组装、curl 调用、结果判断
          # 这几段串起来是什么样，只有真发一次才知道。
          cat > /tmp/hook.py <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer


          class H(BaseHTTPRequestHandler):
              def do_POST(self):
                  n = int(self.headers.get('Content-Length', 0))
                  with open('/tmp/hook-payload.json', 'wb') as f:
                      f.write(self.rfile.read(n))
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b'ok')

              def log_message(self, *a):
                  pass


          HTTPServer(('127.0.0.1', 8899), H).serve_forever()
          PY
          rm -f /tmp/hook-payload.json
          python3 /tmp/hook.py &
          hook_pid=$!
          trap 'kill "$hook_pid" 2>/dev/null || true' EXIT
          sleep 2

          # 目标仓库里没有这个镜像 → 审计报「缺失」→ 有需要关注的项 → 应当通知
          set +e
          ./scripts/sync.sh \
            --src localhost:5000/source/hello:latest \
            --dest localhost:5000/definitely-absent \
            --tls-verify false --audit \
            --notify-webhook http://127.0.0.1:8899/hook --notify-type generic 2>&1
          set -e

          if [[ ! -s /tmp/hook-payload.json ]]; then
            echo "::error::审计发现差异时未发送通知"
            exit 1
          fi
          if ! grep -q '缺失' /tmp/hook-payload.json; then
            echo "::error::通知发出去了但内容里没有结论（「缺失」）"
            cat /tmp/hook-payload.json
            exit 1
          fi
          echo "✓ 有差异时通知发出，且内容包含结论"

          # --notify-on failure + 全绿 → 不该打扰
          rm -f /tmp/hook-payload.json
          set +e
          ./scripts/sync.sh \
            --src localhost:5000/source/hello:latest \
            --dest localhost:5000/dest \
            --tls-verify false --audit --notify-on failure \
            --notify-webhook http://127.0.0.1:8899/hook --notify-type generic 2>&1
          set -e

          if [[ -e /tmp/hook-payload.json ]]; then
            echo "::error::全绿时不该打扰，却收到了通知"
            exit 1
          fi
          echo "✓ 全绿时按 --notify-on failure 保持安静"

      - name: 验证同步模式的 --notify-on failure 门禁（真实推送）
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 「要不要发通知」有两个**不同的判据**，分居两处实现：
          #   send_check_notification 判 attention（检查模式：存在落后 / 缺失 / 无法判定）
          #   send_notification       判 fail     （同步模式：失败数）
          # 检查模式那一处已在「体检结果的通知真的发得出去」里端到端测过；同步模式这一处
          # 此前**一次都没跑过**——而它是全部断言里唯一一条「该响的时候不响」：条件写反，
          # 失败的运行会彻底静默，没有任何人收到通知，而 CI 依旧全绿。
          #
          # 三个用例，前两个之间只差**一个变量**（--notify-on）：
          #   ① 对照：真实全绿 + always   → 必须收到（证明这条通路此刻是活的）
          #   ② (a)：真实全绿 + failure   → 必须安静
          #   ③ (b)：真实失败 + failure   → 必须收到
          # ① 是给 ② 用的：没有它，「没收到」与「根本没接通」长得一模一样——正是本仓库
          # 记过的「负向判据几乎总是恒真」。
          #
          # ③ 不能加 --dry-run：干跑不发送通知（它没真的搬过任何东西），那会让「必须响」
          # 这条永远落在「本来就不发」上，断言等于没写。
          fail() { echo "::error::$1"; exit 1; }

          # 端口是 job 内共享的资源：8899 已被「体检结果的通知真的发得出去」占用，这里另起 8898
          hook_port=8898
          payload=/tmp/sync-notify-payload.json
          sync_out=/tmp/sync-notify-out.txt

          cat > /tmp/sync-notify-hook.py <<'PY'
          import os
          from http.server import BaseHTTPRequestHandler, HTTPServer


          class H(BaseHTTPRequestHandler):
              def do_POST(self):
                  n = int(self.headers.get('Content-Length', 0))
                  with open(os.environ['HOOK_PAYLOAD'], 'wb') as f:
                      f.write(self.rfile.read(n))
                  self.send_response(200)
                  self.end_headers()

              def log_message(self, *a):
                  pass


          HTTPServer(('127.0.0.1', int(os.environ['HOOK_PORT'])), H).serve_forever()
          PY

          HOOK_PAYLOAD="$payload" HOOK_PORT="$hook_port" python3 /tmp/sync-notify-hook.py &
          hook_pid=$!
          trap 'kill "$hook_pid" 2>/dev/null || true' EXIT

          tries=0
          while [[ "$tries" -lt 20 ]]; do
            if curl -sS -o /dev/null --max-time 1 "http://127.0.0.1:${hook_port}/hook" 2>/dev/null; then
              break
            fi
            tries=$((tries + 1))
            sleep 0.25
          done
          [[ "$tries" -lt 20 ]] || fail "假 webhook 没起来（端口 ${hook_port}）"

          # 每次运行前清掉上一份——否则「这一次没发」会被上一份文件冒充成「发了」，
          # 而下面几条断言看的正是那个文件
          run_sync() {
            rm -f "$payload"
            set +e
            ./scripts/sync.sh "$@" \
              --notify-webhook "http://127.0.0.1:${hook_port}/hook" --notify-type generic \
              > "$sync_out" 2>&1
            sync_rc=$?
            set -e
          }
          sync_rc=0

          # --- ① 对照：真实全绿 + --notify-on always（默认）→ 必须收到 ---
          run_sync --src localhost:5000/source/hello:latest --dest localhost:5000/dest-notify-a \
            --tls-verify false --notify-on always
          [[ "$sync_rc" -eq 0 ]] || { cat "$sync_out"; fail "对照用例的同步本身没成功（退出码 ${sync_rc}）"; }
          grep -qF '同步完成：共 1 个镜像，成功 1 个，跳过 0 个，失败 0 个' "$sync_out" \
            || { cat "$sync_out"; fail "对照用例不是一次全绿的同步（正文与判据不符）"; }
          [[ -s "$payload" ]] || { cat "$sync_out"; fail "全绿 + always 未收到通知（通路根本没接通，下面两条就都失去意义了）"; }
          jq -e '(.text | contains("共 **1** 个镜像 ｜ 成功 1 ｜ 跳过 0 ｜ 失败 0"))' "$payload" >/dev/null \
            || { cat "$payload"; fail "全绿的通知正文与运行结果不符"; }
          echo "✓ ① 全绿 + always → 收到通知，通路是活的"

          # --- ② (a)：真实全绿 + --notify-on failure → 必须安静 ---
          run_sync --src localhost:5000/source/hello:latest --dest localhost:5000/dest-notify-a \
            --tls-verify false --notify-on failure
          # 先正向钉住「这次真的跑成了一次全绿运行」：只断「没收到」时，一次没跑起来的
          # 调用（参数被拒、源没了）同样不发送，负向判据照样绿
          [[ "$sync_rc" -eq 0 ]] || { cat "$sync_out"; fail "全绿用例的同步没成功（退出码 ${sync_rc}）"; }
          grep -qF '同步完成：共 1 个镜像，成功 1 个，跳过 0 个，失败 0 个' "$sync_out" \
            || { cat "$sync_out"; fail "全绿用例的实际结果不是全绿（正文与判据不符）"; }
          [[ ! -e "$payload" ]] \
            || { cat "$payload"; fail "全绿时按 --notify-on failure 不该发送，却收到了通知"; }
          echo "✓ ② 全绿 + --notify-on failure → 保持安静"

          # --- ③ (b)：真实失败 + --notify-on failure → 必须收到 ---
          # 源在真实 registry 上不存在：这是 registry 明确回答的 404，不是网络故障
          run_sync --src localhost:5000/nope/nothing:latest --dest localhost:5000/dest-notify-b \
            --tls-verify false --notify-on failure
          [[ "$sync_rc" -eq 2 ]] || { cat "$sync_out"; fail "失败用例的退出码应为 2，实际 ${sync_rc}"; }
          grep -qF '同步完成：共 1 个镜像，成功 0 个，跳过 0 个，失败 1 个' "$sync_out" \
            || { cat "$sync_out"; fail "失败用例的实际结果不是「失败 1 个」（正文与判据不符）"; }
          [[ -s "$payload" ]] \
            || { cat "$sync_out"; fail "有失败却按 --notify-on failure 静默了——这正是「该响的时候不响」的缺陷形态"; }
          jq -e '(.text | contains("共 **1** 个镜像 ｜ 成功 0 ｜ 跳过 0 ｜ 失败 1"))
                    and (.text | contains("### 失败详情"))' "$payload" >/dev/null \
            || { cat "$payload"; fail "失败通知的正文里没有失败详情"; }
          echo "✓ ③ 失败 + --notify-on failure → 发出通知，且正文含失败详情"

      # -----------------------------------------------------------------------
      # 私有源：走到认证这条真实路径上
      #
      # 前面所有步骤用的都是匿名 registry，凭证相关的代码一次都没被执行过。
      # 这里起一个需要 htpasswd 认证的 registry，验证三件事：
      # 无凭证确实会失败、有凭证确实能成功、凭证不出现在日志里。
      # -----------------------------------------------------------------------
      - name: 启动需要认证的源 registry
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # registry 的 htpasswd 认证只认 bcrypt。openssl 只能生成 apr1，
          # 用它写出的密码文件会让每一次登录都失败——而且失败得毫无线索。
          sudo apt-get install -y -qq apache2-utils

          mkdir -p /tmp/registry-auth
          htpasswd -Bbn testuser 's3cr3t-pass' > /tmp/registry-auth/htpasswd

          docker run -d -p 5001:5000 --name registry-auth \
            -v /tmp/registry-auth:/auth \
            -e REGISTRY_AUTH=htpasswd \
            -e REGISTRY_AUTH_HTPASSWD_REALM=Registry-Realm \
            -e REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd \
            registry:2

          for _ in $(seq 1 30); do
            # 401 正是「服务已就绪且鉴权生效」的标志——这里期望的就是匿名被拒
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5001/v2/ || true)"
            if [[ "$code" == "401" ]]; then
              echo "✓ 认证 registry 已就绪（匿名访问被拒）"
              exit 0
            fi
            sleep 1
          done

          echo "::error::认证 registry 启动超时"
          docker logs registry-auth
          exit 1

      - name: 推送一个镜像作为私有源
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          skopeo copy --dest-tls-verify=false \
            --dest-creds 'testuser:s3cr3t-pass' \
            docker://docker.io/library/hello-world:latest \
            docker://localhost:5001/private/hello:latest

      - name: 未提供凭证时应失败
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          set +e
          ./scripts/sync.sh \
            --src localhost:5001/private/hello:latest \
            --dest localhost:5000/from-private \
            --tls-verify false --concurrency 1 >/dev/null 2>&1
          code=$?
          set -e

          if [[ "$code" -ne 2 ]]; then
            echo "::error::未提供凭证时同步私有镜像应失败（期望退出码 2，实际 ${code}）"
            exit 1
          fi
          echo "✓ 无凭证时正确失败，没有假装成功"

      - name: 提供凭证后应成功，且凭证不落日志
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          output="$(./scripts/sync.sh \
            --src localhost:5001/private/hello:latest \
            --dest localhost:5000/from-private \
            --tls-verify false --concurrency 1 \
            --src-username testuser --src-password 's3cr3t-pass' 2>&1)"
          echo "$output"

          if ! grep -q '成功 1 个' <<<"$output"; then
            echo "::error::提供凭证后仍未同步成功"
            exit 1
          fi
          echo "✓ 私有源同步成功"

          # 这两条是硬约束：凭证一旦进了日志就等于泄露，
          # 而 Actions 日志是留存 90 天、对仓库协作者可见的。
          if grep -q 's3cr3t-pass' <<<"$output"; then
            echo "::error::密码出现在了日志中"
            exit 1
          fi
          if grep -q 'testuser' <<<"$output"; then
            echo "::error::用户名出现在了日志中"
            exit 1
          fi
          echo "✓ 日志中不含凭证"

          dest="localhost:5000/from-private/localhost_5001_private_hello:latest"
          if ! skopeo inspect --tls-verify=false "docker://${dest}" >/dev/null 2>&1; then
            echo "::error::目标镜像不存在：${dest}"
            exit 1
          fi
          echo "✓ 目标镜像已真实存在于 registry 中"

      - name: regctl 路径的私有源凭证
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 上面几条私有源用例走的都是默认的 skopeo 路径。这条补上 regctl 路径
          # ——Issue #120 之前，那里的源凭证根本没传到 regctl（它不认
          # --src-authfile，而脚本也没有别的入口给它）。
          #
          # 复用上面那个需要认证的 registry，**不另起容器**：另起会与它抢同一个
          # 容器名与 5001 端口（真撞过一次，两条用例都红）。
          #
          # 源换成多平台索引：上面的 private/hello 是 skopeo 单平台副本，拿它测
          # 「只保留指定平台」等于什么都没测。
          skopeo copy --all --src-tls-verify=false \
            --dest-tls-verify=false --dest-creds='testuser:s3cr3t-pass' \
            docker://localhost:5000/source/hello-multi:latest \
            docker://localhost:5001/private/hello-multi:latest

          # 前置断言：不带凭证必须失败。少了它，「带凭证成功」在源恰好匿名可读时
          # 同样会通过——恒真的断言比没有断言更糟，它让人以为验过了。
          if output="$(./scripts/sync.sh \
            --src localhost:5001/private/hello-multi:latest \
            --dest localhost:5000/dest-nocred \
            --strip-attestation --platforms linux/amd64 \
            --tls-verify false --concurrency 1 2>&1)"; then
            echo "$output"
            echo "::error::regctl 路径下私有源不带凭证竟然同步成功——源不是私有的，或凭证没有被校验"
            exit 1
          fi
          echo "✓ 不带凭证时按预期失败（源确实是私有的，下面那条才成立）"

          # 正题：带上源凭证应当成功。修复前这条必然失败——regctl 拿不到
          # SRC_AUTHFILE，会以 no credentials available: unauthorized 收场。
          if ! output="$(./scripts/sync.sh \
            --src localhost:5001/private/hello-multi:latest \
            --dest localhost:5000/dest-cred \
            --strip-attestation --platforms linux/amd64 \
            --src-username testuser --src-password 's3cr3t-pass' \
            --tls-verify false --concurrency 1 2>&1)"; then
            echo "$output"
            echo "::error::regctl 路径下私有源带凭证仍然失败——源凭证没有传到 regctl"
            exit 1
          fi
          echo "$output"

          # 凭证同样不得进日志。这条要单独确认：regctl 路径经的是临时
          # DOCKER_CONFIG 目录，与 skopeo 的 --src-authfile 不是同一条通路。
          if grep -q 's3cr3t-pass' <<<"$output"; then
            echo "::error::密码出现在了日志中（regctl 路径）"
            exit 1
          fi
          echo "✓ 日志中不含凭证"

          dest="localhost:5000/dest-cred/localhost_5001_private_hello-multi:latest"
          if ! skopeo inspect --tls-verify=false "docker://${dest}" >/dev/null 2>&1; then
            echo "::error::regctl 路径私有源用例的目标镜像不存在：${dest}"
            exit 1
          fi
          echo "✓ 私有源凭证在 regctl 路径生效"

  # ---------------------------------------------------------------------------
  # 提交信息规范
  # 只在 PR 上跑（push 到 main 的提交已经过 PR 校验）。
  # squash merge 后 PR 标题会成为提交信息，所以标题也要一并校验。
  # ---------------------------------------------------------------------------
  commit-messages:
    name: 提交信息规范
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Repos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # CI 用不到 git 凭证（推送走 docker 凭证），不持久化，
          # 让 checkout 之后的任何脚本都拿不到 GITHUB_TOKEN
          persist-credentials: false
          # 需要完整的提交历史才能校验区间内的所有提交
          fetch-depth: 0

      - name: 校验 PR 中的提交信息
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/check-commit-msg.sh --range "${BASE_SHA}..${HEAD_SHA}"

      - name: 校验 PR 标题
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: ./scripts/check-commit-msg.sh --message "$PR_TITLE"

  # ---------------------------------------------------------------------------
  # CI 总览
  # 把所有检查汇总成一个结果，分支保护规则只需要盯这一个 check 即可。
  # ---------------------------------------------------------------------------
  ci-summary:
    name: CI 总览
    runs-on: ubuntu-latest
    needs: [actionlint, yamllint, shellcheck, zizmor, lint-selftest, smoke-test, integration-test, commit-messages]
    if: always()
    steps:
      - name: 汇总各检查结果
        env:
          R_ACTIONLINT: ${{ needs.actionlint.result }}
          R_YAMLLINT: ${{ needs.yamllint.result }}
          R_SHELLCHECK: ${{ needs.shellcheck.result }}
          R_ZIZMOR: ${{ needs.zizmor.result }}
          R_LINTSELFTEST: ${{ needs.lint-selftest.result }}
          R_SMOKE: ${{ needs.smoke-test.result }}
          R_INTEGRATION: ${{ needs.integration-test.result }}
          R_COMMITS: ${{ needs.commit-messages.result }}
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # names 与 results 靠下标对齐：增删一项必须两边同时改，且与上面
          # 的 needs 顺序一致（否则那一项的失败不会让本 job 变红——CI 总览
          # 是分支保护唯一勾选的检查，漏一项等于它失败了也能合并）。
          declare -a names=(工作流静态检查 YAML风格检查 Shell脚本检查 工作流安全扫描 "lint.sh 自测" 冒烟测试 集成测试 提交信息规范)
          declare -a results=("$R_ACTIONLINT" "$R_YAMLLINT" "$R_SHELLCHECK" "$R_ZIZMOR" "$R_LINTSELFTEST" "$R_SMOKE" "$R_INTEGRATION" "$R_COMMITS")

          # names 与 results 必须一一对应。这不是防御性编程——加 lint-selftest 时
          # 真实漏过：只往 needs 里加了那一项，names / results 两处都没加，于是它
          # **不进判据**，而 CI 总览是分支保护唯一勾选的检查——漏一项就等于那一项
          # 失败了也能合并，且界面上完全看不出来（汇总表少一行而已）。
          #
          # **只断这两个数组**，不去读 ci.yml 校验 needs：本 job 没有 checkout
          # （它只读 needs.*.result，不需要仓库文件），一读就是 No such file。
          # needs 与它们的对应关系靠上面那行注释约束——那是「改一处」的清单，
          # 而这里兜住的是「改了 needs 却忘了改数组」这个真实发生过的形态。
          if [[ ${#names[@]} -ne ${#results[@]} ]]; then
            echo "::error::names（${#names[@]} 项）与 results（${#results[@]} 项）长度不一致——有检查项不会进判据"
            exit 1
          fi

          failed=0

          {
            echo "## CI 检查结果"
            echo ""
            echo "| 检查项 | 结果 |"
            echo "| --- | :---: |"
          } >> "$GITHUB_STEP_SUMMARY"

          for i in "${!names[@]}"; do
            case "${results[$i]}" in
              success) icon="✅" ;;
              skipped) icon="⏭️" ;;   # PR 之外的触发方式会跳过提交信息检查，属于正常
              *)       icon="❌"; failed=1 ;;
            esac
            printf '| %s | %s |\n' "${names[$i]}" "$icon" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$failed" -ne 0 ]]; then
            echo "❌ 存在未通过的检查，请查看上方各任务的日志。" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::CI 未能全部通过"
            exit 1
          fi

          echo "✅ 全部检查通过。" >> "$GITHUB_STEP_SUMMARY"
