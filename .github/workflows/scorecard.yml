# 工作流名称
name: Scorecard supply-chain security
# 工作流运行时显示名称
run-name: OSSF Scorecard 供应链安全评分

# 怎样触发工作流
on:
  # 维护分支保护规则时重新评分
  branch_protection_rule:
  # 每周六上午（UTC）例行评分，趋势在 Scorecard 页面可见
  schedule:
    - cron: '43 3 * * 6'
  push:
    branches: [main]

# 评分过程本身只需要读。声明 read-all 而不是放任默认（最小权限），
# Scorecard 也会检查这一项
permissions: read-all

jobs:
  analysis:
    name: Scorecard 分析
    runs-on: ubuntu-latest
    permissions:
      # 上传 SARIF 到 code scanning 需要写安全事件
      security-events: write
      # publish_results 通过 OIDC 向 Scorecard API 发布公开评分（README 徽章的数据来源）
      id-token: write
    steps:
      - name: Checkout Repos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # 公开发布评分：README 的 Scorecard 徽章依赖这一步。
          # 发布要求仓库为公开项目，私有仓库请改回 false
          publish_results: true

      # 结果以 SARIF 上传到 code scanning，在 Security 页面可直接看到
      # 每一项检查的通过与建议——它就是一份供应链安全的体检报告
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif
