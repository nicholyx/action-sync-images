# 工作流名称
name: Check-Registry
# 工作流运行时显示名称
run-name: ${{ github.actor }} - 镜像仓库体检（${{ inputs.mode }}）

# 怎样触发工作流
#
# 只有手动触发。需要定时的使用者可以 fork 后自行加一行 schedule——
# 「什么时候去访问一批上游仓库」应该是使用者的决定，不该由项目替他做。
# 这一点与同步工作流的克制是同一条原则：只读不等于可以自作主张。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: '检查类型：audit（清单 vs 目标仓库）/ updates（清单 vs 上游）/ lock（锁文件时效校验）'
        required: true
        type: choice
        options:
          - audit
          - updates
          - lock
        default: audit
      lockfile:
        description: '镜像清单文件路径'
        required: true
        default: 'images.lock.txt'
      lock_file:
        description: '锁文件路径（--write-lock 的产物，仅 lock 模式需要；与上面的清单是两个文件）'
        required: false
        default: 'images.lock.resolved.txt'
      dest_registry:
        description: '体检的目标仓库前缀（仅 audit 需要；留空则用 ALIYUNCS_REGISTRY 变量，都没有则用内置默认值——那是项目作者示例用的命名空间，体检自己的仓库请设置该变量）'
        required: false
        default: ''
      updates_limit:
        description: 'updates 模式下每个仓库最多列出几条未收录的 tag（总数始终会报）'
        required: false
        default: '5'
      filter:
        description: '只检查匹配该正则的镜像（ERE，例如 kube-；留空则全部检查）'
        required: false
        default: ''
      exclude:
        description: '跳过匹配该正则的镜像（ERE，例如 apiserver；留空则不排除）'
        required: false
        default: ''
      notify_on:
        description: '通知时机：failure（仅在有落后/缺失/无法判定时推送）或 always'
        required: false
        type: choice
        options:
          - failure
          - always
        default: failure

# 只读检查：不推送任何东西，因此只需要读代码的权限
permissions:
  contents: read

jobs:
  check:
    name: 只读体检
    runs-on: ubuntu-latest
    env:
      MODE: ${{ inputs.mode }}
      LOCKFILE: ${{ inputs.lockfile }}
      LOCK_FILE: ${{ inputs.lock_file }}
      DEST_REGISTRY: ${{ inputs.dest_registry || vars.ALIYUNCS_REGISTRY || 'registry.cn-shenzhen.aliyuncs.com/nicholyx' }}
      # 内置默认值的字面量副本，与两个同步工作流保持同一份。
      # 单独放着是为了让判据能写成「目标是否**等于**默认值」，而不是「值里含
      # nicholyx」——后者会误伤把区域换到杭州、却保留了同名命名空间的使用者。
      DEFAULT_DEST: 'registry.cn-shenzhen.aliyuncs.com/nicholyx'
      # 用来判断「这是不是作者自己的仓库」——作者的仓库不该被打扰
      REPO_OWNER: ${{ github.repository_owner }}
      UPDATES_LIMIT: ${{ inputs.updates_limit }}
      FILTER_REGEX: ${{ inputs.filter }}
      EXCLUDE_REGEX: ${{ inputs.exclude }}
      NOTIFY_ON: ${{ inputs.notify_on }}
      NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
      # 与同步工作流同一套源凭证：清单里混有私有仓库时按需配置
      SYNC_SRC_USERNAME: ${{ secrets.SRC_REGISTRY_USERNAME }}
      SYNC_SRC_PASSWORD: ${{ secrets.SRC_REGISTRY_PASSWORD }}
      SYNC_SRC_CREDENTIALS: ${{ secrets.SRC_CREDENTIALS }}
    steps:
      - name: Checkout Repos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 只读检查用不到 git 凭证，不持久化，
          # 让 checkout 之后的任何脚本都拿不到 GITHUB_TOKEN
          persist-credentials: false

      # audit 要读目标的私有仓库，需要推送凭证同款的读权限；
      # updates 与 lock 只查上游，完全不碰目标，因此不必登录。
      - name: Login to Registry（仅 audit 需要）
        if: inputs.mode == 'audit'
        env:
          REGISTRY_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 体检对象就是 DEST_REGISTRY。默认值仍是作者示例用的命名空间——fork 后
          # 不设 ALIYUNCS_REGISTRY 的话，**体检的是作者的仓库**：那边镜像齐全时
          # 报告会显示「全部最新」，而你自己的仓库其实是空的。
          #
          # 这比同步路径上的同一问题更严重：同步会推送失败（能看见），体检却给出
          # 一个假绿的结论。所以先提示一句。
          #
          # 放在凭证检查之前——有没有凭证，与「目标是不是作者的」是两回事。
          if [[ "$DEST_REGISTRY" == "$DEFAULT_DEST" && "$REPO_OWNER" != "nicholyx" ]]; then
            echo "::warning::体检的目标仓库是内置的示例默认值（${DEFAULT_DEST}，项目作者的命名空间）——本次结果描述的是那个仓库，不是你的。要体检自己的仓库，请在 Settings → Secrets and variables → Actions → Variables 里设置 ALIYUNCS_REGISTRY；若你确实在用这个命名空间，可忽略本条。"
          fi

          # 凭证是可选的：公开仓库匿名就能读，没配凭证不该让整个体检失败，
          # 只是私有仓库会被报成「无法判定」——这比报错更贴近实际状态
          if [[ -z "$REGISTRY_USERNAME" || -z "$REGISTRY_PASSWORD" ]]; then
            echo "未配置仓库凭证，按匿名访问处理（公开仓库不受影响）"
            exit 0
          fi

          registry_host="${DEST_REGISTRY%%/*}"
          echo "登录仓库：${registry_host}"
          printf '%s' "${REGISTRY_PASSWORD}" | docker login "${registry_host}" \
            --username "${REGISTRY_USERNAME}" --password-stdin

      - name: 执行体检
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 清单与锁文件是两个文件：audit / updates 读清单（--file），
          # lock 读锁文件（--audit-lock <文件>）。文件缺失在这里就报错，
          # 不等脚本跑到一半才发现。
          case "$MODE" in
            lock) required_file="$LOCK_FILE"; file_label="锁文件" ;;
            *)    required_file="$LOCKFILE";  file_label="清单文件" ;;
          esac
          if [[ ! -f "$required_file" ]]; then
            echo "::error::${file_label}不存在：${required_file}"
            exit 1
          fi

          # 参数按模式组装。updates / lock 只查上游，不需要目标地址——
          # 传了会被脚本告警为「不生效」，因此这里干脆不传，
          # 保持「给什么参数就做什么事」的干净。
          case "$MODE" in
            audit)
              args=(--file "$LOCKFILE" --dest "$DEST_REGISTRY" --audit)
              ;;
            updates)
              args=(--file "$LOCKFILE" --check-updates)
              if [[ -n "$UPDATES_LIMIT" && "$UPDATES_LIMIT" != "5" ]]; then
                args+=(--updates-limit "$UPDATES_LIMIT")
              fi
              ;;
            lock)
              # 锁文件时效校验：--audit-lock 直接接锁文件路径，与清单无关
              args=(--audit-lock "$LOCK_FILE")
              ;;
            *)
              echo "::error::未知的检查类型：${MODE}（可选：audit / updates / lock）"
              exit 1
              ;;
          esac

          # --filter / --exclude 只作用于清单条目；lock 模式下显式传入
          # 会被脚本告警「不生效」，因此这里对 lock 跳过
          if [[ "$MODE" != "lock" ]]; then
            if [[ -n "$FILTER_REGEX" ]]; then
              args+=(--filter "$FILTER_REGEX")
            fi
            if [[ -n "$EXCLUDE_REGEX" ]]; then
              args+=(--exclude "$EXCLUDE_REGEX")
            fi
          fi

          # 报告落盘并上传 Artifact，与同步工作流的报告机制对齐：
          # 体检跑完什么都不留的话，结果只能截图或翻日志
          args+=(--report-dir ./reports)

          if [[ -n "$NOTIFY_WEBHOOK" ]]; then
            args+=(--notify-webhook "$NOTIFY_WEBHOOK")
            # 体检的价值在于「出问题时才打扰」，全绿的推送很快没人看
            args+=(--notify-on "$NOTIFY_ON")
          fi

          # 退出码 2 = 未得出「全部最新 / 全部一致」（有差异，或有条目没查成）。
          # 这里**就是要让步骤失败**：页面上一眼能看出哪些仓库需要关注。
          # 绿 = 一切正常，红 = 需要看看——具体是哪一种看 Step Summary。
          ./scripts/sync.sh "${args[@]}"

      - name: 上传体检报告
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: check-report
          path: reports/
          retention-days: 30
          if-no-files-found: ignore
