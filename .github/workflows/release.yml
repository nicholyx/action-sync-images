# 工作流名称
name: Release
# 工作流运行时显示名称
run-name: 发布 ${{ github.ref_name }}

# 怎样触发工作流
on:
  push:
    # 只有形如 v1.2.3 的 tag 才会触发发布
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# 创建 Release 需要写 contents 的权限
permissions:
  contents: write

jobs:
  release:
    name: 创建 GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repos
        uses: actions/checkout@v7
        with:
          # 需要完整历史，便于 GitHub 自动生成对比链接
          fetch-depth: 0

      - name: 从 CHANGELOG 提取本版本说明
        env:
          TAG: ${{ github.ref_name }}
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # tag 形如 v1.2.3，CHANGELOG 中的标题形如 ## [1.2.3] - 2026-09-11
          version="${TAG#v}"
          echo "从 CHANGELOG.md 提取版本 ${version} 的说明"

          # 取出版本标题之后、下一个版本标题之前的内容
          awk -v ver="$version" '
            BEGIN { found = 0 }
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]") > 0) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "::warning::CHANGELOG.md 中没有找到 ${version} 的条目，将改用 GitHub 自动生成的说明"
            {
              echo "本版本未在 CHANGELOG.md 中登记，以下为自动生成的变更列表。"
              echo ""
              echo "> 维护者请在发布后补充 CHANGELOG 条目。"
            } > release-notes.md
          else
            echo "已提取 $(wc -l < release-notes.md) 行说明"
          fi

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 预发布版本（如 v1.2.3-rc.1）不标记为 latest
          prerelease_flag=""
          if [[ "$TAG" == *-* ]]; then
            prerelease_flag="--prerelease"
            echo "检测到预发布版本标记"
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --verify-tag \
            ${prerelease_flag}

          echo "✅ Release ${TAG} 已创建"
          echo "### 🚀 Release [${TAG}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}) 已发布" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # CHANGELOG 提交流程提示
  # 发布后提醒维护者把 Unreleased 段落归位，避免日志越积越乱。
  # ---------------------------------------------------------------------------
  remind:
    name: 检查 CHANGELOG 是否已归位
    runs-on: ubuntu-latest
    needs: release
    permissions:
      issues: write
    steps:
      - name: Checkout Repos
        uses: actions/checkout@v7

      - name: 检查 Unreleased 段落是否仍然存在
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          if grep -q '^## \[Unreleased\]' CHANGELOG.md; then
            echo "✓ CHANGELOG 中保留了 Unreleased 段落"
          else
            echo "::warning::CHANGELOG.md 中缺少 [Unreleased] 段落，请在下次改动时补回"
          fi
