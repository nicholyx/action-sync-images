# 工作流名称
name: Sync-Images-to-AliYuncs
# 工作流运行时显示名称（带上源镜像，便于在 Actions 列表中区分每次同步）
run-name: ${{ github.actor }} - Sync ${{ inputs.images_src }} to AliYuncs.

# 怎样触发工作流
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      images_src:
        description: '源镜像（无需 docker:// 前缀）。多个镜像用换行或逗号分隔'
        required: true
      strip_attestation:
        description: '剔除 attestation manifest（源镜像带 provenance/SBOM 时勾选，如 netbirdio）'
        required: false
        type: boolean
        default: false
      platforms:
        description: '保留哪些平台，逗号分隔（留空则自动探测；仅在勾选剔除 attestation 时生效）'
        required: false
        default: ''
      concurrency:
        description: '并发同步的镜像数量，批量同步时能显著提速（建议 4~8，过高可能被上游限流）'
        required: false
        default: '4'
      skip_existing:
        description: '跳过目标仓库中已存在且完全相同的镜像（增量同步，重复运行会快很多）'
        required: false
        type: boolean
        default: true
      verify:
        description: '同步后逐平台校验目标与源的内容一致（每个镜像多两次 inspect，大清单会变慢）'
        required: false
        type: boolean
        default: false
      dry_run:
        description: '仅预览将要执行的命令，不实际推送'
        required: false
        type: boolean
        default: false
      notify_after_failures:
        description: '同一个镜像连续失败多少次才通知（默认 1 = 每次都通知；调大可对抗通知疲劳）'
        required: false
        default: '1'

# 只需要读代码，推送凭证通过 Secrets 注入
permissions:
  contents: read

# 工作流程任务（通常含有一个或多个步骤）
jobs:
  sync-images:
    name: 同步到阿里云 ACR
    runs-on: ubuntu-latest
    env:
      # 目标仓库前缀（registry host + 命名空间）。
      # 需要更换仓库时，在 Settings → Secrets and variables → Variables 新增
      # ALIYUNCS_REGISTRY 覆盖即可，无需修改本文件；未设置则使用下面的默认值。
      # 注意：默认值是**项目作者示例用的命名空间**，不是你的——登录步骤里会提示。
      DEST_REGISTRY: ${{ vars.ALIYUNCS_REGISTRY || 'registry.cn-shenzhen.aliyuncs.com/nicholyx' }}
      # 上面那个内置默认值的字面量，供登录步骤里做「是否仍在用示例默认值」的判断。
      # 单独写一份而不是从 DEST_REGISTRY 反推：判据是「目标是否**等于**内置默认值」，
      # 与「值里恰好含作者的命名空间名」是两回事——后者会误伤把区域换到杭州、
      # 却保留了同名命名空间的使用者。
      DEFAULT_DEST: 'registry.cn-shenzhen.aliyuncs.com/nicholyx'
      # 仓库 owner，用来判断这是不是作者自己的仓库（见登录步骤）。
      # 用 owner 判断而不是猜字符串，作者自己的运行不受打扰。
      REPO_OWNER: ${{ github.repository_owner }}
    steps:
      - name: Checkout Repos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # CI 用不到 git 凭证（推送走 docker 凭证），不持久化，
          # 让 checkout 之后的任何脚本都拿不到 GITHUB_TOKEN
          persist-credentials: false

      - name: Login to AliYuncs Registry
        env:
          REGISTRY_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          # 默认目标是**项目作者示例用的命名空间**。使用者 fork 后如果不设
          # ALIYUNCS_REGISTRY，就会往那里推——阿里云的命名空间是**账号内唯一**而非
          # 全局唯一，所以如果他恰好建了同名的能成功（只是推到了自己账号下），否则
          # 就是 denied。两种情况下他都不知道自己在用谁的默认值，所以提示一句。
          #
          # 只提示、不阻断：默认值可能是使用者的合法选择（见上）。
          if [[ "$DEST_REGISTRY" == "$DEFAULT_DEST" && "$REPO_OWNER" != "nicholyx" ]]; then
            echo "::warning::目标仓库是内置的示例默认值（${DEFAULT_DEST}，项目作者的命名空间）。要同步到你自己的仓库，请在 Settings → Secrets and variables → Actions → Variables 里设置 ALIYUNCS_REGISTRY；若你确实在用这个命名空间，可忽略本条。"
          fi
          # 取目标地址第一段作为 registry host，更换仓库地址后登录地址会自动跟随
          registry_host="${DEST_REGISTRY%%/*}"
          echo "登录仓库：${registry_host}"
          printf '%s' "${REGISTRY_PASSWORD}" | docker login "${registry_host}" \
            --username "${REGISTRY_USERNAME}" --password-stdin

      - name: 执行镜像同步
        env:
          IMAGES_SRC: ${{ inputs.images_src }}
          PLATFORMS: ${{ inputs.platforms }}
          STRIP_ATTESTATION: ${{ inputs.strip_attestation }}
          CONCURRENCY: ${{ inputs.concurrency }}
          SKIP_EXISTING: ${{ inputs.skip_existing }}
          VERIFY: ${{ inputs.verify }}
          DRY_RUN: ${{ inputs.dry_run }}
          # 可选：在仓库 Secrets 中配置 NOTIFY_WEBHOOK 即可启用结果通知。
          # 未配置时为空字符串，脚本不会发送任何通知。
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
          NOTIFY_AFTER_FAILURES: ${{ inputs.notify_after_failures }}
          # 可选：同步私有源镜像时，在仓库 Secrets 中配置这两个。
          # 用环境变量而不是命令行参数传：参数既对同机进程可见，也会被下面那句
          # 「执行：./scripts/sync.sh ${args[*]}」原样打进日志。
          SYNC_SRC_USERNAME: ${{ secrets.SRC_REGISTRY_USERNAME }}
          SYNC_SRC_PASSWORD: ${{ secrets.SRC_REGISTRY_PASSWORD }}
          # 可选：清单混有多个私有源时，配置 SRC_CREDENTIALS（内容为
          # 「host 用户名 密码」多行文本）替代上面两个单值 Secret。
          # 两者同时配置会直接报错——语义只能靠猜的用法一律拒绝
          SYNC_SRC_CREDENTIALS: ${{ secrets.SRC_CREDENTIALS }}
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # 所有参数都经 env 中转后再引用，避免表达式注入
          args=(--src "$IMAGES_SRC" --dest "$DEST_REGISTRY" --report-dir ./reports)

          if [[ "$STRIP_ATTESTATION" == "true" ]]; then
            args+=(--strip-attestation)
          fi
          if [[ -n "$PLATFORMS" ]]; then
            args+=(--platforms "$PLATFORMS")
          fi
          if [[ -n "$CONCURRENCY" ]]; then
            args+=(--concurrency "$CONCURRENCY")
          fi
          if [[ "$SKIP_EXISTING" == "true" ]]; then
            args+=(--skip-existing)
          fi
          if [[ "$VERIFY" == "true" ]]; then
            args+=(--verify)
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          if [[ -n "$NOTIFY_WEBHOOK" ]]; then
            args+=(--notify-webhook "$NOTIFY_WEBHOOK")
            # 连续失败阈值依赖下载本工作流的历史报告，Artifact 名必须对上
            args+=(--history-artifact sync-report-aliyuncs)
          fi
          if [[ -n "$NOTIFY_AFTER_FAILURES" && "$NOTIFY_AFTER_FAILURES" != "1" ]]; then
            args+=(--notify-after-failures "$NOTIFY_AFTER_FAILURES")
          fi

          echo "执行：./scripts/sync.sh ${args[*]}"
          ./scripts/sync.sh "${args[@]}"

      - name: 上传同步报告
        # 无论成功失败都上传，失败的运行更需要这份报告
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sync-report-aliyuncs
          path: reports/
          retention-days: 30
          if-no-files-found: ignore
