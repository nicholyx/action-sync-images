# 工作流名称
name: Sync-Images-to-AliYuncs
# 工作流运行时显示名称
run-name: ${{ github.actor }} - Sync Images to AliYuncs.
# 怎样触发工作流
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      images_src:
        description: '源镜像'
        required: true
      strip_attestation:
        description: '剔除 attestation manifest（源镜像带 provenance/SBOM 时勾选，如 netbirdio）'
        required: false
        type: boolean
        default: false

# 工作流程任务（通常含有一个或多个步骤）
jobs:
  sync-images:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repos
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2.9.1

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        registry: registry.cn-shenzhen.aliyuncs.com
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        logout: false

    - name: Use Skopeo Tools Sync Image to Docker Hub
      if: ${{ inputs.strip_attestation != true }}
      run: |
        #!/usr/bin/env bash
        str="${{ inputs.images_src }}"
        # 替换字符串中的 / 为 __
        new_images="${str//\//_}"
        echo "$new_images"
        
        echo "源镜像：${{ inputs.images_src }}"
        echo "目标镜像：registry.cn-shenzhen.aliyuncs.com/nicholyx/${new_images}"
        skopeo copy --all docker://${{ inputs.images_src }} docker://registry.cn-shenzhen.aliyuncs.com/nicholyx/${new_images}

    - name: Use regctl Sync Image to AliYuncs (strip attestation)
      if: ${{ inputs.strip_attestation == true }}
      run: |
        #!/usr/bin/env bash
        set -euo pipefail
        # 安装 regctl (regclient)，直接从 GitHub Releases 下载官方二进制
        mkdir -p "$HOME/.regclient/bin"
        curl -sSfL "https://github.com/regclient/regclient/releases/latest/download/regctl-linux-amd64" \
          -o "$HOME/.regclient/bin/regctl"
        chmod +x "$HOME/.regclient/bin/regctl"
        echo "$HOME/.regclient/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.regclient/bin:$PATH"

        str="${{ inputs.images_src }}"
        # regctl 引用不带 docker:// 前缀
        src="${str#docker://}"
        # 替换字符串中的 / 为 __
        new_images="${str//\//_}"
        echo "源镜像：$src"
        echo "目标镜像：registry.cn-shenzhen.aliyuncs.com/nicholyx/${new_images}"
        # 只拷贝 amd64/arm64，attestation manifest（platform 为空）会被自动剔除，
        # 规避阿里云 ACR 对 OCI 1.1 空 blob 的 "unknown manifest class" 拒绝
        regctl image copy --platforms linux/amd64 --platforms linux/arm64 \
          "$src" "registry.cn-shenzhen.aliyuncs.com/nicholyx/${new_images}"

