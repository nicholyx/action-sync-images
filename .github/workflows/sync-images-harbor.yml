# 工作流名称
name: Sync-Images-to-Harbor
# 工作流运行时显示名称（带上源镜像，便于在 Actions 列表中区分每次同步）
run-name: ${{ github.actor }} - Sync ${{ inputs.images_src }} to Harbor.

# 怎样触发工作流
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      images_src:
        description: '源镜像（无需 docker:// 前缀）。多个镜像用换行或逗号分隔'
        required: true
      images_dest:
        description: '目标镜像路径，拼接在 HARBOR_REGISTRY 之后（例如：library/nginx:1.27）'
        required: true
      concurrency:
        description: '并发同步的镜像数量（仅在填了多个源镜像时有意义）'
        required: false
        default: '4'
      skip_existing:
        description: '跳过目标仓库中已存在且完全相同的镜像'
        required: false
        type: boolean
        default: true
      verify:
        description: '同步后逐平台校验目标与源的内容一致（每个镜像多两次 inspect，大清单会变慢）'
        required: false
        type: boolean
        default: false
      dry_run:
        description: '仅预览将要执行的命令，不实际推送'
        required: false
        type: boolean
        default: false
      notify_after_failures:
        description: '同一个镜像连续失败多少次才通知（默认 1 = 每次都通知；调大可对抗通知疲劳）'
        required: false
        default: '1'

# 只需要读代码，推送凭证通过 Secrets 注入
permissions:
  contents: read

# 工作流程任务（通常含有一个或多个步骤）
jobs:
  sync-images:
    name: 同步到 Harbor
    runs-on: ubuntu-latest
    env:
      HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
    steps:
      - name: Checkout Repos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # CI 用不到 git 凭证（推送走 docker 凭证），不持久化，
          # 让 checkout 之后的任何脚本都拿不到 GITHUB_TOKEN
          persist-credentials: false

      - name: Login to Harbor
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
          logout: false

      - name: 执行镜像同步
        # Harbor 的目标路径由用户显式给出，可能带多级路径，
        # 因此这里不能套用阿里云那套「把 / 换成 _」的扁平化规则：
        # sync.sh 负责搬运，目标地址在调用前就拼好。
        env:
          IMAGES_SRC: ${{ inputs.images_src }}
          IMAGES_DEST: ${{ inputs.images_dest }}
          CONCURRENCY: ${{ inputs.concurrency }}
          SKIP_EXISTING: ${{ inputs.skip_existing }}
          VERIFY: ${{ inputs.verify }}
          DRY_RUN: ${{ inputs.dry_run }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
          NOTIFY_AFTER_FAILURES: ${{ inputs.notify_after_failures }}
          # 可选：源镜像若来自私有仓库，配置这两个 Secrets。
          # 走环境变量而非命令行参数，避免凭证被打印进日志。
          SYNC_SRC_USERNAME: ${{ secrets.SRC_REGISTRY_USERNAME }}
          SYNC_SRC_PASSWORD: ${{ secrets.SRC_REGISTRY_PASSWORD }}
          # 可选：清单混有多个私有源时，配置 SRC_CREDENTIALS（内容为
          # 「host 用户名 密码」多行文本）替代上面两个单值 Secret。
          # 两者同时配置会直接报错——语义只能靠猜的用法一律拒绝
          SYNC_SRC_CREDENTIALS: ${{ secrets.SRC_CREDENTIALS }}
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          [[ -n "$HARBOR_REGISTRY" ]] || { echo "::error::未配置 HARBOR_REGISTRY"; exit 1; }

          # 目标地址 = Harbor 地址 + 用户给定路径，例如
          #   harbor.example.com/library/nginx:1.27
          # 这里的路径由用户完全指定，所以用 --dest-exact 而非前缀模式，
          # 避免 sync.sh 再拼接一次源镜像名。兼容以 / 开头的写法。
          dest="${HARBOR_REGISTRY}/${IMAGES_DEST#/}"

          args=(--src "$IMAGES_SRC" --dest-exact "$dest" --report-dir ./reports)

          if [[ -n "$CONCURRENCY" ]]; then
            args+=(--concurrency "$CONCURRENCY")
          fi
          if [[ "$SKIP_EXISTING" == "true" ]]; then
            args+=(--skip-existing)
          fi
          if [[ "$VERIFY" == "true" ]]; then
            args+=(--verify)
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          if [[ -n "$NOTIFY_WEBHOOK" ]]; then
            args+=(--notify-webhook "$NOTIFY_WEBHOOK")
            # 连续失败阈值依赖下载本工作流的历史报告，Artifact 名必须对上
            args+=(--history-artifact sync-report-harbor)
          fi
          if [[ -n "$NOTIFY_AFTER_FAILURES" && "$NOTIFY_AFTER_FAILURES" != "1" ]]; then
            args+=(--notify-after-failures "$NOTIFY_AFTER_FAILURES")
          fi

          echo "执行：./scripts/sync.sh ${args[*]}"
          ./scripts/sync.sh "${args[@]}"

      - name: 上传同步报告
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sync-report-harbor
          path: reports/
          retention-days: 30
          if-no-files-found: ignore
