# 工作流名称
name: Sync-Batch
# 工作流运行时显示名称
run-name: ${{ github.actor }} - 批量同步镜像清单

# 怎样触发工作流
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      lockfile:
        description: '镜像清单文件路径'
        required: true
        default: 'images.lock.txt'
      dest_registry:
        description: '目标仓库前缀（留空则用 ALIYUNCS_REGISTRY 变量；都没有则用内置默认值——那是项目作者示例用的命名空间，同步到自己的仓库请设置该变量）'
        required: false
        default: ''
      concurrency:
        description: '并发同步的镜像数量（清单通常有几十个条目，调大可显著缩短耗时）'
        required: false
        default: '6'
      skip_existing:
        description: '跳过目标仓库中已存在且完全相同的镜像（定期同步时绝大部分都会被跳过）'
        required: false
        type: boolean
        default: true
      verify:
        description: '同步后逐平台校验目标与源的内容一致（每个镜像多两次 inspect，大清单会变慢）'
        required: false
        type: boolean
        default: false
      dry_run:
        description: '仅预览将要执行的命令，不实际推送'
        required: false
        type: boolean
        default: false
      notify_after_failures:
        description: '同一个镜像连续失败多少次才通知（默认 1 = 每次都通知；调大可对抗通知疲劳）'
        required: false
        default: '1'
      filter:
        description: '只同步匹配该正则的镜像（ERE，例如 kube-；留空则全部同步）'
        required: false
        default: ''
      exclude:
        description: '跳过匹配该正则的镜像（ERE，例如 apiserver；留空则不排除）'
        required: false
        default: ''

  # ---------------------------------------------------------------------------
  # 定时同步（默认关闭）
  #
  # 打开后会每天自动把清单里的镜像同步一遍，好处是上游更新了 tag 也能跟上。
  # 开启前请留意两点：
  #   1. 会持续消耗 Actions 额度与镜像仓库存储
  #   2. 清单里的 tag 若是可变的（如 latest），每次都会重新拉取
  # 确认清楚后再取消下面的注释。
  # ---------------------------------------------------------------------------
  # schedule:
  #   - cron: '17 18 * * *'

# 只需要读代码，推送凭证通过 Secrets 注入
permissions:
  contents: read

jobs:
  sync-batch:
    name: 批量同步清单中的镜像
    runs-on: ubuntu-latest
    env:
      # 目标仓库前缀，优先级：工作流输入 > ALIYUNCS_REGISTRY 变量 > 内置默认值。
      # 注意：最后的默认值是**项目作者示例用的命名空间**，不是你的——登录步骤里会提示。
      DEST_REGISTRY: ${{ inputs.dest_registry || vars.ALIYUNCS_REGISTRY || 'registry.cn-shenzhen.aliyuncs.com/nicholyx' }}
      # 上面那个内置默认值的字面量，供登录步骤里做「是否仍在用示例默认值」的判断。
      # 单独写一份而不是从 DEST_REGISTRY 反推：判据是「目标是否**等于**内置默认值」，
      # 与「值里恰好含作者的命名空间名」是两回事——后者会误伤把区域换到杭州、
      # 却保留了同名命名空间的使用者。
      DEFAULT_DEST: 'registry.cn-shenzhen.aliyuncs.com/nicholyx'
      # 仓库 owner，用来判断这是不是作者自己的仓库（见登录步骤）。
      # 用 owner 判断而不是猜字符串，作者自己的运行不受打扰。
      REPO_OWNER: ${{ github.repository_owner }}
    steps:
      - name: Checkout Repos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # CI 用不到 git 凭证（推送走 docker 凭证），不持久化，
          # 让 checkout 之后的任何脚本都拿不到 GITHUB_TOKEN
          persist-credentials: false

      - name: Login to AliYuncs Registry
        env:
          REGISTRY_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          # 默认目标是**项目作者示例用的命名空间**。使用者 fork 后如果不设
          # ALIYUNCS_REGISTRY（也没在这次运行里填 dest_registry），就会往那里推——
          # 阿里云的命名空间是**账号内唯一**而非全局唯一，所以如果他恰好建了同名的
          # 能成功（只是推到了自己账号下），否则就是 denied。两种情况下他都不知道
          # 自己在用谁的默认值，所以提示一句。
          #
          # 只提示、不阻断：默认值可能是使用者的合法选择（见上）。
          if [[ "$DEST_REGISTRY" == "$DEFAULT_DEST" && "$REPO_OWNER" != "nicholyx" ]]; then
            echo "::warning::目标仓库是内置的示例默认值（${DEFAULT_DEST}，项目作者的命名空间）。要同步到你自己的仓库，请在 Settings → Secrets and variables → Actions → Variables 里设置 ALIYUNCS_REGISTRY；若你确实在用这个命名空间，可忽略本条。"
          fi
          registry_host="${DEST_REGISTRY%%/*}"
          echo "登录仓库：${registry_host}"
          printf '%s' "${REGISTRY_PASSWORD}" | docker login "${registry_host}" \
            --username "${REGISTRY_USERNAME}" --password-stdin

      - name: 执行批量同步
        env:
          LOCKFILE: ${{ inputs.lockfile }}
          CONCURRENCY: ${{ inputs.concurrency }}
          SKIP_EXISTING: ${{ inputs.skip_existing }}
          VERIFY: ${{ inputs.verify }}
          DRY_RUN: ${{ inputs.dry_run }}
          FILTER_REGEX: ${{ inputs.filter }}
          EXCLUDE_REGEX: ${{ inputs.exclude }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
          NOTIFY_AFTER_FAILURES: ${{ inputs.notify_after_failures }}
          # 可选：清单里若有私有仓库的镜像，配置这两个 Secrets 即可。
          # 走环境变量而非命令行参数，避免凭证被打印进日志。
          SYNC_SRC_USERNAME: ${{ secrets.SRC_REGISTRY_USERNAME }}
          SYNC_SRC_PASSWORD: ${{ secrets.SRC_REGISTRY_PASSWORD }}
          # 可选：清单混有多个私有源时，配置 SRC_CREDENTIALS（内容为
          # 「host 用户名 密码」多行文本）替代上面两个单值 Secret。
          # 两者同时配置会直接报错——语义只能靠猜的用法一律拒绝
          SYNC_SRC_CREDENTIALS: ${{ secrets.SRC_CREDENTIALS }}
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          if [[ ! -f "$LOCKFILE" ]]; then
            echo "::error::清单文件不存在：${LOCKFILE}"
            exit 1
          fi

          # 提前统计一下有多少条有效条目，方便在日志里先给个预期
          image_count="$(grep -vcE '^\s*(#|$)' "$LOCKFILE" || true)"
          echo "清单 ${LOCKFILE} 中共有 ${image_count} 个镜像"
          if [[ -n "$FILTER_REGEX" || -n "$EXCLUDE_REGEX" ]]; then
            echo "已设置筛选条件，实际同步数量可能少于此数——以同步报告中的「已排除」标注为准"
          fi

          if [[ "$image_count" -eq 0 ]]; then
            echo "::error::清单文件中没有任何启用的镜像条目（是否全被注释掉了？）"
            exit 1
          fi

          args=(--file "$LOCKFILE" --dest "$DEST_REGISTRY" --report-dir ./reports)

          if [[ -n "$CONCURRENCY" ]]; then
            args+=(--concurrency "$CONCURRENCY")
          fi
          if [[ "$SKIP_EXISTING" == "true" ]]; then
            args+=(--skip-existing)
          fi
          if [[ "$VERIFY" == "true" ]]; then
            args+=(--verify)
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          if [[ -n "$FILTER_REGEX" ]]; then
            args+=(--filter "$FILTER_REGEX")
          fi
          if [[ -n "$EXCLUDE_REGEX" ]]; then
            args+=(--exclude "$EXCLUDE_REGEX")
          fi
          if [[ -n "$NOTIFY_WEBHOOK" ]]; then
            args+=(--notify-webhook "$NOTIFY_WEBHOOK")
            # 连续失败阈值依赖下载本工作流的历史报告，Artifact 名必须对上
            args+=(--history-artifact sync-report-batch)
          fi
          if [[ -n "$NOTIFY_AFTER_FAILURES" && "$NOTIFY_AFTER_FAILURES" != "1" ]]; then
            args+=(--notify-after-failures "$NOTIFY_AFTER_FAILURES")
          fi

          ./scripts/sync.sh "${args[@]}"

      - name: 上传同步报告
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sync-report-batch
          path: reports/
          retention-days: 30
          if-no-files-found: ignore
