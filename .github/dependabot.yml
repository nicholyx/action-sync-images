# Dependabot 配置
#
# 本项目没有语言层面的依赖包，唯一的依赖是工作流里引用的 GitHub Actions。
# 让 Dependabot 盯着它们，可以及时拿到安全修复与新版本。
#
# 文档：https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # 保持 .github/workflows/ 中引用的 Actions 处于最新版本
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    # 冷却期：新版本发布后等 7 天才提 PR。_actions 的 tag 被改投恶意代码、
    # 或新版本本身有问题时，冷却期让问题有机会先暴露出来
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - ci
    commit-message:
      # 生成的提交信息本身即符合约定式提交规范，CI 不会拦
      prefix: "ci"
      include: "scope"
    # 把同一个 Actions 的主版本更新合并到一个 PR，避免 PR 数量爆炸
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    reviewers:
      - "nicholyx"
