  - name: 💬 提问与讨论
    url: https://github.com/nicholyx/action-sync-images/discussions
    about: 使用方式上的疑问、想法交流，欢迎到 Discussions，不必开 Issue。

  - name: 📚 排错文档
    url: https://github.com/nicholyx/action-sync-images/blob/main/docs/TROUBLESHOOTING.md
    about: 同步失败？常见错误与解决办法都整理在这里了。
