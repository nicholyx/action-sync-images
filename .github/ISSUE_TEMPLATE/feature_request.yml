name: 💡 功能请求
description: 提出一个新能力或改进建议
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出想法！为了让讨论更高效，请尽量说明**你遇到的实际问题**，
        而不只是「希望增加 X 功能」。了解问题背景，我们往往能找到比原方案更好的解法。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue 与 Pull Request，确认没有重复
          required: true
        - label: 我已阅读 README 中的功能说明，确认现有能力无法满足
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 描述你当前的困境。这是整个请求里最重要的部分
      placeholder: |
        我们的集群是混合架构的，每次同步完镜像还要手动确认 arm64 那一层有没有丢。
        目前工作流只在失败时报错，成功的时候看不出来到底同步了几个平台。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你希望怎么解决
      description: 如果你有具体的实现想法，写在这里
      placeholder: |
        希望在运行结束后输出一个表格，列出每个镜像同步了哪些架构。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 有没有别的做法也能解决这个问题？为什么你更倾向于上面的方案？
    validations:
      required: false

  - type: dropdown
    id: willing
    attributes:
      label: 你愿意参与实现吗
      description: 无论选哪个都不影响我们接受这个建议，只是想了解你的意向
      options:
        - 愿意，我可以提 PR
        - 愿意，但需要有人指导
        - 暂时没有精力，仅提出建议
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 相关链接、截图、其他项目的实现参考等
    validations:
      required: false
